<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>VEO · Feedback</title>
  <style>
    :root{
      --bg:#050a16;
      --surface:#0d1524;
      --surface2:#16203a;
      --line:#22304f;
      --text:#e9f0ff;
      --muted:#8695b5;
      --accent:#3d8bff;
      --accent2:#c040f0;
      --accentText:#04070f;
      --danger:#ff9d8a;
      --success:#8ee6ad;
    }

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    body{
      min-height:100svh;
      background:
        radial-gradient(circle at 50% -10%, rgba(61,139,255,.18), transparent 34%),
        radial-gradient(circle at 92% 18%, rgba(192,64,240,.09), transparent 30%),
        var(--bg);
    }

    .page{
      width:min(100%,680px);
      margin:0 auto;
      min-height:100svh;
      padding:18px clamp(16px,4vw,28px) calc(104px + env(safe-area-inset-bottom));
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:28px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:11px;
    }

    .app-logo{
      width:42px;
      height:42px;
      border-radius:12px;
      display:block;
      object-fit:contain;
      filter:drop-shadow(0 8px 20px rgba(61,139,255,.22));
    }

    .brand-copy{
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .logo{
      font-weight:900;
      letter-spacing:.12em;
      font-size:19px;
      line-height:1;
    }

    .tag{
      font-size:12px;
      color:var(--muted);
      line-height:1.1;
    }

    h1{
      margin:0 0 8px;
      font-size:clamp(28px,7vw,38px);
      line-height:1.08;
      letter-spacing:-.02em;
    }

    .lead{
      margin:0 0 24px;
      color:var(--muted);
      font-size:15px;
      line-height:1.55;
    }

    .segmented{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      background:#08101f;
      border:1px solid var(--line);
      padding:6px;
      border-radius:16px;
      margin-bottom:22px;
    }

    .segmented input{
      position:absolute;
      opacity:0;
      pointer-events:none;
    }

    .segmented label{
      min-height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      border-radius:11px;
      color:#b9c3d1;
      font-weight:750;
      cursor:pointer;
      user-select:none;
      transition:.16s ease;
    }

    .segmented input:checked + label{
      background:linear-gradient(135deg,rgba(61,139,255,.22),rgba(192,64,240,.12));
      color:var(--text);
      border:1px solid rgba(61,139,255,.35);
      box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 8px 24px rgba(61,139,255,.10);
    }

    .section{
      margin-top:18px;
    }

    .section-title{
      font-size:12px;
      color:var(--muted);
      margin:0 0 8px 4px;
      font-weight:700;
    }

    .group{
      border:1px solid var(--line);
      background:var(--surface);
      border-radius:17px;
      overflow:hidden;
    }

    .row{
      min-height:58px;
      display:grid;
      grid-template-columns:120px 1fr;
      align-items:center;
      gap:12px;
      padding:0 14px;
    }

    .row + .row{
      border-top:1px solid var(--line);
    }

    .row label{
      color:#cbd3df;
      font-size:14px;
      font-weight:650;
    }

    select,input,textarea{
      width:100%;
      font:inherit;
      color:var(--text);
      background:transparent;
      border:0;
      outline:0;
    }

    select{
      min-height:56px;
      text-align:right;
      color:#eef2f7;
      font-weight:600;
      cursor:pointer;
    }

    select option{
      background:#111720;
      color:#fff;
    }

    .message{
      padding:14px;
    }

    .message label{
      display:block;
      font-size:14px;
      font-weight:750;
      margin-bottom:10px;
    }

    textarea{
      min-height:120px;
      line-height:1.55;
      resize:vertical;
      background:var(--surface2);
      border:1px solid var(--line);
      border-radius:13px;
      padding:13px 14px;
      font-size:16px;
    }

    textarea::placeholder,input::placeholder{
      color:#697588;
    }

    details{
      margin-top:14px;
      border:1px solid var(--line);
      border-radius:15px;
      background:#08101f;
      overflow:hidden;
    }

    summary{
      list-style:none;
      cursor:pointer;
      padding:15px 16px;
      font-size:14px;
      font-weight:700;
      color:#cdd5e0;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    summary::-webkit-details-marker{display:none}
    summary::after{
      content:"+";
      font-size:20px;
      line-height:1;
      color:var(--muted);
      font-weight:400;
    }
    details[open] summary::after{content:"−"}

    .extras{
      border-top:1px solid var(--line);
      padding:14px;
      display:grid;
      gap:12px;
    }

    .extras .field{
      display:grid;
      gap:7px;
    }

    .extras label{
      font-size:12px;
      color:var(--muted);
      font-weight:700;
    }

    .extras input,
    .extras textarea{
      background:var(--surface2);
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px 13px;
      min-height:46px;
      font-size:16px;
    }

    .extras textarea{
      min-height:92px;
    }

    .bottom{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      padding:12px max(16px, env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right));
      background:linear-gradient(to top,var(--bg) 68%,rgba(11,15,20,0));
      pointer-events:none;
    }

    .bottom-inner{
      width:min(100%,648px);
      margin:0 auto;
      pointer-events:auto;
    }

    button{
      width:100%;
      min-height:54px;
      border:0;
      border-radius:15px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#fff;
      font:inherit;
      font-weight:900;
      font-size:16px;
      cursor:pointer;
      box-shadow:0 14px 34px rgba(61,139,255,.28);
    }

    button:disabled{
      opacity:.55;
      cursor:wait;
    }

    .status{
      min-height:20px;
      margin-top:8px;
      text-align:center;
      font-size:12px;
      color:var(--muted);
    }
    .status.success{color:var(--success)}
    .status.error{color:var(--danger)}

    @media (min-width:720px){
      .page{padding-top:34px}
      .topbar{margin-bottom:38px}
    }

    @media (max-width:430px){
      .page{padding-left:14px;padding-right:14px}
      .row{grid-template-columns:100px 1fr;padding:0 12px}
      .lead{font-size:14px}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="brand">
        <img class="app-logo"
             src="https://raw.githubusercontent.com/bardalas/VEO/main/app/src/main/assets/veo-mark.png"
             alt="VEO">
        <div class="brand-copy">
          <div class="logo">VEO</div>
          <div class="tag">Feedback</div>
        </div>
      </div>
      <div class="tag">User Report</div>
    </div>

    <h1>דיווח מהיר</h1>
    <p class="lead">באג או רעיון לשיפור — כמה שניות וזה אצלנו.</p>

    <form id="feedbackForm">
      <div class="segmented">
        <div>
          <input type="radio" id="bug" name="type" value="bug" checked>
          <label for="bug">🐞 מצאתי באג</label>
        </div>
        <div>
          <input type="radio" id="feature" name="type" value="feature">
          <label for="feature">💡 יש לי רעיון</label>
        </div>
      </div>

      <div class="section">
        <div class="section-title">פרטים בסיסיים</div>
        <div class="group">
          <div class="row">
            <label for="area">איפה?</label>
            <select id="area" name="area" required>
              <option value="" selected disabled>בחר אזור באפליקציה</option>
              <option>מסך הבית</option>
              <option>סרטים</option>
              <option>סדרות</option>
              <option>שידור חי</option>
              <option>חיפוש</option>
              <option>נגן וידאו</option>
              <option>הגדרות</option>
              <option>ניווט / שלט</option>
              <option>אחר</option>
            </select>
          </div>

          <div class="row">
            <label for="device">על מה?</label>
            <select id="device" name="device" required>
              <option value="" selected disabled>בחר מכשיר</option>
              <option>Android TV</option>
              <option>Google TV</option>
              <option>טלפון Android</option>
              <option>iPhone / iPad</option>
              <option>Windows</option>
              <option>דפדפן</option>
              <option>אחר</option>
            </select>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title" id="messageTitle">מה קרה?</div>
        <div class="group">
          <div class="message">
            <label for="summary" id="summaryLabel">תאר במשפט אחד</label>
            <textarea id="summary" name="summary" maxlength="120" required
              placeholder="לדוגמה: לחיצה על פרק לא מתחילה ניגון"></textarea>
          </div>
        </div>
      </div>

      <details>
        <summary>להוסיף פרטים</summary>
        <div class="extras">
          <div class="field">
            <label for="details">פרטים נוספים</label>
            <textarea id="details" name="details" maxlength="2500"
              placeholder="שלבים לשחזור, מה ציפית שיקרה, או כל פרט שיעזור לנו להבין."></textarea>
          </div>

          <div class="field">
            <label for="contact">דרך לחזור אליך — אופציונלי</label>
            <input id="contact" name="contact" maxlength="150"
              placeholder="שם / WhatsApp / אימייל">
          </div>
        </div>
      </details>

      <input type="text" name="website" tabindex="-1" autocomplete="off"
        style="position:absolute;left:-9999px;opacity:0">
    </form>
  </main>

  <div class="bottom">
    <div class="bottom-inner">
      <button id="submitBtn" type="submit" form="feedbackForm">שלח דיווח</button>
      <div id="status" class="status" aria-live="polite"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('feedbackForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const summary = document.getElementById('summary');
    const summaryLabel = document.getElementById('summaryLabel');
    const messageTitle = document.getElementById('messageTitle');

    document.querySelectorAll('input[name="type"]').forEach(el => {
      el.addEventListener('change', () => {
        const isFeature = document.getElementById('feature').checked;
        summaryLabel.textContent = isFeature ? 'מה היית רוצה שנוסיף או נשפר?' : 'תאר במשפט אחד';
        messageTitle.textContent = isFeature ? 'מה הרעיון?' : 'מה קרה?';
        summary.placeholder = isFeature
          ? 'לדוגמה: להוסיף רשימת צפייה אישית'
          : 'לדוגמה: לחיצה על פרק לא מתחילה ניגון';
        submitBtn.textContent = isFeature ? 'שלח רעיון' : 'שלח דיווח';
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      statusEl.textContent = '';
      statusEl.className = 'status';
      submitBtn.disabled = true;
      submitBtn.textContent = 'שולח...';

      const data = Object.fromEntries(new FormData(form).entries());

      try {
        const res = await fetch('/.netlify/functions/report', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(data)
        });

        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Failed');

        form.reset();
        document.getElementById('bug').checked = true;
        summaryLabel.textContent = 'תאר במשפט אחד';
        messageTitle.textContent = 'מה קרה?';
        summary.placeholder = 'לדוגמה: לחיצה על פרק לא מתחילה ניגון';

        statusEl.textContent = 'נשלח ✓';
        statusEl.className = 'status success';

        setTimeout(() => {
          statusEl.textContent = '';
          statusEl.className = 'status';
        }, 3500);

      } catch (err) {
        statusEl.textContent = 'השליחה נכשלה — נסה שוב';
        statusEl.className = 'status error';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'שלח דיווח';
      }
    });
  </script>
</body>
</html>
