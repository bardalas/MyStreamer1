<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>VEO · Feedback</title>
  <style>
    :root{
      --bg:#050a16;
      --surface:#0d1524;
      --surface2:#16203a;
      --line:#22304f;
      --text:#e9f0ff;
      --muted:#8695b5;
      --accent:#3d8bff;
      --accent2:#c040f0;
      --accentText:#04070f;
      --danger:#ff9d8a;
      --success:#8ee6ad;
    }

    *{box-sizing:border-box}
    html{
      width:100%;
      min-width:0;
      overflow-x:clip;
      max-width:100vw;
      -webkit-text-size-adjust:100%;
    }
    body{
      margin:0;
      width:100%;
      min-width:0;
      min-height:100%;
      overflow-x:clip;
      max-width:100vw;
      background:var(--bg);
      color:var(--text);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    }
    body{
      min-height:100svh;
      background:
        radial-gradient(circle at 50% -10%, rgba(61,139,255,.18), transparent 34%),
        radial-gradient(circle at 92% 18%, rgba(192,64,240,.09), transparent 30%),
        var(--bg);
    }

    .page{
      width:100%;
      max-width:680px;
      min-width:0;
      margin:0 auto;
      min-height:100svh;
      padding:18px clamp(16px,4vw,28px) calc(104px + env(safe-area-inset-bottom));
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:28px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:11px;
    }

    .app-logo{
      width:42px;
      height:42px;
      border-radius:12px;
      display:block;
      object-fit:contain;
      filter:drop-shadow(0 8px 20px rgba(61,139,255,.22));
    }

    .brand-copy{
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .logo{
      font-weight:900;
      letter-spacing:.12em;
      font-size:19px;
      line-height:1;
    }

    .tag{
      font-size:12px;
      color:var(--muted);
      line-height:1.1;
    }

    h1{
      margin:0 0 8px;
      font-size:clamp(28px,7vw,38px);
      line-height:1.08;
      letter-spacing:-.02em;
    }

    .lead{
      margin:0 0 24px;
      color:var(--muted);
      font-size:15px;
      line-height:1.55;
    }

    .segmented{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      background:#08101f;
      border:1px solid var(--line);
      padding:6px;
      border-radius:16px;
      margin-bottom:22px;
    }

    .segmented input{
      position:absolute;
      opacity:0;
      pointer-events:none;
    }

    .segmented label{
      min-height:48px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      border-radius:11px;
      color:#b9c3d1;
      font-weight:750;
      cursor:pointer;
      user-select:none;
      transition:.16s ease;
    }

    .segmented input:checked + label{
      background:linear-gradient(135deg,rgba(61,139,255,.22),rgba(192,64,240,.12));
      color:var(--text);
      border:1px solid rgba(61,139,255,.35);
      box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 8px 24px rgba(61,139,255,.10);
    }

    .section{
      margin-top:18px;
    }

    .section-title{
      font-size:12px;
      color:var(--muted);
      margin:0 0 8px 4px;
      font-weight:700;
    }

    .group{
      border:1px solid var(--line);
      background:var(--surface);
      border-radius:17px;
      overflow:hidden;
    }

    .row{
      min-height:58px;
      display:grid;
      grid-template-columns:120px 1fr;
      align-items:center;
      gap:12px;
      padding:0 14px;
    }

    .row + .row{
      border-top:1px solid var(--line);
    }

    .row label{
      color:#cbd3df;
      font-size:14px;
      font-weight:650;
    }

    select,input,textarea{
      width:100%;
      max-width:100%;
      min-width:0;
      font:inherit;
      color:var(--text);
      background:transparent;
      border:0;
      outline:0;
    }

    select{
      min-height:56px;
      text-align:right;
      color:#eef2f7;
      font-weight:600;
      cursor:pointer;
    }

    select option{
      background:#111720;
      color:#fff;
    }

    .message{
      padding:14px;
    }

    .message label{
      display:block;
      font-size:14px;
      font-weight:750;
      margin-bottom:10px;
    }

    textarea{
      min-height:120px;
      line-height:1.55;
      resize:vertical;
      background:var(--surface2);
      border:1px solid var(--line);
      border-radius:13px;
      padding:13px 14px;
      font-size:16px;
    }

    textarea::placeholder,input::placeholder{
      color:#697588;
    }

    details{
      margin-top:14px;
      border:1px solid var(--line);
      border-radius:15px;
      background:#08101f;
      overflow:hidden;
    }

    summary{
      list-style:none;
      cursor:pointer;
      padding:15px 16px;
      font-size:14px;
      font-weight:700;
      color:#cdd5e0;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    summary::-webkit-details-marker{display:none}
    summary::after{
      content:"+";
      font-size:20px;
      line-height:1;
      color:var(--muted);
      font-weight:400;
    }
    details[open] summary::after{content:"−"}

    .extras{
      border-top:1px solid var(--line);
      padding:14px;
      display:grid;
      gap:12px;
    }

    .extras .field{
      display:grid;
      gap:7px;
    }

    .extras label{
      font-size:12px;
      color:var(--muted);
      font-weight:700;
    }

    .extras input,
    .extras textarea{
      background:var(--surface2);
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px 13px;
      min-height:46px;
      font-size:16px;
    }

    .extras textarea{
      min-height:92px;
    }

    .bottom{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      padding:12px max(16px, env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right));
      background:linear-gradient(to top,var(--bg) 68%,rgba(11,15,20,0));
      pointer-events:none;
    }

    .bottom-inner{
      width:min(100%,648px);
      margin:0 auto;
      pointer-events:auto;
    }

    button{
      width:100%;
      min-height:54px;
      border:0;
      border-radius:15px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#fff;
      font:inherit;
      font-weight:900;
      font-size:16px;
      cursor:pointer;
      box-shadow:0 14px 34px rgba(61,139,255,.28);
    }

    button:disabled{
      opacity:.55;
      cursor:wait;
    }

    .status{
      min-height:20px;
      margin-top:8px;
      text-align:center;
      font-size:12px;
      color:var(--muted);
    }
    .status.success{color:var(--success)}
    .status.error{color:var(--danger)}

    /* Honeypot must not create a huge RTL scrollable canvas. */
    .hp{
      position:fixed !important;
      inset:0 auto auto 0 !important;
      width:1px !important;
      height:1px !important;
      padding:0 !important;
      margin:0 !important;
      border:0 !important;
      overflow:hidden !important;
      clip-path:inset(50%) !important;
      white-space:nowrap !important;
      opacity:0 !important;
      pointer-events:none !important;
    }

    .success-modal{
      position:fixed;
      inset:0;
      z-index:1000;
      display:none;
      align-items:center;
      justify-content:center;
      width:100dvw;
      height:100dvh;
      max-width:100vw;
      padding:20px;
      background:rgba(2,6,15,.78);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .success-modal.open{display:flex}

    .success-card{
      width:min(100%,360px);
      max-width:calc(100vw - 28px);
      padding:24px 20px 18px;
      text-align:center;
      background:linear-gradient(180deg,var(--surface2),var(--surface));
      border:1px solid rgba(61,139,255,.34);
      border-radius:22px;
      box-shadow:0 24px 70px rgba(0,0,0,.45),0 0 50px rgba(61,139,255,.13);
    }

    .success-icon{
      width:58px;
      height:58px;
      margin:0 auto 14px;
      display:grid;
      place-items:center;
      border-radius:18px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#fff;
      font-size:30px;
      font-weight:900;
      box-shadow:0 12px 32px rgba(61,139,255,.28);
    }

    .success-card h2{
      margin:0 0 8px;
      font-size:24px;
      line-height:1.15;
    }

    .success-card p{
      margin:0 0 18px;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .success-card button{
      min-height:50px;
      box-shadow:none;
    }

    @media (min-width:720px){
      .page{padding-top:34px}
      .topbar{margin-bottom:38px}
    }

    @media (max-width:600px){
      .page{
        width:100%;
        max-width:none;
        min-height:100dvh;
        margin:0;
        padding:
          max(14px, env(safe-area-inset-top))
          max(14px, env(safe-area-inset-right))
          calc(118px + env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
      }

      .topbar{
        margin-bottom:24px;
        min-width:0;
      }

      .topbar > .tag{
        display:none;
      }

      .brand{
        min-width:0;
      }

      .app-logo{
        width:38px;
        height:38px;
        border-radius:10px;
        flex:0 0 auto;
      }

      .logo{
        font-size:18px;
      }

      h1{
        font-size:30px;
        margin-bottom:7px;
      }

      .lead{
        font-size:14px;
        margin-bottom:20px;
      }

      .segmented{
        width:100%;
        margin-bottom:20px;
        padding:5px;
        gap:6px;
        border-radius:15px;
      }

      .segmented label{
        min-height:50px;
        padding:8px 6px;
        font-size:14px;
        white-space:nowrap;
      }

      .section{
        margin-top:16px;
      }

      .section-title{
        margin:0 2px 7px;
        font-size:12px;
      }

      .group{
        background:transparent;
        border:0;
        border-radius:0;
        overflow:visible;
        display:grid;
        gap:10px;
      }

      .row{
        display:block;
        min-height:0;
        padding:12px 13px 10px;
        background:var(--surface);
        border:1px solid var(--line);
        border-radius:14px;
      }

      .row + .row{
        border-top:1px solid var(--line);
      }

      .row label{
        display:block;
        margin-bottom:4px;
        font-size:12px;
        color:var(--muted);
      }

      select{
        min-height:40px;
        padding:0;
        font-size:16px;
        font-weight:700;
        text-align:right;
      }

      .message{
        padding:12px;
        background:var(--surface);
        border:1px solid var(--line);
        border-radius:14px;
      }

      .message label{
        margin-bottom:8px;
        font-size:13px;
      }

      textarea{
        min-height:112px;
        padding:12px;
        font-size:16px;
        border-radius:12px;
      }

      details{
        margin-top:12px;
        border-radius:14px;
      }

      summary{
        min-height:50px;
        padding:13px 14px;
      }

      .extras{
        padding:12px;
      }

      .extras input,
      .extras textarea{
        font-size:16px;
      }

      .bottom{
        padding:
          10px
          max(14px, env(safe-area-inset-right))
          calc(10px + env(safe-area-inset-bottom))
          max(14px, env(safe-area-inset-left));
        background:linear-gradient(to top,var(--bg) 72%,rgba(5,10,22,0));
      }

      .bottom-inner{
        width:100%;
        max-width:none;
      }

      button{
        min-height:56px;
        border-radius:14px;
        font-size:16px;
      }

      .status{
        min-height:18px;
        margin-top:6px;
      }
    }

    @media (max-width:360px){
      .page{
        padding-left:10px;
        padding-right:10px;
      }

      .segmented label{
        font-size:13px;
        gap:5px;
      }

      h1{
        font-size:27px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topbar">
      <div class="brand">
        <img class="app-logo"
             src="https://raw.githubusercontent.com/bardalas/VEO/main/app/src/main/assets/veo-mark.png"
             alt="VEO">
        <div class="brand-copy">
          <div class="logo">VEO</div>
          <div class="tag">Feedback</div>
        </div>
      </div>
      <div class="tag">User Report</div>
    </div>

    <h1>דיווח מהיר</h1>
    <p class="lead">באג או רעיון לשיפור — כמה שניות וזה אצלנו.</p>

    <form id="feedbackForm">
      <div class="segmented">
        <div>
          <input type="radio" id="bug" name="type" value="bug" checked>
          <label for="bug">🐞 מצאתי באג</label>
        </div>
        <div>
          <input type="radio" id="feature" name="type" value="feature">
          <label for="feature">💡 יש לי רעיון</label>
        </div>
      </div>

      <div class="section">
        <div class="section-title">פרטים בסיסיים</div>
        <div class="group">
          <div class="row">
            <label for="area">איפה?</label>
            <select id="area" name="area" required>
              <option value="" selected disabled>בחר אזור באפליקציה</option>
              <option>מסך הבית</option>
              <option>סרטים</option>
              <option>סדרות</option>
              <option>שידור חי</option>
              <option>חיפוש</option>
              <option>נגן וידאו</option>
              <option>הגדרות</option>
              <option>ניווט / שלט</option>
              <option>אחר</option>
            </select>
          </div>

          <div class="row">
            <label for="device">על מה?</label>
            <select id="device" name="device" required>
              <option value="" selected disabled>בחר מכשיר</option>
              <option>Android TV</option>
              <option>Google TV</option>
              <option>טלפון Android</option>
              <option>iPhone / iPad</option>
              <option>Windows</option>
              <option>דפדפן</option>
              <option>אחר</option>
            </select>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title" id="messageTitle">מה קרה?</div>
        <div class="group">
          <div class="message">
            <label for="summary" id="summaryLabel">תאר במשפט אחד</label>
            <textarea id="summary" name="summary" maxlength="120" required
              placeholder="לדוגמה: לחיצה על פרק לא מתחילה ניגון"></textarea>
          </div>
        </div>
      </div>

      <details>
        <summary>להוסיף פרטים</summary>
        <div class="extras">
          <div class="field">
            <label for="details">פרטים נוספים</label>
            <textarea id="details" name="details" maxlength="2500"
              placeholder="שלבים לשחזור, מה ציפית שיקרה, או כל פרט שיעזור לנו להבין."></textarea>
          </div>

          <div class="field">
            <label for="contact">דרך לחזור אליך — אופציונלי</label>
            <input id="contact" name="contact" maxlength="150"
              placeholder="שם / WhatsApp / אימייל">
          </div>
        </div>
      </details>

      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    </form>
  </main>

  <div class="bottom">
    <div class="bottom-inner">
      <button id="submitBtn" type="submit" form="feedbackForm">שלח דיווח</button>
      <div id="status" class="status" aria-live="polite"></div>
    </div>
  </div>

  <div id="successModal" class="success-modal" role="dialog" aria-modal="true" aria-labelledby="successTitle" aria-hidden="true">
    <div class="success-card">
      <div class="success-icon">✓</div>
      <h2 id="successTitle">תודה!</h2>
      <p>הדיווח נשלח בהצלחה.</p>
      <button id="newReportBtn" type="button">שליחת דיווח נוסף</button>
    </div>
  </div>

  <script>
    const form = document.getElementById('feedbackForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const summary = document.getElementById('summary');
    const summaryLabel = document.getElementById('summaryLabel');
    const messageTitle = document.getElementById('messageTitle');
    const successModal = document.getElementById('successModal');
    const newReportBtn = document.getElementById('newReportBtn');

    document.querySelectorAll('input[name="type"]').forEach(el => {
      el.addEventListener('change', () => {
        const isFeature = document.getElementById('feature').checked;
        summaryLabel.textContent = isFeature ? 'מה היית רוצה שנוסיף או נשפר?' : 'תאר במשפט אחד';
        messageTitle.textContent = isFeature ? 'מה הרעיון?' : 'מה קרה?';
        summary.placeholder = isFeature
          ? 'לדוגמה: להוסיף רשימת צפייה אישית'
          : 'לדוגמה: לחיצה על פרק לא מתחילה ניגון';
        submitBtn.textContent = isFeature ? 'שלח רעיון' : 'שלח דיווח';
      });
    });

    function resetForNextReport(){
      form.reset();
      document.getElementById('bug').checked = true;
      summaryLabel.textContent = 'תאר במשפט אחד';
      messageTitle.textContent = 'מה קרה?';
      summary.placeholder = 'לדוגמה: לחיצה על פרק לא מתחילה ניגון';
      submitBtn.textContent = 'שלח דיווח';
      const extraDetails = form.querySelector('details');
      if (extraDetails) extraDetails.open = false;
      statusEl.textContent = '';
      statusEl.className = 'status';
    }

    function showSuccess(){
      successModal.classList.add('open');
      successModal.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
      newReportBtn.focus();
    }

    function closeSuccess(){
      successModal.classList.remove('open');
      successModal.setAttribute('aria-hidden','true');
      document.body.style.overflow = '';
      window.scrollTo({top:0,left:0,behavior:'smooth'});
      setTimeout(() => document.getElementById('area').focus(), 250);
    }

    newReportBtn.addEventListener('click', closeSuccess);

    successModal.addEventListener('click', (e) => {
      if (e.target === successModal) closeSuccess();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && successModal.classList.contains('open')) closeSuccess();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      statusEl.textContent = '';
      statusEl.className = 'status';
      submitBtn.disabled = true;
      submitBtn.textContent = 'שולח...';

      const data = Object.fromEntries(new FormData(form).entries());

      try {
        const res = await fetch('/.netlify/functions/report', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(data)
        });

        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Failed');

        resetForNextReport();
        showSuccess();

      } catch (err) {
        statusEl.textContent = 'השליחה נכשלה — נסה שוב';
        statusEl.className = 'status error';
      } finally {
        submitBtn.disabled = false;
        if (!successModal.classList.contains('open')) {
          submitBtn.textContent = document.getElementById('feature').checked ? 'שלח רעיון' : 'שלח דיווח';
        }
      }
    });
  </script>
</body>
</html>
