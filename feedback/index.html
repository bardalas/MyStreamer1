<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050a16">
  <title>VEO · Feedback</title>

  <style>
    :root{
      --bg:#050a16;
      --surface:#0d1524;
      --surface-2:#16203a;
      --line:#22304f;
      --text:#e9f0ff;
      --muted:#8695b5;
      --blue:#3d8bff;
      --purple:#c040f0;
      --danger:#ff9d8a;
      --success:#8ee6ad;
    }

    *{
      box-sizing:border-box;
      min-width:0;
    }

    html{
      width:100%;
      overflow-x:hidden;
      -webkit-text-size-adjust:100%;
      background:var(--bg);
    }

    body{
      margin:0;
      width:100%;
      max-width:100%;
      min-height:100svh;
      overflow-x:hidden;
      color:var(--text);
      background:
        radial-gradient(700px 320px at 50% -80px, rgba(61,139,255,.18), transparent 68%),
        radial-gradient(520px 280px at 95% 12%, rgba(192,64,240,.08), transparent 70%),
        var(--bg);
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    }

    button,input,select,textarea{
      font:inherit;
    }

    .app{
      width:calc(100% - 32px);
      max-width:640px;
      margin:0 auto;
      padding-top:max(18px, env(safe-area-inset-top));
      padding-bottom:calc(28px + env(safe-area-inset-bottom));
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom:28px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      overflow:hidden;
    }

    .app-logo{
      display:block;
      flex:0 0 auto;
      width:42px;
      height:42px;
      object-fit:contain;
      border-radius:12px;
      filter:drop-shadow(0 8px 20px rgba(61,139,255,.24));
    }

    .brand-copy{
      overflow:hidden;
    }

    .brand-name{
      font-size:19px;
      line-height:1;
      font-weight:900;
      letter-spacing:.12em;
      white-space:nowrap;
    }

    .brand-sub{
      margin-top:4px;
      color:var(--muted);
      font-size:12px;
      line-height:1;
    }

    .source-pill{
      flex:0 0 auto;
      padding:7px 10px;
      border:1px solid rgba(61,139,255,.24);
      border-radius:999px;
      background:rgba(61,139,255,.08);
      color:#aebee0;
      font-size:11px;
      font-weight:700;
      white-space:nowrap;
    }

    .hero{
      margin-bottom:22px;
    }

    h1{
      margin:0 0 7px;
      font-size:clamp(28px,8vw,38px);
      line-height:1.08;
      letter-spacing:-.025em;
    }

    .lead{
      margin:0;
      color:var(--muted);
      font-size:15px;
      line-height:1.5;
    }

    .type-switch{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:7px;
      width:100%;
      padding:5px;
      margin-bottom:18px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#08101f;
    }

    .type-switch input{
      position:absolute;
      opacity:0;
      pointer-events:none;
    }

    .type-switch label{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:7px;
      width:100%;
      min-height:48px;
      padding:8px 10px;
      border:1px solid transparent;
      border-radius:11px;
      color:#b9c5d8;
      font-size:14px;
      font-weight:800;
      text-align:center;
      cursor:pointer;
      user-select:none;
      transition:.16s ease;
    }

    .type-switch input:checked + label{
      color:#fff;
      border-color:rgba(61,139,255,.35);
      background:linear-gradient(135deg,rgba(61,139,255,.24),rgba(192,64,240,.14));
      box-shadow:0 8px 24px rgba(61,139,255,.10);
    }

    .form-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .field{
      width:100%;
    }

    .field.full{
      grid-column:1/-1;
    }

    .field-label{
      display:block;
      margin:0 2px 7px;
      color:var(--muted);
      font-size:12px;
      font-weight:800;
    }

    .control{
      position:relative;
      width:100%;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--surface);
      overflow:hidden;
    }

    select,
    input[type="text"],
    textarea{
      display:block;
      width:100%;
      max-width:100%;
      border:0;
      outline:0;
      color:var(--text);
      background:transparent;
      font-size:16px;
    }

    select{
      min-height:54px;
      padding:0 13px;
      font-weight:700;
      cursor:pointer;
    }

    select option{
      color:#fff;
      background:#0d1524;
    }

    textarea{
      min-height:120px;
      padding:13px 14px;
      resize:vertical;
      line-height:1.55;
      background:var(--surface-2);
    }

    textarea::placeholder,
    input::placeholder{
      color:#6f7f9d;
    }

    .control:focus-within{
      border-color:rgba(61,139,255,.55);
      box-shadow:0 0 0 3px rgba(61,139,255,.08);
    }

    details{
      width:100%;
      margin-top:12px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#08101f;
      overflow:hidden;
    }

    summary{
      display:flex;
      align-items:center;
      justify-content:space-between;
      min-height:50px;
      padding:0 14px;
      list-style:none;
      color:#d3dced;
      font-size:14px;
      font-weight:800;
      cursor:pointer;
      user-select:none;
    }

    summary::-webkit-details-marker{display:none}

    summary::after{
      content:"+";
      color:#7f91af;
      font-size:20px;
      font-weight:400;
    }

    details[open] summary::after{
      content:"−";
    }

    .extras{
      display:grid;
      gap:12px;
      padding:12px;
      border-top:1px solid var(--line);
    }

    .extras input[type="text"],
    .extras textarea{
      min-height:48px;
      padding:12px 13px;
      border:1px solid var(--line);
      border-radius:12px;
      background:var(--surface-2);
    }

    .extras textarea{
      min-height:96px;
    }

    .submit-wrap{
      margin-top:16px;
    }

    .submit-btn,
    .modal-btn{
      width:100%;
      min-height:54px;
      border:0;
      border-radius:14px;
      color:#fff;
      background:linear-gradient(135deg,var(--blue),var(--purple));
      font-size:16px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 14px 34px rgba(61,139,255,.24);
    }

    .submit-btn:disabled{
      opacity:.55;
      cursor:wait;
    }

    .status{
      min-height:19px;
      margin-top:7px;
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }

    .status.error{color:var(--danger)}

    .hp{
      position:fixed !important;
      top:0 !important;
      left:0 !important;
      width:1px !important;
      height:1px !important;
      padding:0 !important;
      margin:0 !important;
      border:0 !important;
      clip:rect(0 0 0 0) !important;
      clip-path:inset(50%) !important;
      overflow:hidden !important;
      opacity:0 !important;
      pointer-events:none !important;
    }

    .success-modal{
      position:fixed;
      inset:0;
      z-index:1000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      background:rgba(2,6,15,.82);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
    }

    .success-modal.open{
      display:flex;
    }

    .success-card{
      width:100%;
      max-width:360px;
      padding:24px 20px 18px;
      border:1px solid rgba(61,139,255,.32);
      border-radius:22px;
      background:linear-gradient(180deg,var(--surface-2),var(--surface));
      text-align:center;
      box-shadow:0 24px 70px rgba(0,0,0,.45);
    }

    .success-icon{
      display:grid;
      place-items:center;
      width:58px;
      height:58px;
      margin:0 auto 14px;
      border-radius:18px;
      color:#fff;
      background:linear-gradient(135deg,var(--blue),var(--purple));
      font-size:30px;
      font-weight:900;
    }

    .success-card h2{
      margin:0 0 7px;
      font-size:24px;
    }

    .success-card p{
      margin:0 0 18px;
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
    }

    .modal-btn{
      min-height:50px;
      box-shadow:none;
    }

    @media (max-width:560px){
      .app{
        width:calc(100% - 24px);
        padding-top:max(12px, env(safe-area-inset-top));
        padding-bottom:calc(20px + env(safe-area-inset-bottom));
      }

      .topbar{
        margin-bottom:22px;
      }

      .source-pill{
        display:none;
      }

      .app-logo{
        width:38px;
        height:38px;
        border-radius:10px;
      }

      .brand-name{
        font-size:18px;
      }

      .hero{
        margin-bottom:18px;
      }

      h1{
        font-size:30px;
      }

      .lead{
        font-size:14px;
      }

      .form-grid{
        grid-template-columns:1fr;
        gap:10px;
      }

      .field.full{
        grid-column:auto;
      }

      .type-switch{
        margin-bottom:16px;
      }

      .type-switch label{
        min-height:48px;
        padding:7px 5px;
        font-size:14px;
      }

      select{
        min-height:52px;
      }

      textarea{
        min-height:108px;
      }

      .submit-wrap{
        margin-top:14px;
      }
    }

    @media (max-width:360px){
      .app{
        width:calc(100% - 18px);
      }

      h1{
        font-size:27px;
      }

      .type-switch{
        gap:5px;
        padding:4px;
      }

      .type-switch label{
        gap:5px;
        min-height:46px;
        font-size:13px;
      }

      .brand-sub{
        display:none;
      }
    }

    @media (min-width:820px){
      .app{
        padding-top:34px;
        padding-bottom:36px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <img
          class="app-logo"
          src="https://raw.githubusercontent.com/bardalas/VEO/main/app/src/main/assets/veo-mark.png"
          alt="VEO">
        <div class="brand-copy">
          <div class="brand-name">VEO</div>
          <div class="brand-sub">Feedback</div>
        </div>
      </div>

      <div class="source-pill">User Report</div>
    </header>

    <section class="hero">
      <h1>דיווח מהיר</h1>
      <p class="lead">באג או רעיון לשיפור — כמה שניות וזה אצלנו.</p>
    </section>

    <form id="feedbackForm">
      <div class="type-switch">
        <div>
          <input type="radio" id="bug" name="type" value="bug" checked>
          <label for="bug">🐞 מצאתי באג</label>
        </div>
        <div>
          <input type="radio" id="feature" name="type" value="feature">
          <label for="feature">💡 יש לי רעיון</label>
        </div>
      </div>

      <div class="form-grid">
        <div class="field">
          <label class="field-label" for="area">איפה זה קרה?</label>
          <div class="control">
            <select id="area" name="area" required>
              <option value="" selected disabled>בחר אזור באפליקציה</option>
              <option>מסך הבית</option>
              <option>סרטים</option>
              <option>סדרות</option>
              <option>שידור חי</option>
              <option>חיפוש</option>
              <option>נגן וידאו</option>
              <option>הגדרות</option>
              <option>ניווט / שלט</option>
              <option>אחר</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="device">באיזה מכשיר?</label>
          <div class="control">
            <select id="device" name="device" required>
              <option value="" selected disabled>בחר מכשיר</option>
              <option>Android TV</option>
              <option>Google TV</option>
              <option>טלפון Android</option>
              <option>iPhone / iPad</option>
              <option>Windows</option>
              <option>דפדפן</option>
              <option>אחר</option>
            </select>
          </div>
        </div>

        <div class="field full">
          <label class="field-label" id="messageTitle" for="summary">מה קרה?</label>
          <div class="control">
            <textarea
              id="summary"
              name="summary"
              required
              placeholder="לדוגמה: לחיצה על פרק לא מתחילה ניגון"></textarea>
          </div>
        </div>
      </div>

      <details>
        <summary>להוסיף פרטים</summary>
        <div class="extras">
          <div class="field">
            <label class="field-label" for="details">פרטים נוספים</label>
            <textarea
              id="details"
              name="details"
              maxlength="2500"
              placeholder="שלבים לשחזור, מה ציפית שיקרה, או כל פרט שיעזור לנו להבין."></textarea>
          </div>

          <div class="field">
            <label class="field-label" for="contact">דרך לחזור אליך — אופציונלי</label>
            <input
              id="contact"
              type="text"
              name="contact"
              maxlength="150"
              placeholder="שם / WhatsApp / אימייל">
          </div>
        </div>
      </details>

      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">

      <div class="submit-wrap">
        <button id="submitBtn" class="submit-btn" type="submit">שלח דיווח</button>
        <div id="status" class="status" aria-live="polite"></div>
      </div>
    </form>
  </main>

  <div
    id="successModal"
    class="success-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="successTitle"
    aria-hidden="true">
    <div class="success-card">
      <div class="success-icon">✓</div>
      <h2 id="successTitle">תודה!</h2>
      <p>הדיווח נשלח בהצלחה.</p>
      <button id="newReportBtn" class="modal-btn" type="button">סגור</button>
    </div>
  </div>

  <script>
    const form = document.getElementById('feedbackForm');
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const summary = document.getElementById('summary');
    const messageTitle = document.getElementById('messageTitle');
    const successModal = document.getElementById('successModal');
    const newReportBtn = document.getElementById('newReportBtn');

    function isFeature(){
      return document.getElementById('feature').checked;
    }

    function syncTypeCopy(){
      if (isFeature()){
        messageTitle.textContent = 'מה הרעיון?';
        summary.placeholder = 'לדוגמה: להוסיף רשימת צפייה אישית';
        submitBtn.textContent = 'שלח רעיון';
      } else {
        messageTitle.textContent = 'מה קרה?';
        summary.placeholder = 'לדוגמה: לחיצה על פרק לא מתחילה ניגון';
        submitBtn.textContent = 'שלח דיווח';
      }
    }

    document.querySelectorAll('input[name="type"]').forEach(el => {
      el.addEventListener('change', syncTypeCopy);
    });

    function resetForNextReport(){
      form.reset();
      document.getElementById('bug').checked = true;
      const extraDetails = form.querySelector('details');
      if (extraDetails) extraDetails.open = false;
      statusEl.textContent = '';
      statusEl.className = 'status';
      syncTypeCopy();
    }

    function showSuccess(){
      successModal.classList.add('open');
      successModal.setAttribute('aria-hidden','false');
      document.body.style.overflow = 'hidden';
      newReportBtn.focus();
    }

    function closeSuccess(){
      successModal.classList.remove('open');
      successModal.setAttribute('aria-hidden','true');
      document.body.style.overflow = '';
      window.scrollTo({top:0, behavior:'smooth'});
    }

    newReportBtn.addEventListener('click', closeSuccess);

    successModal.addEventListener('click', e => {
      if (e.target === successModal) closeSuccess();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && successModal.classList.contains('open')){
        closeSuccess();
      }
    });

    form.addEventListener('submit', async e => {
      e.preventDefault();

      statusEl.textContent = '';
      statusEl.className = 'status';
      submitBtn.disabled = true;
      submitBtn.textContent = 'שולח...';

      const data = Object.fromEntries(new FormData(form).entries());

      try {
        const res = await fetch('/.netlify/functions/report', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(data)
        });

        const result = await res.json();
        if (!res.ok) throw new Error(result.error || 'Failed');

        resetForNextReport();
        showSuccess();

      } catch (err) {
        statusEl.textContent = 'השליחה נכשלה — נסה שוב';
        statusEl.className = 'status error';
      } finally {
        submitBtn.disabled = false;
        if (!successModal.classList.contains('open')) syncTypeCopy();
      }
    });
  </script>
</body>
</html>
