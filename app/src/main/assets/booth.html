function viewAddons(msg){
  $('#app').innerHTML = `<div class="page"><h1>תוספים</h1>
    <p class="note" style="max-width:68ch">הדבק קישור manifest של כל תוסף תואם Stremio. הקטלוגים, הפרטים ומקורות הצפייה מגיעים מהתוספים שמותקנים כאן.</p>
    <form class="add" id="addf"><input class="field" id="aurl" placeholder="https://…/manifest.json" aria-label="קישור manifest" dir="ltr"><button class="btn primary">התקן</button></form>
    ${msg ? `<p class="${msg.err?'err':'note'}">${esc(msg.text)}</p>` : ''}
    ${addons.filter(a => !a.local).map(a => `<div class="addon">${a.manifest.logo ? `<img src="${esc(a.manifest.logo)}" alt="">` : '<div class="ph"></div>'}
      <div><h3>${esc(a.manifest.name)} <span class="note">v${esc(a.manifest.version)}</span></h3><p>${esc(a.manifest.description)}</p><p>${esc((a.manifest.resources||[]).map(r => r.name||r).join(', '))}</p></div>
      <button class="danger" data-u="${esc(a.url)}">הסר</button></div>`).join('')}
    ${addonUrls.length > addons.filter(a => !a.local).length ? `<p class="err">${addonUrls.length - addons.filter(a => !a.local).length} תוספים לא זמינים כרגע ומוסתרים.</p>` : ''}</div>`;
  $('#addf').onsubmit = async e => {
    e.preventDefault();
    const url = $('#aurl').value.trim(); if(!url) return;
    if(addonUrls.includes(url)) return viewAddons({text:'התוסף הזה כבר מותקן.'});
    try{
      const m = await getJSON(normUrl(url));
      if(!m.id || !m.resources) throw new Error('זה לא קובץ manifest תקין');
      addonUrls.push(url); store.set('addons', addonUrls); await loadAddons();
      viewAddons({text:`${m.name} הותקן.`});
    }catch(err){ viewAddons({text:`ההתקנה נכשלה: ${err.message}. ודא שהקישור מסתיים ב־manifest.json.`, err:true}); }
  };
  document.querySelectorAll('.danger').forEach(b => b.onclick = async () => {
    addonUrls = addonUrls.filter(u => u !== b.dataset.u); store.set('addons', addonUrls); await loadAddons(); viewAddons({text:'הוסר.'});
  });
}

/* ---------- player ---------- */
let hls = null;
/** hls.js is only needed by the in-page player (the Android player handles HLS itself). */
let hlsLoading = null;
const loadHls = () => window.Hls ? Promise.resolve(window.Hls) : (hlsLoading ||= new Promise(res => {
  const tag = document.createElement('script');
  tag.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js';
  tag.onload = () => res(window.Hls);
  tag.onerror = () => res(null);
  document.head.appendChild(tag);
}));

function openPlayer(s, title, ctx){
  $('#ptitle').textContent = title;
  const body = $('#pbody');
  if(s.ytId){
    body.innerHTML = `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(s.ytId)}?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  } else {
    body.innerHTML = `<video id="vid" controls autoplay playsinline></video>`;
    const v = $('#vid');
    if(/\.m3u8(\?|$)/.test(s.url)){
      loadHls().then(Hls => { if(Hls?.isSupported()){ hls?.destroy(); hls = new Hls(); hls.loadSource(s.url); hls.attachMedia(v); } else v.src = s.url; });
    }
    else v.src = s.url;
    if(ctx){
      const saved = progress[ctx.videoId];
      if(saved) v.addEventListener('loadedmetadata', () => { if(saved.t < v.duration - 30) v.currentTime = saved.t; }, {once:true});
      let last = 0;
      v.addEventListener('timeupdate', () => {
        if(Math.abs(v.currentTime - last) < 5) return; last = v.currentTime;
        progress[ctx.videoId] = {t: v.currentTime, d: v.duration, at: Date.now(), metaId: ctx.meta.id, type: ctx.type, name: ctx.meta.name, poster: ctx.meta.poster};
        store.set('progress', progress);
        indexProgress();
      });
      v.addEventListener('error', () => body.insertAdjacentHTML('afterbegin', `<p class="err" style="position:absolute;top:70px;right:20px">הדפדפן לא יכול לנגן את הפורמט הזה. נסה מקור אחר.</p>`));
    }
  }
  $('#player').classList.add('open');
}
function closePlayer(){
  if(hls){ hls.destroy(); hls = null; }
  $('#pbody').innerHTML = ''; $('#player').classList.remove('open');
}
$('#close').onclick = closePlayer;
addEventListener('keydown', e => { if(e.key === 'Escape') closePlayer(); });

/* ---------- router ---------- */
$('#sf').onsubmit = e => { e.preventDefault(); const q = $('#q').value.trim(); if(q) location.hash = '#/search/' + encodeURIComponent(q); };
/** Let go of the previous screen's observers; the MutationObserver re-arms whatever the new one renders. */
function resetObservers(){
  for(const o of [bgObserver, heObserver, availObserver]) o.disconnect();
  document.querySelectorAll('[data-bgw]').forEach(el => { if(!el.style.backgroundImage) delete el.dataset.bgw; });
  requestAnimationFrame(() => { lazyBg(document); armHeAndAvail(document); });
}

let routed = false;
async function route(){
  routed = true;
  resetObservers();
  const [, r = '', a, b, c] = location.hash.split('/').map(decodeURIComponent);
  document.querySelectorAll('.nav a').forEach(x => x.classList.toggle('on', x.dataset.r === (['', 'cat', 'discover', 'detail', 'search', 'genres', 'genre'].includes(r) ? 'home' : ['show', 'r13', 'kan', 'mako'].includes(r) ? 'tv' : r)));
  scrollTo(0, 0);
  if(!['', 'cat', 'genres', 'genre'].includes(r)) renderCats(null);
  if(r === 'discover') viewDiscover(a, b, c);
  else if(r === 'genres') viewGenres();
  else if(r === 'genre') viewGenre(a);
  else if(r === 'show') viewShow(a, b);
  else if(r === 'r13') viewR13Series(a, b);
  else if(r === 'kan') viewKanProgram(a, b);
  else if(r === 'tv') viewTv(a);
  else if(r === 'mako') viewMakoProgram(a, b);
  else if(r === 'cat') viewCategory(a);
  else if(r === 'live') viewLive();
  else if(r === 'search') viewSearch(a);
  else if(r === 'detail') viewDetail(a, b);
  else if(r === 'library') viewLibrary();
  else if(r === 'addons') viewAddons();
  else if(r === 'settings') viewSettings();
  else viewHome();
}
/** The projector logo: back to the last live channel (or home, if nothing was watched yet). */
document.querySelector('.logo').addEventListener('click', async e => {
  const last = store.get('lastChannel', null);
  if(!last) return;                                    // no channel yet: the logo is just "home"
  e.preventDefault();
  try{
    const chans = await liveChannels(last.src);
    const i = chans.findIndex(c => c.name === last.name);
    if(i >= 0) return watchChannel(chans, i, last.src);
  }catch(err){}
  location.hash = '#/live';
});
/** The player reports how far the viewer got; it feeds "המשך צפייה" and resuming. */
window.boothProgress = json => {
  try{
    const entries = JSON.parse(json);
    for(const [videoId, e] of Object.entries(entries)){
      if(!e || !e.d) continue;
      progress[videoId] = {t: +e.t || 0, d: +e.d || 0, at: +e.at || Date.now(), metaId: e.metaId || videoId, type: e.type || 'movie', name: e.name || '', poster: e.poster || ''};
      if(progress[videoId].t > progress[videoId].d - 60) delete progress[videoId];      // finished
    }
    store.set('progress', progress);
    indexProgress();
    if(['', '#/', '#'].includes(location.hash)) route();
  }catch(e){}
};

/** The player asks for a channel's catch-up (long press OK while watching). */
window.boothCatchup = async name => {
  const last = store.get('lastChannel', null);
  try{
    const chans = await liveChannels(last?.src || 'il');
    const c = chans.find(x => x.name === name);
    if(c) openChannel(c);
  }catch(e){}
};

addEventListener('hashchange', route);
/* Remote control (Android TV): arrows move focus between titles and between rows, and the page
   follows the focus — instead of the browser scrolling on its own. */
const FOCUSABLE = 'a[href], button:not([disabled]), input:not([type="hidden"]), select, [tabindex]:not([tabindex="-1"])';
const ROWS_SEL = '.nav, #cats, .bctabs, .live-top, .strip, .grid, .genres, .sopts, .seg, .seasons, .days, .eplist, .chlist, .qvact, .play, .catorder, .addpl, .add, .ltabs, .mkbar';
const visible = el => el.offsetParent !== null && el.getBoundingClientRect().width > 0;
const tvRows = () => [...document.querySelectorAll(ROWS_SEL)].filter(c => visible(c) && c.querySelector(FOCUSABLE));
const itemsOf = row => [...row.querySelectorAll(FOCUSABLE)].filter(visible);
const centerX = el => { const r = el.getBoundingClientRect(); return r.left + r.width / 2; };
function focusItem(el, smooth){
  if(!el) return;
  el.focus({preventScroll: true});
  el.scrollIntoView({block: 'center', inline: 'center', behavior: smooth ? 'auto' : 'auto'});
}
function tvMove(dir){
  const rows = tvRows();
  if(!rows.length) return false;
  const active = document.activeElement;
  let row = rows.find(r => r.contains(active));
  if(!row){ focusItem(itemsOf(rows[0])[0]); return true; }
  const items = itemsOf(row);
  const i = items.indexOf(active);
  if(dir === 'left' || dir === 'right'){
    // right-to-left: ArrowLeft goes forward through the row
    const step = dir === 'left' ? 1 : -1;
    const next = items[i + step];
    if(next){ focusItem(next); return true; }
    return true;                                    // stay put at the row's edge
  }
  // up / down: inside a wrapped grid move a line, otherwise move to the next row
  const x = active ? centerX(active) : 0;
  if(row.classList.contains('grid') || row.classList.contains('genres') || row.classList.contains('sopts')){
    const top = active.getBoundingClientRect().top;
    const line = items.filter(el => (dir === 'down' ? el.getBoundingClientRect().top > top + 4 : el.getBoundingClientRect().top < top - 4));
    if(line.length){
      const band = dir === 'down' ? Math.min(...line.map(el => el.getBoundingClientRect().top)) : Math.max(...line.map(el => el.getBoundingClientRect().top));
      const same = line.filter(el => Math.abs(el.getBoundingClientRect().top - band) < 4);
      focusItem(same.reduce((best, el) => Math.abs(centerX(el) - x) < Math.abs(centerX(best) - x) ? el : best));
      return true;
    }
  }
  const ri = rows.indexOf(row);
  const next = rows[ri + (dir === 'down' ? 1 : -1)];
  if(!next) return true;
  const cand = itemsOf(next);
  focusItem(cand.reduce((best, el) => Math.abs(centerX(el) - x) < Math.abs(centerX(best) - x) ? el : best, cand[0]));
  return true;
}
addEventListener('keydown', e => {
  if(!isTvLayout() || e.altKey || e.ctrlKey || e.metaKey) return;
  const dir = {ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right'}[e.key];
  if(!dir) return;
  const a = document.activeElement;
  if(a && (a.tagName === 'INPUT' && !a.readOnly || a.tagName === 'SELECT')) return;   // typing / picking
  if(tvMove(dir)) e.preventDefault();
}, true);

// Remote control (Android TV): text fields stay locked while focus passes over them, so the on-screen
// keyboard doesn't pop up; OK (Enter) unlocks the field and opens the keyboard.
function armInput(i){
  if(i.dataset.tvArmed) return;
  i.dataset.tvArmed = 1;
  const lock = () => { if(isTvLayout()) i.readOnly = true; };
  const unlock = e => {
    if(!isTvLayout() || !i.readOnly) return;
    e?.preventDefault();
    i.readOnly = false;
    i.focus();
    window.BoothAndroid?.showKeyboard?.();
  };
  lock();
  i.addEventListener('keydown', e => { if(e.key === 'Enter' && i.readOnly) unlock(e); });
  i.addEventListener('click', unlock);
  i.addEventListener('blur', lock);
}
const armInputs = root => root.querySelectorAll?.('input[type="search"], input.field:not([type="checkbox"]), #q').forEach(armInput);
armInputs(document);
new MutationObserver(muts => { for(const m of muts) for(const n of m.addedNodes) if(n.nodeType === 1) armInputs(n.matches('input') ? n.parentNode : n); })
  .observe(document.body, {childList: true, subtree: true});
// Back on the remote/phone: close an open panel or keyboard first (called by the app before going back).
window.boothBack = () => {
  const sheet = document.querySelector('.sheet');
  if(sheet){ sheet.remove(); return true; }
  if(document.querySelector('.qv')){ closeQuickView(); return true; }
  const a = document.activeElement;
  if(a && a.tagName === 'INPUT' && !a.readOnly && isTvLayout()){ a.blur(); return true; }
  return false;
};
// Search key on the remote
window.boothSearchKey = () => { const q = $('#q'); q.focus(); q.readOnly = false; window.BoothAndroid?.showKeyboard?.(); };
// Remote control (Android TV): if nothing has focus after a page renders, focus its first item.
addEventListener('hashchange', () => setTimeout(tvFocus, 900));
function tvFocus(){
  if(settings.layout !== 'tv' || (document.activeElement && document.activeElement !== document.body)) return;
  document.querySelector('#app a[href], #app button, .nav a.on')?.focus();
}
setTimeout(tvFocus, 2500);
if(!location.hash && settings.start === 'live') history.replaceState(null, '', '#/live');
// Render as soon as the add-ons answer, but never wait longer than 6s for a slow one.
const withTimeout = (pr, ms) => Promise.race([pr, new Promise(r => setTimeout(r, ms))]);
const addonsReady = loadAddons();
withTimeout(addonsReady, 6000).then(() => route());
addonsReady.then(() => { if(!routed) route(); setTimeout(loadServices, 3000); });
</script>

  <span id="tstatusMsg"></span>
  <button id="tstatusBtn" style="flex:none;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer">ביטול</button>
</div>
<script>
// Torrent progress from the Android engine. Empty message hides the bar.
window.boothTorrentStatus = (msg, isError) => {
  const bar = document.getElementById('tstatus');
  document.getElementById('tstatusMsg').textContent = msg;
  bar.style.display = msg ? 'flex' : 'none';
  bar.style.borderColor = isError ? 'var(--velvet)' : 'var(--line)';
  const btn = document.getElementById('tstatusBtn');
  btn.textContent = isError ? 'סגור' : 'ביטול';
  btn.onclick = () => { if (!isError && window.BoothAndroid) BoothAndroid.cancelTorrent(); bar.style.display = 'none'; };
};
</script>
