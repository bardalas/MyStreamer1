/* ---------- quick view: tap a poster for the synopsis; tap it again (or the button) to open it ---------- */
const metaCache = {};
async function fetchMeta(type, id){
  const key = type + ':' + id;
  if(metaCache[key]) return metaCache[key];
  capMap(metaCache, 30);                                     // metas of long series are big
  for(const a of addons.filter(a => supports(a.manifest, 'meta', type, id))){
    try{ const m = (await getJSON(`${a.base}/meta/${type}/${encodeURIComponent(id)}.json`)).meta; if(m) return metaCache[key] = m; }catch(e){}
  }
  return null;
}
/** The quick view's main button: continue, or watch from the start. */
function qvPlayLabel(metaId){
  const w = Object.values(progress).find(x => x.metaId === metaId);
  if(w && w.d && w.t < w.d - 60){
    const left = Math.max(1, Math.round((w.d - w.t) / 60));
    return tr('qv.continue', {n: left});
  }
  return tr('qv.play');
}

/** The default source for a title, as soon as a good one has arrived - never waiting for the slowest add-on. */
function quickPick(type, videoId){
  return new Promise(resolve => {
    const src = addons.filter(a => supports(a.manifest, 'stream', type, videoId));
    const all = [];
    let pending = src.length, done = false;
    if(!pending) return resolve(null);
    const finish = p => { if(!done){ done = true; resolve(p); } };
    for(const a of src){
      fetchStreams(a, type, videoId)
        .then(list => { for(const st of list) all.push(parseStream(st, a.manifest.name, all.length)); })
        .catch(() => {})
        .then(() => {
          const p = bestForNow(all);
          if(--pending === 0 || (p && (p.direct || p.q === '1080p'))) finish(p);
        });
    }
  });
}

/** The sensible default: 1080p when its file is small enough to stream, else the best-ranked. */
function bestForNow(list){
  const ok = list.filter(x => x.q !== 'CAM' && rank(x) > 0).sort((a, b) => rank(b) - rank(a));
  const fits = x => !x.size || x.size < 5 * GB;               // big files start slowly and stall when streamed
  return ok.find(x => x.q === '1080p' && fits(x)) || ok.find(fits) || ok[0] || null;
}



/* ---------- the title card ----------
   One click on a poster raises a modest card over the screen: the banner, the Hebrew synopsis
   and the actions. The list stays put behind it; Back or ✕ closes it, "פרטים מלאים" opens the
   full page (episodes, all sources). It is a .sheet, so the remote is trapped inside it. */
function closeQuickView(){ document.querySelector('.sheet.titleSheet')?.remove(); }

async function openQuickView(card){
  document.querySelector('.sheet')?.remove();
  const href = card.getAttribute('href');
  const [, , type, idEnc] = href.split('/');
  const id = decodeURIComponent(idEnc);
  const name = card.querySelector('[data-heid]')?.textContent || card.querySelector('.t')?.textContent || '';
  warmSources(type, type === 'series' ? `${id}:1:1` : id);
  const sheet = document.createElement('div');
  sheet.className = 'sheet titleSheet';
  sheet.innerHTML = `<div role="dialog" aria-modal="true" aria-label="${esc(name)}">
      <header><b dir="auto">${esc(name)}</b><button aria-label="${esc(tr('common.close'))}">✕</button></header>
      <div class="tc-banner"></div>
      <div class="body">
        <div class="facts"></div>
        <p class="qvdesc note" dir="auto">${tr('qv.loadingSummary')}</p>
        <div class="qvact">${type === 'movie'
          ? `<button class="btn primary" id="qvplay">${qvPlayLabel(id)}</button>`
          : `<button class="btn primary" id="qveps">${tr('qv.eps')}</button>`}
          <button class="btn ghost" id="qvmore">${tr('qv.more')}</button></div>
      </div></div>`;
  document.body.appendChild(sheet);
  const close = () => sheet.remove();
  sheet.querySelector('header button').onclick = close;
  sheet.onclick = e => { if(e.target === sheet) close(); };
  const goFull = () => { close(); location.hash = href; };
  sheet.querySelector('#qvmore').onclick = goFull;
  const epsBtn = sheet.querySelector('#qveps');
  if(epsBtn) epsBtn.onclick = goFull;
  const playBtn = sheet.querySelector('#qvplay');
  if(playBtn) playBtn.onclick = async () => {
    playBtn.disabled = true;
    playBtn.textContent = tr('qv.searching');
    const m = await fetchMeta(type, id).catch(() => null);
    const videoId = m?.behaviorHints?.defaultVideoId || id;
    const pick = await quickPick(type, videoId);
    if(!pick){
      playBtn.textContent = tr('qv.noSource');
      playBtn.disabled = false;
      playBtn.onclick = goFull;
      return;
    }
    playBtn.textContent = qvPlayLabel(id);
    playBtn.disabled = false;
    close();
    playStream(pick.s, m?.name || name, {videoId, type, meta: m || {id, name}});
  };
  (playBtn || epsBtn).focus();

  const meta = await fetchMeta(type, id).catch(() => null);
  if(!sheet.isConnected) return;
  if(meta){
    sheet.querySelector('.tc-banner').style.backgroundImage = `url('${(meta.background || meta.poster || '').replace(/'/g, '%27')}')`;
    sheet.querySelector('header b').textContent = heTitle(meta.id, meta.name);
    sheet.querySelector('.facts').innerHTML = svcFacts(id) + [meta.imdbRating && `<span class="imdb">IMDb ${esc(meta.imdbRating)}</span>`,
      yearOf(meta) && `<span>${esc(yearOf(meta))}</span>`, meta.runtime && `<span>${esc(meta.runtime)}</span>`,
      ...(meta.genres || meta.genre || []).slice(0, 3).map(g => `<span>${esc(genreName(g))}</span>`)].filter(Boolean).join('');
  }
  const desc = sheet.querySelector('.qvdesc');
  desc.classList.remove('note');

  ['החדשות', 'provider&vcmId=ee06c13070733210VgnVCM2000002a0c10acRCRD']];
const makoCache = {};
function nextData(html){
  // slice by index instead of running a lazy regex over ~1MB of HTML
  const start = html.indexOf('<script id="__NEXT_DATA__"');
  const from = start < 0 ? -1 : html.indexOf('>', start) + 1;
  const to = from > 0 ? html.indexOf('<\/script>', from) : -1;
  if(to < 0) throw new Error('לא ניתן לקרוא את העמוד');
  return JSON.parse(html.slice(from, to)).props.pageProps;
}
async function makoPrograms(filter){
  if(makoCache['idx' + filter]) return makoCache['idx' + filter];
  const pp = nextData(await fetchText(`${MAKO}/mako-vod-index${filter ? '?filter=' + filter : ''}`));
  return makoCache['idx' + filter] = (pp.programs?.items || []).map(i => ({name: i.title, path: i.pageUrl, img: i.pic}));
}

/** Resolve a category's row specs against the installed add-ons. */
function rowsFor(cat){
  const out = [];
  for(const spec of cat.rows){
    if(!Array.isArray(spec)){ out.push(spec); continue; }       // YouTube row
    const [aid, cid, extra, title] = spec;
    const a = addons.find(x => x.manifest.id === aid);
    if(!a) continue;
    for(const c of a.manifest.catalogs || [])
      if(cid instanceof RegExp ? cid.test(c.id) : c.id === cid) out.push({a, c, extra, title: title ? tr(title) : catalogName(c.name)});
  }
  return out;
}

/** After a row's title, quietly: what it holds and where it comes from (a catalogue's add-on, or the services merged in it). */
const rowTag = x => {
  const parts = [];
  if(x.merge) parts.push(x.merge.map(id => SERVICES[id]).join(' · '));
  else if(x.c){ if(!x.notype) parts.push(typeName(x.c.type)); parts.push(srcName(x.a)); }
  return parts.length ? ` <small>${esc(parts.join(' · '))}</small>` : '';
};
/** Hero + "continue watching" + a row per catalog; rows load in parallel. */
function renderRows(rows, {hero = true, cont = [], heading = '', top = ''} = {}){
  const app = $('#app');
  app.innerHTML = `${hero ? `<section class="hero" id="hero"><div class="bg skel"></div><div class="beam"></div><div class="copy"><h1>&nbsp;</h1></div></section>` : heading ? `<div class="page"><h1>${esc(heading)}</h1></div>` : '<div style="height:8px"></div>'}
    ${top}
    ${cont.length ? `<div class="row"><h2>${tr('row.continue')}</h2><div class="strip">${cont.map(x => card({id:x.metaId,type:x.type,name:x.name,poster:x.poster})).join('')}</div></div>` : ''}
    ${rows.map((x, i) => `<div class="row"><h2><bdi>${esc(x.title)}</bdi>${rowTag(x)}</h2><div class="strip" id="row${i}">${skeletons(8)}</div></div>`).join('')}
    ${!rows.length ? `<p class="note">${tr('row.noCatalogs')}</p>` : ''}`;
  let heroDone = !hero;
  // Each title appears once per page: it stays in the first (highest) row that has it.
  const claimed = new Map();
  const dedupe = (i, metas) => metas.filter(m => {
    const j = claimed.get(m.id);
    if(j !== undefined && j < i) return false;
    if(j !== undefined && j > i) document.querySelectorAll(`#row${j} [data-id="${CSS.escape(m.id)}"]`).forEach(e => e.remove());
    claimed.set(m.id, i);
    return true;
  });
  const fillRow = async (x, i) => {
    const el = $('#row' + i);
    const again = () => fillRow(x, i);
    if(x.merge){
      try{
        const sc = addons.find(a => a.manifest.id === SC_ID);
        const lists = await Promise.all(x.merge.map(async id => {
          const c = (sc?.manifest.catalogs || []).find(c => c.id === id && c.type === x.type);
          if(!c) return [];
          const metas = (await catalogFetch(sc, c.type, c.id).catch(() => ({metas: []}))).metas || [];
          metas.forEach(m => noteServices(m.id, SERVICES[id]));
          return metas;
        }));
        const merged = [];                                   // round-robin so every service is represented
        for(let k = 0; merged.length < 200 && lists.some(l => l[k]); k++) for(const l of lists) if(l[k] && !merged.some(m => m.id === l[k].id)) merged.push(l[k]);
        if(el) el.innerHTML = dedupe(i, merged).slice(0, rowMax()).map(card).join('') || `<p class="note">${tr('row.none')}</p>`;
      }catch(e){ showErr(el, tr('row.failed'), e, again); }
      return;
    }
    if(x.kan){
      try{
        const secs = await kanBox();
        const sec = secs.find(z => x.kan.test(z.title));
        el.innerHTML = sec ? sec.items.slice(0, rowMax()).map(kanCard).join('') : `<p class="note">${tr('row.none')}</p>`;
      }catch(e){ showErr(el, tr('row.failedKan'), e, again); }
      return;
    }
    if(x.r13){
      try{ el.innerHTML = (await r13row(x.r13)).slice(0, rowMax()).map(r13card).join('') || `<p class="note">${tr('row.none')}</p>`; }
      catch(e){ showErr(el, tr('row.failedR13'), e, again); }
      return;
    }
    try{
      const d = await catalogFetch(x.a, x.c.type, x.c.id, x.extra);
      const metas = d.metas || [];
      if(el) el.innerHTML = dedupe(i, metas).slice(0, rowMax()).map(card).join('') || `<p class="note">${tr('row.empty')}</p>`;
      if(!heroDone && metas.length){ heroDone = true; renderHero(metas.find(m => m.background) || metas[0]); }
    }catch(e){ showErr(el, tr('row.failedCat'), e, again); }
  };
  rows.forEach((x, i) => fillRow(x, i));
}

/** Movies and Series: the same catalogues, one type at a time. */
function typeRows(type){
  const cm = addons.find(a => a.manifest.id === CINEMETA_ID);
  const rows = [];
  if(cm) for(const id of ['top', 'imdbRating']) for(const c of cm.manifest.catalogs || [])
    if(c.id === id && c.type === type) rows.push({a: cm, c, title: tr(id === 'top' ? 'row.popular' : 'row.best'), notype: true});
  if(addons.some(a => a.manifest.id === SC_ID)) rows.push({...mergedRow(type, tr('row.newStreaming')), notype: true});
  const local = addons.find(a => a.manifest.id === BOOTH_ID);
  if(local) for(const c of local.manifest.catalogs || []) if(c.type === type) rows.push({a: local, c, title: catalogName(c.name)});
  return rows;
}

async function viewHome(){
  renderCats('home');
  // Cinemeta's popular rows, then the first row of every category.
  if(settings.kids === 'on') return renderRows(rowsFor(CATEGORIES.find(c => c.id === 'kids')), {hero: false});
  const cm = addons.find(a => a.manifest.id === CINEMETA_ID);
  const rows = cm ? (cm.manifest.catalogs || []).filter(c => c.id === 'top').map(c => ({a: cm, c, title: tr(c.type === 'movie' ? 'row.popularMovies' : 'row.popularSeries'), notype: true})) : [];
  if(addons.some(a => a.manifest.id === SC_ID)) rows.push({...mergedRow('movie', tr('row.newStreamingMovies')), notype: true}, {...mergedRow('series', tr('row.newStreamingSeries')), notype: true});
  for(const cat of userCategories()){
    const r = rowsFor(cat);
    if(r.length) rows.push(...r.slice(0, 2).map(x => ({...x, title: cat.prefix ? `${catName(cat)} · ${x.title}` : x.title})));
  }
  if(!rows.length) for(const a of addons) for(const c of a.manifest.catalogs || []){
    if((c.extra||[]).some(e => e.isRequired) || (c.extraRequired||[]).length) continue;
    if(rows.length < 8) rows.push({a, c, title: catalogName(c.name) || c.id});
  }
  if(sortActive()) return gridFrom(rows, tr('cats.all'), viewHome);
  const cont = Object.values(progress).filter(x => !x.done).sort((x,y) => y.at - x.at).slice(0, 12);
  renderRows(isTvLayout() ? rows.slice(0, 10) : rows, {cont, hero: settings.layout === 'cinema', top: `<div class="page" style="padding-bottom:0">${sortBar()}</div>`});
  wireSortBar(viewHome);
}

function viewCategory(id){
  const type = id === 'movies' ? 'movie' : id === 'series' ? 'series' : null;
  const cat = CATEGORIES.find(c => c.id === id);
  if(!type && !cat) return viewHome();
  renderCats(id);
  const rows = type ? typeRows(type) : rowsFor(cat);
  const name = type ? tr('cats.' + id) : catName(cat);
  const redraw = () => viewCategory(id);
  if(sortActive()) return gridFrom(rows, name, redraw);
  renderRows(rows, {hero: false, heading: name, top: `<div class="page" style="padding-bottom:0">${sortBar()}</div>`});
  wireSortBar(redraw);
}

async function viewDetail(type, id){
  const app = $('#app');
  app.innerHTML = `<div class="backdrop skel"></div>`;
  if(type === 'movie') warmSources(type, id);                // a movie's sources load while its details do
  const meta = await fetchMeta(type, id);
  if(!meta){ app.innerHTML = `<div class="page"><h1>${tr('detail.notFound')}</h1><p class="note">${tr('detail.notFoundNote')}</p></div>`; return; }
  const saved = !!library[meta.id];
  if(hebrewOn() && /^tt\d+$/.test(meta.id)) hebrewPlot(meta.id).then(plot => {
    const el = $('#desc');
    if(!plot || !el) return;
    const PREVIEW = 650;
    const short = plot.text.length > PREVIEW ? plot.text.slice(0, plot.text.lastIndexOf(' ', PREVIEW)) + '…' : plot.text;
    const link = isTvLayout() ? tr('detail.wikiName')            // a link cannot be followed from a remote
      : `<a href="https://he.wikipedia.org/wiki/${encodeURIComponent(plot.article)}" target="_blank" rel="noopener">${tr('detail.wikiName')}</a>`;
    if($('#dsrc')) $('#dsrc').innerHTML = tr('detail.wikiFrom', {link});
    el.dir = 'rtl';
    el.innerHTML = esc(short).replace(/\n/g, '<br>') + (short !== plot.text ? ` <button class="readmore" id="rm">${tr('detail.readMore')}</button>` : '');
    if($('#rm')) $('#rm').onclick = () => { el.innerHTML = esc(plot.text).replace(/\n/g, '<br>'); };
    const h = app.querySelector('.detail h1');
    if(h && heCache[meta.id]?.t && !h.querySelector('.orig')) h.innerHTML = `${esc(heCache[meta.id].t)}<span class="orig"><bdi>${esc(meta.name)}</bdi></span>`;

/* ---------- sources: pick the best automatically ---------- */
const GB = 1024 ** 3;
let streamsToken = 0;
const fmtSize = b => b >= GB ? (b / GB).toFixed(1) + ' GB' : Math.round(b / 1024 ** 2) + ' MB';
const isCam = s => /\b(hd)?cam(rip)?\b|\b(hd)?ts\b|telesync|\bscr\b|screener|\btc\b|telecine/i.test(`${s.name || ''}\n${s.title || s.description || ''}`);

/** Pull quality, seeders, size, provider and tags out of a Stremio stream (Torrentio format, with fallbacks). */
function parseStream(s, addon, i){
  const title = s.title || s.description || '';
  const text = `${s.name || ''}\n${title}\n${s.behaviorHints?.filename || ''}`.toLowerCase();
  const q = /\b(hd)?cam(rip)?\b|\b(hd)?ts\b|telesync|\bscr\b|screener|\btc\b|telecine/.test(text) ? 'CAM'
    : /2160p|\b4k\b|\buhd\b/.test(text) ? '4K'
    : /1080p/.test(text) ? '1080p'
    : /720p/.test(text) ? '720p'
    : /480p|576p|360p|\bsd\b|dvdrip|xvid/.test(text) ? 'SD' : 'Other';
  const seeds = title.match(/👤\s*(\d+)/)?.[1];
  const sm = title.match(/💾\s*([\d.,]+)\s*([KMGT])i?B/i);
  const size = sm ? parseFloat(sm[1].replace(',', '.')) * 1024 ** ('KMGT'.indexOf(sm[2].toUpperCase()) + 1)
                  : (s.behaviorHints?.videoSize || null);
  const tags = [[/\b(dv|dovi|dolby.?vision)\b/, 'DV'], [/\bhdr(10\+?)?(?![a-z])/, 'HDR'], [/x265|hevc|h\.?265/, 'HEVC'],
                [/remux/, 'REMUX'], [/\b3d\b/, '3D']].filter(([re]) => re.test(text)).map(([, t]) => t);
  return {
    s, addon, i, q, size, tags,
    seeds: seeds != null ? +seeds : null,
    provider: (title.match(/⚙️\s*([^\n]+)/)?.[1] || '').trim(),
    flags: title.match(/[\u{1F1E6}-\u{1F1FF}]{2}/gu) || [],
    name: (title.split('\n')[0] || s.name || addon).trim(),
    direct: !!(s.url || s.externalUrl || s.ytId),
  };
}

/** How good a source is to stream on a phone/TV: direct links first, then well-seeded 1080p. */
function rank(x){
  if(x.direct) return 1e9;
  const seeds = x.seeds ?? 0;
  if(seeds < 1) return -1;
  const quality = {'1080p': 1, '720p': .92, '4K': .6, 'SD': .45, 'Other': .35}[x.q] ?? .3;
  // A stream starts when the first piece has arrived, and pieces grow with the file: a small file starts
  // sooner (and huge remuxes stall), so size counts against a source as well as seeders for it.
  const gb = x.size ? x.size / GB : 0;
  const size = !gb || gb <= 3 ? 1 : gb <= 6 ? .85 : gb <= 12 ? .6 : .35;
  return Math.log10(seeds + 1) * quality * size;
}

function playStream(s, label, ctx){
  // Release/file name lets the app pick Hebrew subtitles timed for this exact release.
  const release = s.behaviorHints?.filename || (s.title || s.description || '').split('\n')[0] || '';
  const vid = ctx.videoId || '';
  // what is playing (for "continue watching") and where to resume from
  const meta = JSON.stringify({metaId: ctx.meta?.id || vid, type: ctx.type || 'movie', name: ctx.meta?.name || label, poster: ctx.meta?.poster || ''});
  const done = progress[vid];
  const pos = done && done.d && done.t < done.d - 60 ? Math.floor(done.t * 1000) : 0;
  if(s.url && window.BoothAndroid) BoothAndroid.playUrl(s.url, label, vid, release, meta, pos);
  else if(s.url || s.ytId) openPlayer(s, label, ctx);
  else if(s.externalUrl && window.BoothAndroid) BoothAndroid.playUrl(s.externalUrl, label, vid, release, meta, 0);
  else if(s.externalUrl) window.open(s.externalUrl, '_blank', 'noopener');
  else if(s.infoHash && window.BoothAndroid) BoothAndroid.playTorrent(s.infoHash, Number.isInteger(s.fileIdx) ? s.fileIdx : -1, label, JSON.stringify(s.sources || []), vid, release, meta, pos);
  else alert(tr('src.torrentApp'));
}

/** Play, the quality shortcuts and the rest of the list go into the title's action row (#streams); what is
    still loading is a small note beside them, and the long list opens below the row (#palt). */
function renderStreams(box, all, pending, label, ctx, errors = [], retry){
  const alt = $('#palt');
  const wasOpen = $('#altToggle')?.getAttribute('aria-expanded') === 'true';
  if(alt) alt.innerHTML = '';
  const list = all.filter(x => x.q !== 'CAM' && rank(x) >= 0).sort((a, b) => rank(b) - rank(a));
  const best = list[0];
  if(!best){
    if(!pending && errors.length){
      box.innerHTML = `<span class="srcstat err">${errors.map(esc).join(' · ')}</span><button class="qbtn" id="sretry">${tr('common.retry')}</button>`;
      $('#sretry').onclick = retry;
      return;
    }
    box.innerHTML = `<span class="srcstat${pending ? '' : ' idle'}">${tr(pending ? 'src.searching' : 'src.none')}</span>`;
    return;
  }
  const byQuality = ['4K', '1080p', '720p', 'SD'].map(q => list.find(x => x.q === q)).filter(Boolean);
  const detail = x => [x.q === 'Other' ? '' : x.q, x.size && fmtSize(x.size)].filter(Boolean).join(' · ');
  box.innerHTML = `<button class="playbtn" data-i="${best.i}">▶ ${tr('src.play')} <small>${esc(detail(best))}</small></button>
      ${byQuality.length > 1 ? byQuality.map(x => `<button class="qbtn" data-i="${x.i}">${x.q}</button>`).join('') : ''}
      ${list.length > 1 ? `<button class="altbtn" id="altToggle" aria-expanded="${wasOpen}">${tr('src.more', {n: list.length - 1})}</button>` : ''}
      ${pending ? `<span class="srcstat">${tr('src.searchingMore')}</span>` : ''}`;
  if(alt && list.length > 1) alt.innerHTML = `<div class="altlist"${wasOpen ? '' : ' hidden'}>${list.slice(1, 40).map(x => `<button class="srow" data-i="${x.i}"><b>${x.q === 'Other' ? '—' : x.q}</b><span>${x.size ? fmtSize(x.size) : ''}</span><span>${x.direct ? tr('src.direct') : '👤 ' + (x.seeds ?? 0)}</span></button>`).join('')}</div>`;
  [box, alt].forEach(el => el?.querySelectorAll('[data-i]').forEach(b => b.onclick = () => playStream(all[b.dataset.i].s, label, ctx)));
  if($('#altToggle')) $('#altToggle').onclick = e => {
    const btn = e.currentTarget, open = btn.getAttribute('aria-expanded') === 'true', more = alt.querySelector('.altlist');
    btn.setAttribute('aria-expanded', String(!open));
    more.hidden = open;
    if(!open) more.querySelector('button')?.focus();
  };
}

/* A source list is asked for once: a title's page, its poster being looked at, and the availability
   check all share the same answer for ten minutes. */
const streamCache = new Map();                              // "add-on|type|id" -> {at, p}
const STREAM_TTL = 10 * 60e3;
function fetchStreams(a, type, videoId){
  const key = `${a.base}|${type}|${videoId}`;
  const hit = streamCache.get(key);
  if(hit && Date.now() - hit.at < STREAM_TTL) return hit.p;
  const url = `${a.base}/stream/${type}/${encodeURIComponent(videoId)}.json`;
  const p = getJSON(url, 12000).catch(() => new Promise(r => setTimeout(r, 700)).then(() => getJSON(url, 12000)))   // one quiet retry
    .then(d => d.streams || []);
  p.catch(() => streamCache.delete(key));                    // a failure is never remembered
  streamCache.set(key, {at: Date.now(), p});
  if(streamCache.size > 80) streamCache.delete(streamCache.keys().next().value);
  return p;
}
function warmSources(type, videoId){
  for(const a of addons) if(supports(a.manifest, 'stream', type, videoId)) fetchStreams(a, type, videoId).catch(() => {});
}
/** Start a title's source lists while the viewer is still looking at its poster: a moment's rest, not a scroll past. */
let warmTimer = 0;
const warmFrom = e => {
  const a = e.target?.closest?.('a.poster[data-avail]');
  clearTimeout(warmTimer);
  if(!a) return;
  warmTimer = setTimeout(() => {
    const [type, id] = a.dataset.avail.split(':');
    warmSources(type, type === 'series' ? `${id}:1:1` : id);
  }, 450);
};
addEventListener('focusin', warmFrom);
addEventListener('mouseover', e => { if(!isTvLayout()) warmFrom(e); });

async function loadStreams({type, meta}, videoId, label){
  const box = $('#streams');
  const takeFocus = isTvLayout() && (!document.activeElement || document.activeElement === document.body
    || document.activeElement.closest('.eps'));
  const src = addons.filter(a => supports(a.manifest, 'stream', type, videoId));
  if(!src.length){ box.innerHTML = `<span class="srcstat idle">${tr('src.noAddon')}</span>`; return; }
  const token = ++streamsToken;
  const ctx = {videoId, type, meta};
  const all = [], errors = [];
  let pending = src.length;
  const retry = () => loadStreams({type, meta}, videoId, label);
  let focused = false;
  const render = () => {
    if(token !== streamsToken || !box.isConnected) return;
    renderStreams(box, all, pending > 0, label, ctx, errors, retry);
    // the first thing the remote holds on a title is "play"
    const play = box.querySelector('.playbtn:not([disabled])');
    if(play && takeFocus && !focused){ focused = true; play.focus(); }
  };
  render();
  await Promise.all(src.map(async a => {
    try{
      for(const s of await fetchStreams(a, type, videoId)) all.push(parseStream(s, a.manifest.name, all.length));
    }catch(e){ errors.push(`${a.manifest.name}: ${e.message || tr('net.noResponse')}`); }
    pending--;
    render();
  }));
  if(type === 'movie' && !errors.length) setAvail(`${type}:${meta.id}`, all.some(x => x.q !== 'CAM' && rank(x) >= 0));
}

/* ---------- which titles have sources (greys out / hides the rest) ---------- */
let avail = store.get('avail', {});                 // "type:tt…" -> [ok, checkedAt, emptyAnswers]
if(store.get('availRev', 0) < 1){ avail = {}; store.set('avail', avail); store.set('availRev', 1); }   // 0.11/0.12 results may be wrong
const AVAIL_TTL = 3 * 864e5;
const availPending = new Set();
let availBusy = false;
const isNoSrc = e => e && !e[0] && (e[2] || 0) >= 2;
// known = available (fresh), or confirmed empty twice (fresh); a single empty answer is re-checked after 10 minutes
const availKnown = k => { const e = avail[k]; if(!e) return false; const age = Date.now() - e[1];
  return e[0] || isNoSrc(e) ? age < AVAIL_TTL : age < 6e5; };
function setAvail(key, ok){
  const prev = avail[key];
  avail[key] = ok ? [true, Date.now(), 0] : [false, Date.now(), prev && !prev[0] ? (prev[2] || 1) + 1 : 1];
  store.lazy('avail', capMap(avail, 2000));
  const none = isNoSrc(avail[key]);
  document.querySelectorAll(`[data-avail="${key}"]`).forEach(el => el.classList.toggle('nosrc', none));
}
async function hasSources(key){
  const [type, id] = key.split(':');
  const vid = type === 'series' ? `${id}:1:1` : id;          // a series counts as available if S1E1 is
  for(const a of addons.filter(a => supports(a.manifest, 'stream', type, vid))){
    try{
      if((await fetchStreams(a, type, vid)).some(s => !isCam(s))) return true;
    }catch(e){ return null; }                                 // unknown: don't grey out on a network error
  }
  return false;
}
let availScreen = 0;                                          // how many probes this screen already used
addEventListener('hashchange', () => { availPending.clear(); availScreen = 0; });
function queueAvail(keys){
  if(isTvLayout()) return;                                   // TV boxes: skip background source checks
  if(availScreen > 40) return;                               // and never turn a screen into a request storm
  availScreen += keys.length;
  for(const k of keys) if(!availKnown(k)) availPending.add(k);
  if(!availBusy) availFlush();
}
async function availFlush(){
  availBusy = true;
  while(availPending.size){
    const batch = [...availPending].slice(0, 2);          // gentle on the stream add-on
    batch.forEach(k => availPending.delete(k));
    await Promise.all(batch.map(async k => { const ok = await hasSources(k); if(ok !== null) setAvail(k, ok); }));
    await new Promise(r => setTimeout(r, 300));
  }
  availBusy = false;
}
const availObserver = new IntersectionObserver(entries => {
  const keys = [];
  for(const en of entries) if(en.isIntersecting){ availObserver.unobserve(en.target); keys.push(en.target.dataset.avail); }
  if(keys.length) queueAvail(keys);
}, {rootMargin: '300px'});
new MutationObserver(muts => {
  const now = [];
  for(const m of muts) for(const n of m.addedNodes){
    if(n.nodeType !== 1) continue;
    for(const el of n.matches('[data-avail]') ? [n] : n.querySelectorAll('[data-avail]')){
      if(availKnown(el.dataset.avail)) continue;
      if([...el.parentNode.children].indexOf(el) < 6) now.push(el.dataset.avail); else availObserver.observe(el);
    }
  }
  if(now.length) queueAvail(now);
}).observe(document.body, {childList: true, subtree: true});

function viewLibrary(){
  const items = Object.values(library).sort((a,b) => b.added - a.added);
  $('#app').innerHTML = `<div class="page"><h1>הספרייה</h1>${items.length ? `<div class="grid">${items.map(card).join('')}</div>` : `<p class="note">הספרייה ריקה. פתח כותר ובחר „הוסף לספרייה”.</p>`}</div>`;
}

const nativeCallbacks = {};

  const cb = nativeCallbacks[id]; delete nativeCallbacks[id];
  if(cb) ok ? cb.res(body) : cb.rej(new Error(body));

function fetchText(url){

function parseM3U(text){
  const out = [];
  let cur = null;
  for(const raw of text.split(/\r?\n/)){
    const line = raw.trim();
    if(!line) continue;
    if(line.startsWith('#EXTINF')){
      const attr = k => { const m = line.match(new RegExp(k + '=(?:"([^"]*)"|([^\\s,]+))')); return m ? (m[1] ?? m[2] ?? '') : ''; };
      const bare = line.replace(/[\w-]+="[^"]*"/g, '');
      cur = {name: bare.slice(bare.indexOf(',') + 1).trim() || 'ערוץ', logo: attr('tvg-logo'),
             group: attr('group-title') || 'ערוצים', ua: attr('http-user-agent'), referer: attr('http-referrer'),
             epg: attr('tvg-id'), rec: parseInt(attr('tvg-rec')) || 0};
    } else if(line.startsWith('#EXTVLCOPT:')){
      if(!cur) continue;
      const [k, ...v] = line.slice(11).split('=');
      if(k === 'http-user-agent') cur.ua = v.join('=');
      if(k === 'http-referrer') cur.referer = v.join('=');
    } else if(line.startsWith('#EXTGRP:')){
      if(cur) cur.group = line.slice(8).trim();
    } else if(!line.startsWith('#')){
      out.push(cur ? {...cur, url: line} : {name: line.split('/').pop(), group: 'ערוצים', url: line});
      cur = null;
    }
  }
  return out;
}

/* ---------- RaspberryTV: live channels + catch-up with the subscriber's access key ----------
   Same service API the OTT-Play app uses: the playlist is keyed by the 8-character access key,
   streams are Flussonic-style (index.m3u8 / index-<start>-<duration>.m3u8) with a per-user token,
   and the programme guide comes from protected-api.com. The key is stored only on this device. */
const RTV_PLAYLIST = key => `https://play-berry.net/playlist/${encodeURIComponent(key)}.m3u8`;
const RTV_EPG = id => `http://protected-api.com/epg/${encodeURIComponent(id)}?date=`;
let rtvCache = null;

async function loadRtv(){
  const key = store.get('rtvKey', '');
  if(!key) return null;
  if(rtvCache) return rtvCache;
  const chans = parseM3U(await fetchText(RTV_PLAYLIST(key)));
  for(const c of chans){
    // Live plays the playlist URL exactly as given. For catch-up, recognise the service's
    // http://server:port/<path>/<token>/<channel>.m3u8 layout (as OTT-Play does).
    const m = c.url.match(/^https?:\/\/([^/:]+)(?::\d+)?\/[^/]+\/([^/]+)\/([^/.?]+)\.m3u8/);
    if(m){ c.server = m[1]; c.token = m[2]; c.cid = m[3]; }
    c.ua ||= BROWSER_UA;                      // some IPTV servers turn away the player's default agent
  }
  if(!chans.length) throw new Error('הרשימה ריקה. ודא שהמנוי פעיל ושהקוד נכון');
  return rtvCache = chans;
}

const BROWSER_UA = 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36';

/** Flussonic-style catch-up URL: timeshift for the last minutes, otherwise a start+duration window. */
function rtvArchiveUrl(c, start, end){
  const now = Date.now() / 1000;
  start = Math.floor(start);
  if(!end || end <= start) end = now + 600;
  const file = start > now - 600 ? `timeshift_abs-${start}.m3u8` : `index-${start}-${Math.floor(end - start)}.m3u8`;
  if(c.cid) return `http://${c.server}:80/${c.cid}/${file}?token=${c.token}`;
  // otherwise swap the file name of the live URL (…/<channel>/index.m3u8?token=… style)
  const [path, query] = c.url.split('?');
  return path.replace(/[^/]+$/, file) + (query ? '?' + query : '');
}

const DAY_NAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const hhmm = t => new Date(t * 1000).toLocaleTimeString('he-IL', {hour: '2-digit', minute: '2-digit'});
const dayKey = t => new Date(t * 1000).toDateString();

/** RaspberryTV's access key, typed on screen: eight characters, remote-friendly, no keyboard popup. */
function openRtvKey(after){
  document.querySelector('.sheet')?.remove();
  let code = '';
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  const chars = [...'0123456789abcdefghijklmnopqrstuvwxyz'];
  sheet.innerHTML = `<div role="dialog" aria-modal="true" aria-label="קוד גישה ל־RaspberryTV">
    <header><b>קוד הגישה של RaspberryTV</b><button aria-label="סגור">✕</button></header>
    <div class="body">
      <p class="note" style="margin:0">הקוד בן 8 תווים, מהחשבון שלך באתר RaspberryTV תחת "Access key for applications". הוא נשמר רק במכשיר הזה.</p>
      <div class="keyboxes" id="kbox">${'<span></span>'.repeat(8)}</div>
      <div class="keypad" id="kpad">
        ${chars.map(c => `<button data-k="${c}">${c}</button>`).join('')}
        <button class="wide" data-del="1">⌫ מחק</button>
        <button class="wide" data-ok="1">שמור</button>
      </div>
    </div></div>`;
  document.body.appendChild(sheet);
  const close = () => sheet.remove();
  sheet.querySelector('header button').onclick = close;
  sheet.onclick = e => { if(e.target === sheet) close(); };
  const paint = () => sheet.querySelectorAll('#kbox span').forEach((b, i) => {
    b.textContent = code[i] || '';
    b.classList.toggle('set', !!code[i]);
  });
  const save = () => {
    if(code.length !== 8) return;
    store.set('rtvKey', code); rtvCache = null; store.set('livePl', 'rtv');
    close();
    after ? after() : (location.hash = '#/live');
  };
  sheet.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
    if(code.length < 8){ code += b.dataset.k; paint(); }
    if(code.length === 8) sheet.querySelector('[data-ok]').focus();
  });
  sheet.querySelector('[data-del]').onclick = () => { code = code.slice(0, -1); paint(); };
  sheet.querySelector('[data-ok]').onclick = save;
  // a real keyboard (phone, or a USB one on the TV) types straight into it
  sheet.addEventListener('keydown', e => {
    if(/^[0-9a-zA-Z]$/.test(e.key) && code.length < 8){ code += e.key.toLowerCase(); paint(); e.preventDefault(); }
    else if(e.key === 'Backspace'){ code = code.slice(0, -1); paint(); e.preventDefault(); }
    else if(e.key === 'Enter' && code.length === 8){ save(); e.preventDefault(); }
  });
  sheet.querySelector('[data-k]').focus();
}

/** Channel sheet: watch live, or pick a past programme from the guide (catch-up). */
async function openChannel(c){
  document.querySelector('.sheet')?.remove();
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = `<div role="dialog" aria-modal="true" aria-label="${esc(c.name)}">
      <header>${c.logo ? `<img src="${esc(c.logo)}" alt="">` : ''}<b>${esc(c.name)}</b><button aria-label="סגור">✕</button></header>
      <div class="body"><div class="playrow"><button class="playbtn" id="goLive">▶ שידור חי</button></div>
        ${c.rec ? `<div id="guide"><p class="note">טוען את לוח השידורים…</p></div>` : ''}</div></div>`;
  document.body.appendChild(sheet);
  const close = () => sheet.remove();
  sheet.querySelector('header button').onclick = close;
  sheet.onclick = e => { if(e.target === sheet) close(); };
  sheet.querySelector('#goLive').onclick = () => { close(); playLive(c); };
  sheet.querySelector('#goLive').focus();
  if(!c.rec) return;

  const guide = sheet.querySelector('#guide');
  const now = Date.now() / 1000, from = now - c.rec * 86400;
  let progs = [];
  try{
    const d = JSON.parse(await fetchText(RTV_EPG(c.epg)));
    progs = (Array.isArray(d) ? d : []).map(g => ({t: +g.time, to: +g.time_to, name: g.name || '', descr: g.descr || ''}))
      .filter(g => g.t && g.to > from && g.t < now + 3 * 3600).sort((a, b) => a.t - b.t);
  }catch(e){ /* no guide: fall back to picking a time */ }

  if(!progs.length){
    // No programme guide: jump back by time instead.
    guide.innerHTML = `<p class="note" style="margin:0">אין לוח שידורים לערוץ הזה. אפשר לחזור אחורה לפי שעה (עד ${c.rec} ימים):</p>
      <div class="keyform"><input class="field" type="datetime-local" id="tpick" dir="ltr"><button class="btn primary" id="tgo">נגן מהשעה הזו</button></div>`;
    const pad = n => String(n).padStart(2, '0');
    const d = new Date(Date.now() - 3600e3);
    sheet.querySelector('#tpick').value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    sheet.querySelector('#tgo').onclick = () => {
      const t = new Date(sheet.querySelector('#tpick').value).getTime() / 1000;
      if(!t || t < from || t > now) return alert(`אפשר לבחור זמן מ־${c.rec} הימים האחרונים בלבד.`);
      close(); playLive({...c, url: rtvArchiveUrl(c, t, t + 3 * 3600), name: `${c.name} · ${hhmm(t)}`});
    };
    return;
  }

  const days = [...new Set(progs.map(g => dayKey(g.t)))];
  const today = new Date().toDateString(), yesterday = new Date(Date.now() - 864e5).toDateString();
  const dayLabel = k => k === today ? 'היום' : k === yesterday ? 'אתמול' : `יום ${DAY_NAMES[new Date(k).getDay()]}`;
  let sel = today in Object.fromEntries(days.map(k => [k, 1])) ? today : days[days.length - 1];
  const draw = () => {
    const list = progs.filter(g => dayKey(g.t) === sel);
    guide.innerHTML = `<div class="days">${days.map(k => `<button class="${k === sel ? 'on' : ''}" data-day="${esc(k)}">${dayLabel(k)}</button>`).join('')}</div>
      <div class="progs">${list.map((g, i) => {
        const state = g.t > now ? 'future' : g.to > now ? 'now' : '';
        return `<button class="prog ${state}" data-p="${progs.indexOf(g)}" ${state === 'future' ? 'disabled' : ''} title="${esc(g.descr)}"><time>${hhmm(g.t)}</time><span>${esc(g.name)}${state === 'now' ? ' · עכשיו' : ''}</span></button>`;
      }).join('')}</div>`;
    guide.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { sel = b.dataset.day; draw(); });
    guide.querySelectorAll('.prog:not(.future)').forEach(b => b.onclick = () => {
      const g = progs[b.dataset.p];
      close();
      playLive({...c, url: rtvArchiveUrl(c, g.t, g.to), name: `${c.name} · ${g.name}`});
    });
    guide.querySelector('.prog.now')?.scrollIntoView({block: 'center'});
  };
  draw();
}
addEventListener('keydown', e => { if(e.key === 'Escape') document.querySelector('.sheet')?.remove(); });

function playLive(ch){
  if(window.BoothAndroid && BoothAndroid.playLive) BoothAndroid.playLive(ch.url, ch.name, ch.ua || '', ch.referer || '');
  else openPlayer({url: ch.url}, ch.name, null);
}

/** "Now playing" for RaspberryTV channels (programme guide), cached for a few minutes. */
const nowCache = {};
async function nowPlaying(c){
  if(!c.epg) return null;
  const hit = nowCache[c.epg];
  if(hit && Date.now() - hit.at < 3e5) return hit.p;
  let p = null;
  try{
    const d = JSON.parse(await fetchText(`http://protected-api.com/epg/current/${encodeURIComponent(c.epg)}?num=1`));
    const list = (Array.isArray(d) ? d : d ? [d] : []).map(g => ({t: +g.time, to: +g.time_to, name: g.name || ''}));
    const now = Date.now() / 1000;
    p = list.find(g => g.t <= now && g.to > now) || list[0] || null;
  }catch(e){}
  nowCache[c.epg] = {at: Date.now(), p};
  return p;
}

/** Everything the Live TV page can show: RaspberryTV (if a key is set), official channels, own playlists. */
function liveSources(){
  return [...(store.get('rtvKey', '') ? [{key: 'rtv', name: 'RaspberryTV'}] : []),
          {key: 'il', name: 'ערוצים ישראליים'}, ...playlists.map(p => ({key: p.url, name: p.name}))];
}
async function liveChannels(key){
  if(key === 'il'){
    const r13ch = await r13channels().catch(() => []);
    const main = r13ch.filter(c => c.name === 'רשת 13'), extra = r13ch.filter(c => c.name !== 'רשת 13');
    return [IL_CHANNELS[0], ...main, ...IL_CHANNELS.slice(1), ...extra];     // כאן 11, רשת 13, עכשיו 14, … then 13's themed channels
  }
  if(key === 'rtv') return loadRtv();
  return playlistCache[key] ||= parseM3U(await fetchText(key));
}

/** Play a channel full screen, with the rest of the list available for zapping. */
function watchChannel(list, i, sourceKey){
  store.set('lastChannel', {src: sourceKey, name: list[i].name});
  if(window.BoothAndroid && BoothAndroid.playChannels)
    // logo + guide endpoint travel with the channel so the player's banner can show what is on
    BoothAndroid.playChannels(JSON.stringify(list.map((c, n) => ({
      name: c.name, url: c.url, ua: c.ua || '', referer: c.referer || '',
      num: n + 1, logo: c.logo || '', epg: c.epg ? RTV_EPG(c.epg) : ''
    }))), i);
  else playLive(list[i]);
}

async function viewLive(){
  const app = $('#app');
  const sources = liveSources();
  let sel = store.get('livePl', sources[0].key);
  if(!sources.some(x => x.key === sel)) sel = sources[0].key;
  app.innerHTML = `<div class="page"><h1>שידור חי</h1>
    <div class="live-top">
      ${sources.length > 1 ? sources.map(x => `<button class="chip ${x.key === sel ? 'on' : ''}" data-pl="${esc(x.key)}">${esc(x.name)}</button>`).join('') : ''}
      <span class="live-groups" id="lg" role="group" aria-label="קבוצה" hidden></span>
      <input class="field" id="lq" type="search" placeholder="חיפוש ערוץ" aria-label="חיפוש ערוץ">
    </div>
    <div id="cont"></div>
    <div id="chs"><p class="note">טוען ערוצים…</p></div>
    ${store.get('rtvKey', '') ? '' : `<div class="keyform" style="margin-top:24px"><button class="btn primary" id="rtvOpen">הזן קוד RaspberryTV</button>
      <span class="note">מנוי RaspberryTV? הזן את קוד הגישה פעם אחת והערוצים יופיעו כאן.</span></div>`}</div>`;
  if($('#rtvOpen')) $('#rtvOpen').onclick = () => openRtvKey(viewLive);
  app.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => { store.set('livePl', b.dataset.pl); store.set('liveGroup', ''); viewLive(); });

  let chans;
  try{ chans = await liveChannels(sel); }
  catch(err){ showErr($('#chs'), 'לא ניתן לטעון את הערוצים', err, viewLive); return; }

  const groups = [...new Set(chans.map(c => c.group))];
  let liveGroup = store.get('liveGroup', '');
  if(!groups.includes(liveGroup)) liveGroup = '';
  if(groups.length > 1){
    $('#lg').hidden = false;
    $('#lg').innerHTML = [['', `הכל (${chans.length})`], ...groups.map(g => [g, g])].map(([v, n]) =>
      `<button class="chip ${liveGroup === v ? 'on' : ''}" data-g="${esc(v)}">${esc(n)}</button>`).join('');
    $('#lg').querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
      store.set('liveGroup', b.dataset.g);
      $('#lg').querySelectorAll('[data-g]').forEach(x => x.classList.toggle('on', x === b));
      draw();
    });
  }

  const last = store.get('lastChannel', null);
  const lastIdx = last && last.src === sel ? chans.findIndex(c => c.name === last.name) : -1;
  $('#cont').innerHTML = lastIdx >= 0 ? `<button class="continue" id="goLast">▶ המשך לצפות · <span>${esc(chans[lastIdx].name)}</span></button>` : '';
  if(lastIdx >= 0) $('#goLast').onclick = () => watchChannel(chans, lastIdx, sel);

  const initials = c => esc(c.name.replace(/[^\p{L}\p{N}]/gu, '').slice(0, 2));
  const numbers = new Map(chans.map((c, i) => [c, i + 1]));   // channel number without scanning the list per row
  let nowIo = null;
  const draw = () => {
    nowIo?.disconnect();
    const q = $('#lq').value.trim().toLowerCase(), g = $('#lg').hidden ? '' : $('#lg').querySelector('.on')?.dataset.g || '';
    const list = chans.filter(c => (!g || c.group === g) && (!q || c.name.toLowerCase().includes(q)));
    $('#chs').innerHTML = list.length ? `<div class="chlist">${list.map((c, i) => `<div class="chrow">
        <button class="chmain" data-i="${i}"><span class="chnum">${numbers.get(c)}</span>
          <span class="chlogo">${c.logo ? `<img src="${esc(c.logo)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${initials(c)}'}))">` : `<span>${initials(c)}</span>`}</span>
          <span class="chinfo"><b>${esc(c.name)}</b><small data-now="${i}">${c.epg ? '' : esc(c.group || '')}</small></span></button>
        ${c.rec ? `<button class="chback" data-back="${i}" aria-label="צפייה אחורה ב${esc(c.name)}" title="צפייה אחורה (${c.rec} ימים)">⟲</button>` : ''}
      </div>`).join('')}</div>` : '<p class="note">אין ערוצים שמתאימים.</p>';
    $('#chs').querySelectorAll('[data-i]').forEach(b => {
      const c = list[b.dataset.i];
      let longPressed = false, timer = null;
      b.onclick = () => { if(longPressed){ longPressed = false; return; } watchChannel(list, +b.dataset.i, sel); };
      if(!c.rec) return;
      // Long press (touch, or holding OK on a remote) opens catch-up: the week's programme guide.
      const openBack = () => { longPressed = true; openChannel(c); };
      b.oncontextmenu = e => { e.preventDefault(); openBack(); };
      b.onpointerdown = () => { longPressed = false; clearTimeout(timer); timer = setTimeout(openBack, 600); };
      b.onpointerup = b.onpointerleave = b.onpointercancel = () => clearTimeout(timer);
      b.onkeydown = e => { if(e.key === 'Enter' && e.repeat && !longPressed){ e.preventDefault(); openBack(); } };
    });
    $('#chs').querySelectorAll('[data-back]').forEach(b => b.onclick = () => openChannel(list[b.dataset.back]));
    // "now playing" line for visible channels
    const showNow = async el => {
      const p = await nowPlaying(list[el.dataset.now]);
      if(!p || !el.isConnected || el.dataset.done) return;
      el.dataset.done = 1;
      const pct = Math.max(0, Math.min(100, (Date.now() / 1000 - p.t) / (p.to - p.t) * 100));
      el.textContent = `${p.name} · ${hhmm(p.t)}–${hhmm(p.to)}`;
      el.insertAdjacentHTML('afterend', `<span class="bar"><i style="width:${pct.toFixed(0)}%"></i></span>`);
    };
    nowIo = new IntersectionObserver(entries => {
      for(const en of entries) if(en.isIntersecting){ nowIo.unobserve(en.target); showNow(en.target); }
    }, {rootMargin: '200px'});
    list.forEach((c, i) => {
      if(!c.epg) return;
      const el = $('#chs').querySelector(`[data-now="${i}"]`);
      if(i < 12) showNow(el); else nowIo.observe(el);
    });
  };
  let typing = null;
  $('#lq').oninput = () => { clearTimeout(typing); typing = setTimeout(draw, 200); };   // playlists can hold thousands
  draw();
}

/** The player draws its own banner and channel list in native views: hand it this skin and direction. */
function syncNativeTheme(){
  const s = getComputedStyle(document.documentElement), v = n => s.getPropertyValue(n).trim();
  try{
    window.BoothAndroid?.setTheme?.(JSON.stringify({dir: document.documentElement.dir,
      night: v('--night'), raise: v('--raise'), line: v('--line'),
      light: v('--light'), muted: v('--muted'), accent: v('--tungsten'), onAccent: v('--on-accent')}));
  }catch(e){}
}
function applySettings(){
  const r = document.documentElement;
  r.dataset.skin = settings.skin; r.dataset.layout = settings.layout; r.dataset.poster = settings.poster; r.dataset.nosrc = settings.nosrc;
  if(STRINGS[settings.uiLang] && settings.uiLang !== UI){ UI = settings.uiLang; applyUiLang(); }
  syncNativeTheme();
}

/* Settings: one page per subject, chosen from the menu on the side. Nothing is more than
   two moves away with the remote, and every screen fits without scrolling. */
const SETTINGS_TABS = ['start', 'look', 'home', 'live', 'addons', 'about'];
let setTab = 'start';

function viewSettings(tab){
  setTab = SETTINGS_TABS.includes(tab) ? tab : setTab;
  $('#app').innerHTML = `<div class="page"><h1>${tr('set.title')}</h1>
    <div class="sgrid">
      <nav class="stabs" role="tablist" aria-label="${esc(tr('set.tabsAria'))}">${SETTINGS_TABS.map(id =>
        `<button role="tab" data-tab="${id}" class="${setTab === id ? 'on' : ''}" aria-selected="${setTab === id}">${tr('set.tab.' + id)}</button>`).join('')}</nav>
      <div class="spane" id="spane" role="tabpanel"></div>
    </div></div>`;
  $('.stabs').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    if(setTab === b.dataset.tab) return;
    setTab = b.dataset.tab;
    $('.stabs').querySelectorAll('[data-tab]').forEach(x => {
      x.classList.toggle('on', x.dataset.tab === setTab);
      x.setAttribute('aria-selected', x.dataset.tab === setTab);
    });
    paintSettings();
  });
  paintSettings();
}

      ${preview}<span class="sn">${tr(`${g}.${o.id}.name`)}</span><span class="sd">${tr(`${g}.${o.id}.note`)}</span></button>`;
  const swatch = o => `<span class="swatch" style="background:${o.c[0]}" aria-hidden="true"><i style="background:${o.c[1]}"></i><i style="background:${o.c[2]}"></i><b style="color:${o.c[3]}">Aa</b></span>`;
  const hidden = new Set(settings.hiddenCats || []);
  const ordered = [...(settings.cats || []), ...CATEGORIES.map(c => c.id).filter(id => !(settings.cats || []).includes(id))]
    .map(id => CATEGORIES.find(c => c.id === id)).filter(Boolean);

let hls = null;
/** hls.js is only needed by the in-page player (the Android player handles HLS itself). */
let hlsLoading = null;
const loadHls = () => window.Hls ? Promise.resolve(window.Hls) : (hlsLoading ||= new Promise(res => {
  const tag = document.createElement('script');
  tag.src = 'https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js';
  tag.onload = () => res(window.Hls);
  tag.onerror = () => res(null);
  document.head.appendChild(tag);
}));

function openPlayer(s, title, ctx){
  if(s.ytId && window.BoothAndroid?.openYouTube) return BoothAndroid.openYouTube(s.ytId);
  $('#ptitle').textContent = title;
  const body = $('#pbody');
  if(s.ytId){
    body.innerHTML = `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(s.ytId)}?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  } else {
    body.innerHTML = `<video id="vid" controls autoplay playsinline></video>`;
    const v = $('#vid');
    if(/\.m3u8(\?|$)/.test(s.url)){
      loadHls().then(Hls => { if(Hls?.isSupported()){ hls?.destroy(); hls = new Hls(); hls.loadSource(s.url); hls.attachMedia(v); } else v.src = s.url; });
    }
    else v.src = s.url;
    if(ctx){
      const saved = progress[ctx.videoId];
      if(saved) v.addEventListener('loadedmetadata', () => { if(saved.t < v.duration - 30) v.currentTime = saved.t; }, {once:true});
      let last = 0;
      v.addEventListener('timeupdate', () => {
        if(Math.abs(v.currentTime - last) < 5) return; last = v.currentTime;
        progress[ctx.videoId] = {t: v.currentTime, d: v.duration, at: Date.now(), metaId: ctx.meta.id, type: ctx.type,
          name: ctx.meta.name, poster: ctx.meta.poster, done: v.currentTime > v.duration - 60};
        store.set('progress', progress);
        indexProgress();
      });
      v.addEventListener('error', () => body.insertAdjacentHTML('afterbegin', `<p class="err" style="position:absolute;top:70px;inset-inline-end:20px">${tr('player.badFormat')}</p>`));
    }
  }
  $('#player').classList.add('open');
}
function closePlayer(){
  if(hls){ hls.destroy(); hls = null; }
  $('#pbody').innerHTML = ''; $('#player').classList.remove('open');
}
$('#close').onclick = closePlayer;
addEventListener('keydown', e => { if(e.key === 'Escape') closePlayer(); });

/* ---------- new version ----------
   On every start the app asks GitHub for the latest release. If it is newer than this build, a card
   offers it (just that, no release notes); "עדכן" hands the APK to Android's own downloader and installer, which asks before it
   installs. Nothing is downloaded or installed behind the viewer's back. */
const RELEASES = 'https://api.github.com/repos/bardalas/VEO/releases/latest';
const APK_URL = 'https://github.com/bardalas/VEO/releases/latest/download/VEO.apk';
const APP_VERSION = (() => { try{ return window.BoothAndroid?.appVersion?.() || ''; }catch(e){ return ''; } })();

/** "0.23.0" vs "0.24.1" -> is the second one newer? */
function isNewer(latest, current){
  const a = String(latest).replace(/^v/, '').split('.').map(Number);
  const b = String(current).replace(/^v/, '').split('.').map(Number);
  for(let i = 0; i < 3; i++){ const x = a[i] || 0, y = b[i] || 0; if(x !== y) return x > y; }
  return false;
}

async function checkUpdate(force){
  if(!APP_VERSION || !window.BoothAndroid?.openExternal) return;        // only inside the app
  if(document.querySelector('.update')) return;                         // one card at a time
  // a cold start always checks; returning to the foreground re-checks at most twice an hour
  if(!force && Date.now() - (store.get('updCheck', 0) || 0) < 30 * 60e3) return;
  let rel;
  try{ rel = await getJSON(RELEASES, 8000); }catch(e){ return; }
  store.set('updCheck', Date.now());
  const tag = (rel.tag_name || '').replace(/^v/, '');
  if(!tag || !isNewer(tag, APP_VERSION) || store.get('updSkip', '') === tag) return;
  const card = document.createElement('div');
  card.className = 'update';
  card.innerHTML = `<span><b>${tr('update.available', {tag: esc(tag)})}</b></span>
    <span class="btns"><button class="go" id="updGo">${tr('update.now')}</button><button id="updLater">${tr('update.later')}</button></span>`;
  document.body.appendChild(card);
  $('#updGo').onclick = () => {
    card.remove();
    try{ BoothAndroid.updateApp(APK_URL); }         // downloads and installs inside the app
    catch(e){ BoothAndroid.openExternal(APK_URL); } // only builds older than 0.29 land here
  };
  $('#updLater').onclick = () => { store.set('updSkip', tag); card.remove(); };
  if(isTvLayout()) $('#updGo').focus();
}

/** Let go of the previous screen's observers; the MutationObserver re-arms whatever the new one renders. */
function resetObservers(){
  for(const o of [bgObserver, heObserver, availObserver]) o.disconnect();
  document.querySelectorAll('[data-bgw]').forEach(el => { if(!el.style.backgroundImage) delete el.dataset.bgw; });

/* Where every screen was left off (scroll, and on TV which poster had focus), so Back puts you
   back where you were instead of at the top of the page. */
const screenMem = new Map();
let memHash = location.hash;
function rememberScreen(){
  const card = document.activeElement?.closest?.('.poster, .ep, .chmain');
  screenMem.set(memHash, {y: scrollY, id: card?.dataset.id || null});
  memHash = location.hash;
}
function restoreScreen(){
  const mem = screenMem.get(location.hash);
  if(!mem || (!mem.y && !mem.id)){ scrollTo(0, 0); return; }
  let tries = 0, stop = false;
  const cancel = () => { stop = true; };
  addEventListener('wheel', cancel, {once: true});
  addEventListener('touchstart', cancel, {once: true});
  const tick = () => {
    if(stop) return;
    if(mem.id){
      const el = document.querySelector(`.poster[data-id="${CSS.escape(mem.id)}"]`);
      if(el){ isTvLayout() ? focusItem(el) : el.scrollIntoView({block: 'center'}); stop = true; return; }
    }
    if(scrollY !== mem.y) scrollTo(0, mem.y);
    if(++tries < 8) setTimeout(tick, 180);
  };
  tick();
}

let listHash = '#/';                                 // the list a title was opened from
async function route(){
  rememberScreen();
  resetObservers();
  document.body.classList.remove('titlefit');
  const [, r = '', a, b, c] = location.hash.split('/').map(decodeURIComponent);
  document.querySelectorAll('.nav a').forEach(x => x.classList.toggle('on', x.dataset.r === (['', 'cat', 'detail', 'search', 'genres', 'genre'].includes(r) ? 'home' : ['r13', 'kan', 'mako'].includes(r) ? 'tv' : r)));
  if(['', 'cat', 'genres', 'genre', 'search', 'library'].includes(r)) listHash = location.hash || '#/';

  if(r === 'genres') viewGenres();
  else if(r === 'genre') viewGenre(a);
  else if(r === 'r13') viewR13Series(a, b);
  else if(r === 'kan') viewKanProgram(a, b);
  else if(r === 'tv') viewTv(a);
  else if(r === 'mako') viewMakoProgram(a, b);
  else if(r === 'cat') viewCategory(a);
  else if(r === 'live') viewLive();
  else if(r === 'search') viewSearch(a);
  else if(r === 'detail') viewDetail(a, b);

/* Remote control (Android TV): arrows move focus between titles and between rows, and the page
   follows the focus — instead of the browser scrolling on its own. */
const FOCUSABLE = 'a[href], button:not([disabled]), input:not([type="hidden"]), select, [tabindex]:not([tabindex="-1"])';
/* Every group of controls the remote can stand on. Anything focusable MUST sit inside one of
   these, or the D-pad cannot reach it; tvRows() keeps only the innermost match, so nesting two
   of them is safe. Grouped by the screen that renders them. */
const ROWS_SEL = [
  '.bar', '#cats', '.stabs',                                               // chrome: top bar, rail, settings menu
  '.bctabs', '.strip', '.grid', '.sopts', '.seg', '.sortbar',              // browsing rows and pickers
  '.ltabs', '.mkbar', '.oops',                                             // archive/mako tabs, error boxes
  '#desc', '.seasonbar', '.seasons', '.eps', '.eplist',                    // a title: text, episodes
  '.qvact', '.playrow', '.altlist',                                        // title card + sources
  '.live-top', '#cont', '#bchead', '.chrow',                               // live TV
  '.days', '.progs', '.keypad', '.keyform',                                // catch-up guide, key entry
  '.sheet header', '.sheet .body', '.tstat', '.update',                    // sheets and floating cards
  '.catorder', '.addpl', '.add', '.plrow', '.addon',                       // settings lists, add-ons
].join(', ');
// offsetParent is null for position:fixed elements (per spec) even when they're plainly on
// screen - the rail, the update card and the torrent-status card are all fixed. A size check
// on the box itself, ignoring layout position, doesn't have that blind spot.
const visible = el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; };
// While a sheet or the quick view is open the remote stays inside it: nothing behind it can take focus.
const tvScope = () => document.querySelector('.sheet') || document;
const tvRows = () => {
  const all = [...tvScope().querySelectorAll(ROWS_SEL)].filter(c => visible(c) && [...c.querySelectorAll(FOCUSABLE)].some(visible));
  // Only the innermost match is a row. Document order IS the order on screen - no CSS reorders
  // rows against the markup - and unlike measuring positions it cannot be shuffled by scrolling
  // or by a sticky bar reporting itself at the top of the viewport.
  return all.filter(r => !all.some(o => o !== r && r.contains(o)));
};
const itemsOf = row => [...row.querySelectorAll(FOCUSABLE)].filter(visible);
const centerX = el => { const r = el.getBoundingClientRect(); return r.left + r.width / 2; };
/** Where to land in [row] when arriving from [from]: a season menu's chosen season, else the item nearest across. */
const bestIn = (row, from) => {
  const cand = itemsOf(row), x = from ? centerX(from) : 0;
  return (row.classList.contains('seasonbar') && cand.find(el => el.classList.contains('on')))
    || cand.reduce((best, el) => Math.abs(centerX(el) - x) < Math.abs(centerX(best) - x) ? el : best, cand[0]);
};
/* Move the focus and put the page where a viewer expects it: a title row is shown with its heading
   under the top bar (so the category is always readable), anything else is just brought into view. */
const barHeight = () => document.querySelector('.bar')?.offsetHeight || 0;
const catsHeight = () => { const c = $('#cats'); return c && c.offsetHeight && getComputedStyle(c).position === 'sticky' ? c.offsetHeight : 0; };
function focusItem(el){
  if(!el) return;
  el.focus({preventScroll: true});
  const strip = el.closest('.strip, .chlist, #cats, .nav, .bar, .stabs');
  if(strip && strip.scrollWidth > strip.clientWidth + 4) el.scrollIntoView({block: 'nearest', inline: 'center'});
  if(el.closest('.bar')) return scrollTo(0, 0);
  const row = el.closest('.row');
  if(row){
    const want = Math.max(0, Math.round(row.getBoundingClientRect().top + scrollY - barHeight() - catsHeight() - 14));
    if(Math.abs(scrollY - want) > 4) scrollTo(0, want);
    return;
  }
  const r = el.getBoundingClientRect();
  if(r.top < barHeight() + 20 || r.bottom > innerHeight - 20) el.scrollIntoView({block: 'center'});
}
function tvMove(dir){
  const rows = tvRows();
  if(!rows.length) return false;
  const active = document.activeElement;
  let row = rows.find(r => r.contains(active));
  if(!row){ focusItem(itemsOf(rows[0])[0]); return true; }
  const items = itemsOf(row);
  const i = items.indexOf(active);
  // A side menu is a column: up/down pick an entry (and open it), left steps into what it
  // controls - #cats drives the page, .stabs the settings pane, .seasonbar the episode list.
  const pane = row.classList.contains('stabs') ? '#spane'
             : row.classList.contains('seasonbar') ? row.dataset.pane
             : (row.id === 'cats' && document.body.classList.contains('railed')) ? '#app' : null;
  if(pane){
    if(dir === 'up' || dir === 'down'){
      const n = items[i + (dir === 'down' ? 1 : -1)];
      if(n){
        n.click();                                  // moving down the menu opens that entry
        n.focus();                                  // click() alone doesn't reliably move focus;
        return true;                                // #cats additionally restores it after its rebuild
      }
      // the ends of a menu lead on to the row above or below it - never into what the menu itself controls
      const next = row.id === 'cats' ? null : rows[rows.indexOf(row) + (dir === 'down' ? 1 : -1)];
      if(next && !$(pane)?.contains(next)) focusItem(bestIn(next, active));
      return true;
    }
    if(dir === FWD()){                              // what the menu controls is on its far side
      const target = $(pane);
      const its = target ? itemsOf(target) : [];
      const first = its.find(el => el.classList.contains('on')) || its[0] || (target && tvRows().filter(r => target.contains(r)).flatMap(itemsOf)[0]);
      if(first) focusItem(first);
    }
    return true;
  }
  if(dir === 'left' || dir === 'right'){
    // ArrowLeft goes forward through a right-to-left row, ArrowRight through a left-to-right one
    const step = dir === FWD() ? 1 : -1;
    const next = items[i + step];
    if(next){ focusItem(next); return true; }
    if(dir !== FWD()){                              // back to the side menu, if there is one
      const tab = document.querySelector('.stabs button.on') || document.querySelector('.stabs button');
      if(tab && $('#spane')?.contains(active)) focusItem(tab);
      else if(document.body.classList.contains('railed') && $('#app').contains(active))
        focusItem($('#cats a.on') || $('#cats a'));
    }
    return true;                                    // stay put at the row's edge
  }
  // up / down: move within the row if it has more than one visual line (a grid, or a vertical
  // list); a row that is genuinely one line has nothing on another line, so this falls through to
  // moving to the next row below/above it, correctly, without needing to know which kind it is.
  const x = active ? centerX(active) : 0;
  const ar = active.getBoundingClientRect();
  const mid = el => { const r = el.getBoundingClientRect(); return r.top + r.height / 2; };
  // Another line = an item whose middle lies beyond this one's edge. (Comparing tops made the search box,
  // a little taller than the menu links beside it, look like the line below them.)
  const line = items.filter(el => (dir === 'down' ? mid(el) > ar.bottom : mid(el) < ar.top));
  if(line.length){
    const band = dir === 'down' ? Math.min(...line.map(mid)) : Math.max(...line.map(mid));
    const same = line.filter(el => Math.abs(mid(el) - band) < 6);
    focusItem(same.reduce((best, el) => Math.abs(centerX(el) - x) < Math.abs(centerX(best) - x) ? el : best));
    return true;
  }
  const railed = document.body.classList.contains('railed');
  const flow = rows.filter(r => r === row || !(railed && r.id === 'cats'));
  const ri = flow.indexOf(row);
  const next = flow[ri + (dir === 'down' ? 1 : -1)];
  if(!next) return true;
  focusItem(bestIn(next, active));
  return true;
}
let lastMoveAt = 0;
addEventListener('keydown', e => {
  if(!isTvLayout() || e.altKey || e.ctrlKey || e.metaKey) return;
  const dir = {ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right'}[e.key];
  if(!dir) return;
  const a = document.activeElement;
  if(a && (a.tagName === 'INPUT' && !a.readOnly || a.tagName === 'SELECT')) return;   // typing / picking
  e.preventDefault();
  const now = performance.now();                     // a held key repeats fast: keep one move per ~80ms
  if(now - lastMoveAt < 80) return;
  lastMoveAt = now;
  tvMove(dir);
}, true);

// Remote control (Android TV): text fields stay locked while focus passes over them, so the on-screen
// keyboard doesn't pop up; OK (Enter) unlocks the field and opens the keyboard.
function armInput(i){
  if(i.dataset.tvArmed) return;
  i.dataset.tvArmed = 1;
  // readOnly stops edits; inputmode="none" is what actually keeps the IME closed on boxes
  // whose keyboard still pops for a focused read-only field
  const lock = () => { if(isTvLayout()){ i.readOnly = true; i.inputMode = 'none'; } };
  const unlock = e => {
    if(!isTvLayout() || !i.readOnly) return;
    e?.preventDefault();
    i.readOnly = false;
    i.inputMode = '';
    i.focus();
    window.BoothAndroid?.showKeyboard?.();
  };
  lock();
  i.addEventListener('keydown', e => { if(e.key === 'Enter' && i.readOnly) unlock(e); });
  i.addEventListener('click', unlock);
  i.addEventListener('blur', lock);
}
const armInputs = root => root.querySelectorAll?.('input[type="search"], input.field:not([type="checkbox"]), #q').forEach(armInput);
armInputs(document);
new MutationObserver(muts => { for(const m of muts) for(const n of m.addedNodes) if(n.nodeType === 1) armInputs(n.matches('input') ? n.parentNode : n); })
  .observe(document.body, {childList: true, subtree: true});
// Back on the remote/phone: close an open panel or keyboard first (called by the app before going back).
window.boothBack = () => {
  const status = $('#tstatus');
  if(status && getComputedStyle(status).display !== 'none'){ $('#tstatusBtn').click(); return true; }
  const sheet = document.querySelector('.sheet');
  if(sheet){ sheet.remove(); return true; }
  const a = document.activeElement;
  if(a && a.tagName === 'INPUT' && !a.readOnly && isTvLayout()){ a.blur(); return true; }
  const up = parentHash();
  if(up === null) return false;                      // already at the top: the app closes
  goTo(up);
  return true;
};
/** One level up, by where you are - never back through everything you visited. */
function parentHash(){
  const r = (location.hash.split('/')[1] || '').split('?')[0];
  if(!r) return null;                                                  // home
  if(['r13', 'kan', 'mako'].includes(r)) return '#/tv';
  if(r === 'addons') return '#/settings';
  if(r === 'detail') return listHash;
  return '#/';
}
/** Go somewhere without growing the history: Back is our own ladder now. */
function goTo(hash){
  if(location.hash === hash) return route();
  history.replaceState(null, '', hash || '#/');
  route();
}
// Search key on the remote
window.boothSearchKey = () => { const q = $('#q'); q.focus(); q.readOnly = false; window.BoothAndroid?.showKeyboard?.(); };
// Remote control (Android TV): if nothing has focus after a page renders, focus its first item.
addEventListener('hashchange', () => setTimeout(tvFocus, 900));
function tvFocus(){
  if(settings.layout !== 'tv' || (document.activeElement && document.activeElement !== document.body)) return;
  document.querySelector('#app a[href], #app button, .nav a.on')?.focus();
}
setTimeout(tvFocus, 2500);
if(!location.hash && settings.start === 'live') history.replaceState(null, '', '#/live');
/* ---------- boot ---------- */
async function boot(){
  const ready = loadAddons();
  const first = await Promise.race([ready, new Promise(r => setTimeout(() => r('slow'), 6000))]);
  route();                                             // render now, with whatever has answered
  if(first === 'slow'){
    await ready;                                       // and when the add-ons finally arrive,
    if(['', '#/', '#'].includes(location.hash)) route();   // fill the home screen they left empty
  }
  setTimeout(loadServices, 3000);
  setTimeout(() => checkUpdate(true), 2500);
}
boot();
addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') checkUpdate(); });
</script>
<div id="tstatus" role="status" aria-live="polite" class="tstat">
  <span id="tstatusMsg"></span>
  <span class="tbar" id="tbar" hidden><i id="tbarFill"></i></span>
  <button id="tstatusBtn"></button>
</div>
<script>
// Torrent progress from the Android engine. Empty message hides the bar.
/** The engine reports JSON phases ("e:<code>" for a failure); the words, and the language, are the page's. */
function torrentText(raw, isError){
  if(!raw || raw[0] !== '{') return {msg: isError && /^e:\w+$/.test(raw || '') ? tr('tor.err.' + raw.slice(2)) : raw, frac: null};
  const o = JSON.parse(raw), mb = b => (b / 1048576).toFixed(1);
  if(o.p === 'dht') return {msg: tr('tor.dht', o), frac: null};
  if(o.p === 'meta') return {msg: tr('tor.meta'), frac: null};
  if(!o.peers) return {msg: tr('tor.peers'), frac: null};
  return {msg: `${tr('tor.buffer', {got: mb(o.got), need: mb(o.need)})} · ${tr('tor.stats', o)}`, frac: o.need ? Math.min(1, o.got / o.need) : null};
}
let tstatTimer = 0;
window.boothTorrentStatus = (raw, isError) => {
  const bar = document.getElementById('tstatus'), btn = document.getElementById('tstatusBtn');
  const {msg, frac} = torrentText(raw, isError);
  clearTimeout(tstatTimer);
  if(!msg){ bar.style.display = 'none'; delete bar.dataset.held; return; }
  const paint = () => {
    document.getElementById('tstatusMsg').textContent = msg;
    const track = document.getElementById('tbar');
    track.hidden = frac == null;
    if(frac != null) document.getElementById('tbarFill').style.width = (frac * 100).toFixed(0) + '%';
    bar.classList.toggle('bad', !!isError);
    btn.textContent = isError ? tr('common.close') : tr('common.cancel');
    btn.onclick = () => { if (!isError && window.BoothAndroid) BoothAndroid.cancelTorrent(); bar.style.display = 'none'; delete bar.dataset.held; tvFocus(); };
  };
  const show = () => { paint(); bar.style.display = 'flex'; if(!bar.dataset.held || isError){ btn.focus(); bar.dataset.held = 1; } };
  // a wait shorter than a second needs no announcement; a failure always does
  if(bar.style.display === 'flex' || isError) show(); else tstatTimer = setTimeout(show, 900);
};
</script>
