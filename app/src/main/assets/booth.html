<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=Rubik:wght@500;700;800&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"></script>
<script>
// Apply saved skin/layout before first paint (Settings page). TV devices default to the TV layout.
try{
  const s = JSON.parse(localStorage.getItem('booth:settings') || '{}'), r = document.documentElement;
  const tv = !!(window.BoothAndroid && BoothAndroid.isTv && BoothAndroid.isTv());
  r.dataset.skin = s.skin || 'tungsten'; r.dataset.layout = s.layout || (tv ? 'tv' : 'cinema'); r.dataset.poster = s.poster || 'm';
}catch(e){}
</script>
<style>
:root{
  --night:#14161f; --surface:#1d2130; --raise:#272c3f; --line:#323850;
  --light:#efe6cf; --muted:#8e93a8; --tungsten:#f0b429; --velvet:#a3384b;
  --on-accent:#14161f; --text2:#d4cdb9; --err:#ff9d8a; --ghost:rgba(239,230,207,.1);
  --shade-55:rgba(20,22,31,.55); --shade-50:rgba(20,22,31,.5); --shade-20:rgba(20,22,31,.2);
  --glow:rgba(240,180,41,.45); --glow-soft:rgba(240,180,41,.35); --beam:rgba(240,180,41,.13);
  --poster-w:150px;
  --display:"Bricolage Grotesque","Rubik",system-ui,sans-serif;
  --body:"Figtree","Heebo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--light);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tungsten);outline-offset:2px}
img{max-width:100%;display:block}

/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:14px 28px;background:linear-gradient(var(--night) 60%,transparent)}
.logo{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo i{width:14px;height:14px;border-radius:50%;background:var(--tungsten);box-shadow:0 0 18px 4px var(--glow)}
.nav{display:flex;gap:4px}
.nav a{text-decoration:none;padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:500}
.nav a.on{color:var(--night);background:var(--light)}
.search{margin-inline-start:auto;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 16px 4px 4px;width:min(340px,40vw)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.search button{background:var(--tungsten);color:var(--on-accent);border:0;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}

main{padding:0 28px 60px}

/* hero: projector beam */
.hero{position:relative;margin:0 -28px 36px;min-height:62vh;display:flex;align-items:flex-end;overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 25%;filter:saturate(.85)}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:
  linear-gradient(270deg,var(--night) 8%,var(--shade-55) 45%,transparent 75%),
  linear-gradient(0deg,var(--night) 2%,transparent 45%)}
.hero .beam{position:absolute;z-index:1;left:-10%;transform:scaleX(-1);top:-30%;width:70%;height:160%;background:conic-gradient(from 200deg at 100% 0%,transparent 0deg,var(--beam) 14deg,transparent 30deg);pointer-events:none}
.hero .copy{position:relative;z-index:2;padding:0 28px 48px;max-width:760px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,8vw,104px);line-height:.9;letter-spacing:-.035em;margin:0 0 16px}
.hero p{color:var(--text2);max-width:56ch;margin:0 0 22px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 22px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--tungsten);color:var(--on-accent)}
.btn.ghost{background:var(--ghost);color:var(--light)}
.btn.ghost.saved{background:var(--velvet)}

/* rows and posters */
.row{margin-bottom:34px}
.row h2,.page h1{font-family:var(--display);font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
.row h2{font-size:22px}
.row h2 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-inline-start:8px}
.strip{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{height:6px}.strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--poster-w),1fr));gap:22px 16px}
.poster{flex:0 0 var(--poster-w);scroll-snap-align:start;text-decoration:none;display:block}
.poster .art{aspect-ratio:2/3;border-radius:6px;background:var(--surface) center/cover;position:relative;overflow:hidden;transition:transform .2s}
.poster:hover .art,.poster:focus-visible .art{transform:translateY(-4px);box-shadow:0 10px 28px -8px var(--glow-soft)}
.poster .t{margin-top:8px;font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poster .y{color:var(--muted);font-size:13px}
.poster .prog{position:absolute;inset-inline-start:0;bottom:0;height:4px;background:var(--tungsten)}
.noart{display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-family:var(--display);color:var(--muted)}

/* page filters */
.page{padding-top:12px}
.page h1{font-size:40px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}
.filters select,.field{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.more{margin:28px auto 0;display:block}

/* detail */
.detail{display:grid;grid-template-columns:260px 1fr;gap:40px;position:relative;z-index:2;margin-top:-30vh;padding-top:12px}
.detail .poster-lg{border-radius:8px;aspect-ratio:2/3;background:var(--surface) center/cover;box-shadow:0 20px 50px -10px #000}
.detail h1{font-family:var(--display);font-weight:800;font-size:clamp(36px,5vw,64px);line-height:.95;letter-spacing:-.03em;margin:0 0 12px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.facts span{background:var(--raise);border-radius:4px;padding:3px 9px;font-size:13px;color:var(--text2)}
.facts .imdb{background:var(--tungsten);color:var(--on-accent);font-weight:700}
.desc{max-width:68ch;color:var(--text2)}
.people{color:var(--muted);font-size:14px;margin:12px 0 22px;max-width:68ch}
.people b{color:var(--light);font-weight:500}
.backdrop{height:62vh;margin:0 -28px;background-size:cover;background-position:center 20%;position:relative}
.backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--night) 12%,var(--shade-50) 60%,var(--shade-20))}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-top:28px}
.panel{background:var(--surface);border-radius:10px;padding:18px}
.panel h3{margin:0 0 12px;font-family:var(--display);font-size:19px}
.eps{max-height:520px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.ep{display:grid;grid-template-columns:34px 1fr;gap:10px;text-align:start;background:none;border:0;border-radius:6px;padding:8px;cursor:pointer}
.ep:hover{background:var(--raise)} .ep.on{background:var(--raise);box-shadow:inset -3px 0 var(--tungsten)}
.ep .n{font-family:var(--display);font-weight:700;color:var(--tungsten)}
.ep .d{font-size:12px;color:var(--muted)}

/* streams: grouped by quality, with filters */
.panel,#streams{min-width:0}
.sfilter{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--tungsten);border-color:var(--tungsten);color:var(--on-accent);font-weight:600}
.chip .c{margin-left:6px;opacity:.7;font-variant-numeric:tabular-nums}
.sfilter select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.sfsum{font-size:13px;margin:0 0 10px}
.qgroup{background:var(--raise);border-radius:10px;margin-bottom:8px;overflow:hidden}
.qgroup>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.qgroup>summary::-webkit-details-marker{display:none}
.qgroup>summary::before{content:"◂";color:var(--muted);transition:transform .15s}
.qgroup[open]>summary::before{transform:rotate(-90deg)}
.qname{font-family:var(--display);font-weight:700;font-size:16px;min-width:52px}
.qmeta{flex:1;min-width:0;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.qbest{flex:none;border:0;border-radius:999px;background:var(--tungsten);color:var(--on-accent);font-weight:600;font-size:13px;padding:6px 12px;cursor:pointer}
.srow{display:flex;gap:12px;width:100%;text-align:start;border:0;border-top:1px solid var(--line);background:none;color:var(--light);padding:10px 14px;cursor:pointer}
.srow:hover,.srow:focus-visible{background:var(--surface)}
.srow .seeds{flex:0 0 64px;font-size:13px;font-weight:600;color:var(--tungsten);font-variant-numeric:tabular-nums}
.srow .info{display:flex;flex-direction:column;min-width:0;gap:2px}
.srow .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .m{font-size:12px;color:var(--muted)}
.smore{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--tungsten);font-size:13px;font-weight:600;padding:10px;cursor:pointer}
.note{color:var(--muted);font-size:14px}
.err{color:var(--err);font-size:14px}

/* addons */
.addon{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;background:var(--surface);border-radius:10px;padding:14px;margin-bottom:10px;max-width:820px}
.addon img,.addon .ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--raise)}
.addon h3{margin:0;font-size:16px}
.addon p{margin:2px 0 0;color:var(--muted);font-size:13px}
.add{display:flex;gap:10px;max-width:820px;margin:0 0 24px}
.add input{flex:1}
.danger{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--muted)}

/* player */
.player{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column}
.player.open{display:flex}
.player header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#000}
.player header b{font-family:var(--display);font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player video,.player iframe{flex:1;width:100%;border:0;background:#000;min-height:0}

/* ---------- skins (Settings) ---------- */
:root[data-skin="midnight"]{--night:#000;--surface:#0e1116;--raise:#171b22;--line:#262c36;--light:#e8eef5;--muted:#7f8a98;--tungsten:#3dd6d0;--velvet:#e0457b;
  --on-accent:#001614;--text2:#c3ccd6;--shade-55:rgba(0,0,0,.55);--shade-50:rgba(0,0,0,.5);--shade-20:rgba(0,0,0,.2);
  --glow:rgba(61,214,208,.45);--glow-soft:rgba(61,214,208,.35);--beam:rgba(61,214,208,.12);--ghost:rgba(232,238,245,.1)}
:root[data-skin="velvet"]{--night:#1a0f14;--surface:#26161d;--raise:#331e27;--line:#4a2c38;--light:#f6e7dc;--muted:#ab929b;--tungsten:#e8b86b;--velvet:#c2415d;
  --on-accent:#1a0f14;--text2:#dfc9bd;--shade-55:rgba(26,15,20,.55);--shade-50:rgba(26,15,20,.5);--shade-20:rgba(26,15,20,.2);
  --glow:rgba(232,184,107,.45);--glow-soft:rgba(232,184,107,.35);--beam:rgba(232,184,107,.13);--ghost:rgba(246,231,220,.1)}
:root[data-skin="forest"]{--night:#0f1a15;--surface:#16241d;--raise:#1e3027;--line:#2d4438;--light:#e6efe4;--muted:#8ba494;--tungsten:#9be15d;--velvet:#d9643a;
  --on-accent:#0f1a15;--text2:#c9d8c8;--shade-55:rgba(15,26,21,.55);--shade-50:rgba(15,26,21,.5);--shade-20:rgba(15,26,21,.2);
  --glow:rgba(155,225,93,.4);--glow-soft:rgba(155,225,93,.3);--beam:rgba(155,225,93,.1);--ghost:rgba(230,239,228,.1)}
:root[data-skin="daylight"]{--night:#f4efe6;--surface:#fffaf2;--raise:#ebe3d5;--line:#d8cebd;--light:#1d1a16;--muted:#6b6358;--tungsten:#c8412d;--velvet:#8a2432;
  --on-accent:#fff;--text2:#3d372f;--err:#b3261e;--shade-55:rgba(244,239,230,.55);--shade-50:rgba(244,239,230,.5);--shade-20:rgba(244,239,230,.2);
  --glow:rgba(200,65,45,.3);--glow-soft:rgba(200,65,45,.25);--beam:rgba(200,65,45,.07);--ghost:rgba(29,26,22,.08)}

/* ---------- layouts (Settings) ---------- */
:root[data-poster="s"]{--poster-w:118px}
:root[data-poster="l"]{--poster-w:196px}
/* Poster wall: no banner, every row wraps into a grid */
[data-layout="grid"] .hero{display:none}
[data-layout="grid"] main{padding-top:8px}
[data-layout="grid"] .strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--poster-w),1fr));gap:22px 16px;overflow:visible}
/* List: compact rows with small art, title and year */
[data-layout="list"] .hero{display:none}
[data-layout="list"] main{padding-top:8px}
[data-layout="list"] .strip,[data-layout="list"] .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px 16px;overflow:visible}
[data-layout="list"] .poster{display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto 1fr;column-gap:12px;padding:8px;border-radius:8px;background:var(--surface)}
[data-layout="list"] .poster .art{grid-row:1 / span 2;width:52px}
[data-layout="list"] .poster .t{margin-top:2px}
[data-layout="list"] .poster:hover .art,[data-layout="list"] .poster:focus-visible .art{transform:none;box-shadow:none}
[data-layout="list"] .poster:hover,[data-layout="list"] .poster:focus-visible{background:var(--raise)}
/* TV: 10-foot UI - larger type, posters and focus for a remote */
[data-layout="tv"] body{font-size:18px}
[data-layout="tv"] .poster{flex-basis:calc(var(--poster-w) * 1.35)}
[data-layout="tv"] .grid{grid-template-columns:repeat(auto-fill,minmax(calc(var(--poster-w) * 1.35),1fr))}
[data-layout="tv"] .strip{gap:24px;padding:8px 6px 18px}
[data-layout="tv"] .row h2{font-size:28px}
[data-layout="tv"] .nav a{padding:10px 20px;font-size:18px}
[data-layout="tv"] :focus-visible{outline-width:4px;outline-offset:4px}
[data-layout="tv"] .poster:focus .art,[data-layout="tv"] .poster:focus-visible .art{transform:scale(1.06);box-shadow:0 0 0 4px var(--tungsten),0 16px 40px -10px var(--glow-soft)}
[data-layout="tv"] .poster:focus-visible{outline:none}

/* settings page */
.sset{margin:0 0 32px;max-width:1000px}
.sset h2{font-family:var(--display);font-size:20px;font-weight:700;margin:0 0 12px}
.sopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.setopt{display:flex;flex-direction:column;gap:6px;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;color:var(--light)}
.setopt:hover{border-color:var(--muted)}
.setopt.on{border-color:var(--tungsten);box-shadow:0 0 0 1px var(--tungsten)}
.setopt .sn{font-weight:600;display:flex;align-items:center;gap:6px}
.setopt.on .sn::after{content:"✓";color:var(--tungsten)}
.setopt .sd{font-size:12px;color:var(--muted);line-height:1.35}
.swatch{display:flex;align-items:flex-end;gap:5px;height:72px;border-radius:7px;padding:9px;border:1px solid var(--line)}
.swatch i{width:18px;height:18px;border-radius:50%}
.swatch b{margin-inline-start:auto;font-family:var(--display);font-size:24px;line-height:1}
.lprev{display:flex;flex-direction:column;gap:4px;height:72px;padding:6px;border-radius:7px;background:var(--night);border:1px solid var(--line)}
.lprev .b{height:22px;flex:none;border-radius:3px;background:var(--raise)}
.lprev .r{display:flex;gap:4px;flex:1}
.lprev .r i{flex:1;border-radius:2px;background:var(--tungsten);opacity:.5}
.lprev .r.big i{opacity:.8}
.lprev .l{display:flex;gap:6px;align-items:center;flex:1}
.lprev .l i{width:11px;align-self:stretch;border-radius:2px;background:var(--tungsten);opacity:.5}
.lprev .l em{flex:1;height:5px;border-radius:3px;background:var(--muted);opacity:.55}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 18px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--tungsten);color:var(--on-accent)}

.cats{position:sticky;top:64px;z-index:15;display:flex;gap:8px;overflow-x:auto;padding:4px 28px 12px;background:linear-gradient(var(--night) 75%,transparent);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats[hidden]{display:none}
.cats a{flex:none;text-decoration:none;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:14px;font-weight:600;white-space:nowrap}
.cats a:hover{color:var(--light)}
.cats a.on{background:var(--tungsten);border-color:var(--tungsten);color:var(--on-accent)}
[data-layout="tv"] .cats a{padding:10px 20px;font-size:17px}

/* live tv */
.ltabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.ltools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
.ltools .field{min-width:220px}
.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.chan{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--light);cursor:pointer;text-align:center}
.chan:hover,.chan:focus-visible{background:var(--raise);border-color:var(--tungsten)}
.chan .logo{width:100%;height:64px;display:flex;align-items:center;justify-content:center}
.chan .logo img{max-height:64px;max-width:90%;object-fit:contain}
.chan .logo span{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--raise);font-family:var(--display);font-weight:700;font-size:20px;color:var(--tungsten)}
.chan b{font-size:14px;line-height:1.25}
.chan small{font-size:12px;color:var(--muted)}
[data-layout="tv"] .channels{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.addpl{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;max-width:900px;margin:8px 0 6px}
.hint{font-size:13px;color:var(--muted);max-width:900px;margin:0 0 24px}
.hint code{background:var(--raise);padding:1px 6px;border-radius:4px;font-size:12px}
@media (max-width:760px){.cats{top:104px;padding:4px 16px 10px}.addpl{grid-template-columns:1fr}}

/* Hebrew metadata */
.desc[dir="rtl"]{font-size:16px;line-height:1.7}
.desc .src{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.desc .src a{color:var(--muted)}
.readmore{background:none;border:0;color:var(--tungsten);font-weight:600;cursor:pointer;padding:0 4px}
.orig{display:block;font-family:var(--body);font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:6px}

.skel{background:linear-gradient(90deg,var(--surface),var(--raise),var(--surface));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.nav a{white-space:nowrap}
@media (max-width:1000px){.bar{flex-wrap:wrap}.search{width:100%;order:3;margin-inline-start:0}}
@media (max-width:760px){
  .bar{flex-wrap:wrap;padding:12px 16px}.search{width:100%;order:3}
  main{padding:0 16px 50px}.hero,.backdrop{margin:0 -16px 28px}
  .detail{grid-template-columns:1fr;margin-top:-22vh}.detail .poster-lg{width:150px}
  .cols{grid-template-columns:1fr}.poster{flex-basis:calc(var(--poster-w) * .8)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(calc(var(--poster-w) * .8),1fr))}
  .nav{overflow-x:auto;max-width:100%}.nav a{padding:6px 11px;white-space:nowrap}
}
</style>
</head>
<body><div style="position:fixed;right:8px;bottom:6px;z-index:9999;font:10px monospace;color:#8d887d;opacity:.65">Booth Android v0.10.1</div>
<div class="bar">
  <a class="logo" href="#/"><i></i>Booth</a>
  <nav class="nav">
    <a href="#/" data-r="home">בית</a>
    <a href="#/discover/movie" data-r="discover">גלה</a>
    <a href="#/library" data-r="library">הספרייה</a>
    <a href="#/addons" data-r="addons">תוספים</a>
    <a href="#/settings" data-r="settings">הגדרות</a>
  </nav>
  <form class="search" id="sf"><input id="q" placeholder="חיפוש סרטים וסדרות" aria-label="חיפוש"><button>חפש</button></form>

<div class="player" id="player">

  <div id="pbody" style="flex:1;display:flex;min-height:0"></div>
</div>

<script>
/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('booth:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('booth:'+k, JSON.stringify(v)); }catch(e){} }
};
const CINEMETA = 'https://v3-cinemeta.strem.io/manifest.json';
const TORRENTIO = 'https://torrentio.strem.fun/manifest.json';
// Netflix, Apple TV+, Disney+, Prime, HBO Max, Paramount+, Curiosity Stream, MagellanTV (Israel region).
const STREAMING_CATALOGS = 'https://7a82163c306e-stremio-netflix-catalog-addon.baby-beamup.club/bmZ4LGF0cCxkbnAsYW1wLGhibSxwbXAsY3RzLG1nbDo6SUw6MTc4OTg0MTUwODAwMDoxOjA6/manifest.json';
// Israeli (Hebrew) and Arabic films & series, built weekly from Wikidata (see tools/build_catalogs.py).
const BOOTH_CATALOGS = 'https://raw.githubusercontent.com/bardalas/MyStreamer1/main/addon/manifest.json';
let addonUrls = store.get('addons', [CINEMETA, TORRENTIO, STREAMING_CATALOGS, BOOTH_CATALOGS]);
if(store.get('defaultsRev', 1) < 2){
  for(const u of [STREAMING_CATALOGS, BOOTH_CATALOGS]) if(!addonUrls.includes(u)) addonUrls.push(u);
  store.set('addons', addonUrls); store.set('defaultsRev', 2);
}
let library = store.get('library', {});
let progress = store.get('progress', {});
let addons = [];   // {url, base, manifest}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normUrl = u => u.trim().replace(/^stremio:\/\//, 'https://');
const baseOf = u => normUrl(u).replace(/\/manifest\.json(\?.*)?$/, '');
async function getJSON(url){
  const r = await fetch(url);
  if(!r.ok) throw new Error(r.status + ' from ' + new URL(url).host);
  return r.json();
}
function supports(m, resource, type, id){
  for(const r of m.resources || []){
    const name = typeof r === 'string' ? r : r.name;
    if(name !== resource) continue;
    const types = (typeof r === 'object' && r.types) || m.types || [];
    const pref = (typeof r === 'object' && r.idPrefixes) || m.idPrefixes;
    if(type && !types.includes(type)) continue;
    if(id && pref && pref.length && !pref.some(p => id.startsWith(p))) continue;
    return true;
  }
  return false;
}
const yearOf = m => m.releaseInfo || (m.year ?? '') || (m.released ? m.released.slice(0,4) : '');

async function loadAddons(){
  const res = await Promise.allSettled(addonUrls.map(async url => ({url, base: baseOf(url), manifest: await getJSON(normUrl(url))})));
  addons = res.filter(r => r.status === 'fulfilled').map(r => r.value);
}

/* ---------- Hebrew titles & plots ----------
   Titles: a map precomputed daily on GitHub (addon/he.json, see tools/build_catalogs.py) for every
   catalog title; anything missing is looked up on Wikidata in small batches and cached.
   Plots: the "עלילה" section of the title's Hebrew Wikipedia article. */
const WDQS = 'https://query.wikidata.org/sparql?format=json&query=';
const HE_TITLES = 'https://raw.githubusercontent.com/bardalas/MyStreamer1/main/addon/he.json';
const WDAPI = 'https://www.wikidata.org/w/api.php?format=json&origin=*&';
let heCache = store.get('heMeta', {});             // tt -> {t: Hebrew title, w: hewiki article}
const hePending = new Set();
let heTimer = null, heBusy = false;
let heReady = Promise.resolve();                     // resolves once the precomputed map is loaded
const hebrewOn = () => (typeof settings === 'undefined' || settings.lang !== 'en');
const hasHebrew = s => /[\u0590-\u05FF]/.test(s || '');
// Wikidata labels sometimes carry a disambiguator: "אובססיה (סרט, 2025)" -> "אובססיה".
const heClean = t => (t || '').replace(/\s*\((?:סרט|סדרה|סדרת|מיני-סדרה|מיני סדרה|תוכנית|סרטון)[^)]*\)\s*$/, '').trim();
const heTitle = (id, fallback) => (hebrewOn() && heCache[id]?.t) || fallback;
for(const e of Object.values(heCache)) if(e?.t) e.t = heClean(e.t);   // titles cached by 0.9/0.10 weren't cleaned

/** Queue ids for a Hebrew title lookup; lookups are batched and the page updated in place. */
function hebrewize(ids){
  if(!hebrewOn()) return;
  for(const id of ids) if(/^tt\d+$/.test(id) && !(id in heCache)) hePending.add(id);
  if(hePending.size){ clearTimeout(heTimer); heTimer = setTimeout(heFlush, 300); }
}
async function heLookup(ids){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 20000);
  const q = `SELECT ?imdb ?he ?wp WHERE { VALUES ?imdb { ${ids.map(i => `"${i}"`).join(' ')} } ?item wdt:P345 ?imdb.
    OPTIONAL { ?item rdfs:label ?he FILTER(LANG(?he) = "he") }
    OPTIONAL { ?wp schema:about ?item; schema:isPartOf <https://he.wikipedia.org/> } }`;
  const r = await fetch(WDQS + encodeURIComponent(q), {signal: ctl.signal}).finally(() => clearTimeout(timer));
  if(!r.ok) throw new Error(r.status);
  const d = await r.json();
  for(const id of ids) heCache[id] ||= {t: '', w: ''};
  for(const b of d.results.bindings){
    const e = heCache[b.imdb.value];
    if(b.he) e.t ||= heClean(b.he.value);
    if(b.wp) e.w ||= decodeURIComponent(b.wp.value.split('/wiki/')[1] || '');
  }
  store.set('heMeta', heCache);
}
async function heFlush(){
  if(heBusy || !hePending.size) return;
  heBusy = true;
  await heReady;
  for(const id of [...hePending]) if(id in heCache) hePending.delete(id);
  if(!hePending.size){ heBusy = false; return; }
  const batch = [...hePending].slice(0, 50);
  batch.forEach(id => hePending.delete(id));
  try{
    await heLookup(batch);
    for(const id of batch){
      const t = heCache[id]?.t; if(!t) continue;
      document.querySelectorAll(`[data-heid="${id}"]`).forEach(el => { el.textContent = t; el.dir = 'rtl'; });
    }
  }catch(e){ /* rate-limited or offline: these ids are retried when shown again */ }
  heBusy = false;
  if(hePending.size) heTimer = setTimeout(heFlush, 2500);   // Wikidata rate-limits bursts
}

function applyHebrew(){
  document.querySelectorAll('[data-heid]').forEach(el => {
    const t = heCache[el.dataset.heid]?.t;
    if(t && el.textContent !== t){ el.textContent = t; el.dir = 'rtl'; }
  });
}

/** Precomputed Hebrew titles (refreshed daily); ids in it are never looked up from the phone. */
async function loadHebrewTitles(){
  if(!hebrewOn()) return;
  try{
    const d = await getJSON(HE_TITLES);
    for(const [id, v] of Object.entries(d)) heCache[id] = v ? {t: heClean(v[0]), w: v[1] || ''} : {t: '', w: ''};
    for(const id of [...hePending]) if(id in heCache) hePending.delete(id);
    store.set('heMeta', heCache);
    applyHebrew();
  }catch(e){ /* offline: keep the cached copy */ }
}

/** Fast single-title lookup through the Wikidata API (used by the details page). */
async function heLookupOne(id){
  const s = await getJSON(`${WDAPI}action=query&list=search&srsearch=haswbstatement:P345=${id}&srlimit=1`);
  const q = s.query?.search?.[0]?.title;
  heCache[id] = {t: '', w: ''};
  if(q){
    const e = (await getJSON(`${WDAPI}action=wbgetentities&ids=${q}&props=labels|sitelinks&languages=he&sitefilter=hewiki`)).entities?.[q];
    heCache[id] = {t: heClean(e?.labels?.he?.value), w: (e?.sitelinks?.hewiki?.title || '').replace(/ /g, '_')};
  }
  store.set('heMeta', heCache);
}

const plotCache = {};
/** Hebrew plot for an IMDb id from Hebrew Wikipedia: the plot section, else the lead. */
async function hebrewPlot(id){
  if(id in plotCache) return plotCache[id];
  if(!(id in heCache)) await heLookupOne(id);
  const article = heCache[id]?.w;
  if(!article) return plotCache[id] = null;
  const d = await getJSON(`https://he.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exsectionformat=wiki&redirects=1&format=json&origin=*&titles=${encodeURIComponent(article)}`);
  const text = Object.values(d.query.pages)[0]?.extract || '';
  const plot = text.match(/^==\s*(?:עלילה|עלילת הסרט|עלילת הסדרה|תקציר העלילה|תקציר הסדרה|תקציר|תקציר עלילה)\s*==\s*$([\s\S]*?)(?=^==[^=]|$(?![\s\S]))/m);
  const body = (plot ? plot[1] : text.split(/^==/m)[0]).replace(/^===.*===$/gm, '').replace(/\n{2,}/g, '\n').trim();
  return plotCache[id] = body ? {text: body, article} : null;
}

/** Hebrew search: Wikidata full-text search, keeping films and series that have an IMDb id. */
async function hebrewSearch(q){
  const s = await getJSON(`https://www.wikidata.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(q + ' haswbstatement:P345')}&srlimit=30&format=json&origin=*`);
  const qids = (s.query?.search || []).map(r => r.title).filter(t => /^Q\d+$/.test(t));
  if(!qids.length) return [];
  const sp = `SELECT ?item ?imdb ?he ?en ?date ?series WHERE { VALUES ?item { ${qids.map(x => 'wd:' + x).join(' ')} } ?item wdt:P345 ?imdb.
    { ?item wdt:P31/wdt:P279* wd:Q11424 } UNION { ?item wdt:P31/wdt:P279* wd:Q5398426 BIND(true AS ?series) }
    OPTIONAL { ?item rdfs:label ?he FILTER(LANG(?he) = "he") } OPTIONAL { ?item rdfs:label ?en FILTER(LANG(?en) = "en") }
    OPTIONAL { ?item wdt:P577 ?date } }`;
  const rows = (await getJSON(WDQS + encodeURIComponent(sp))).results.bindings;
  const byItem = new Map();
  for(const b of rows){
    const id = b.imdb.value; if(!id.startsWith('tt')) continue;
    const m = byItem.get(b.item.value) || {id, type: 'movie', name: '', poster: `https://images.metahub.space/poster/medium/${id}/img`};
    if(b.series) m.type = 'series';
    m.name ||= b.he?.value || b.en?.value || id;
    const y = b.date?.value.slice(0, 4); if(y && (!m.releaseInfo || y < m.releaseInfo)) m.releaseInfo = y;
    byItem.set(b.item.value, m);
  }
  return qids.map(q => byItem.get('http://www.wikidata.org/entity/' + q)).filter(Boolean);
}

/* ---------- Hebrew labels for add-on data ---------- */
const GENRES_HE = {Action: 'אקשן', Adventure: 'הרפתקאות', Animation: 'אנימציה', Anime: 'אנימה', Biography: 'ביוגרפיה',
  Comedy: 'קומדיה', Crime: 'פשע', Documentary: 'תיעודי', Drama: 'דרמה', Family: 'משפחה', Fantasy: 'פנטזיה',
  'Film-Noir': 'פילם נואר', 'Game-Show': 'שעשועון', History: 'היסטוריה', Horror: 'אימה', Kids: 'ילדים',
  Music: 'מוזיקה', Musical: 'מחזמר', Mystery: 'מסתורין', News: 'חדשות', 'Reality-TV': 'ריאליטי', Reality: 'ריאליטי',
  Romance: 'רומנטיקה', 'Sci-Fi': 'מדע בדיוני', 'Science Fiction': 'מדע בדיוני', Short: 'סרט קצר', Sport: 'ספורט',
  'Talk-Show': 'תוכנית אירוח', Thriller: 'מותחן', War: 'מלחמה', Western: 'מערבון', 'TV Movie': 'סרט טלוויזיה'};
const genreHe = g => GENRES_HE[g] || g;
const typeHe = t => ({movie: 'סרטים', series: 'סדרות', channel: 'ערוצים', tv: 'טלוויזיה'}[t] || t);
const CATALOG_NAMES_HE = {Popular: 'פופולרי', New: 'חדש', Featured: 'מומלצים',
  'Netflix Top 10 Movies (Global)': 'Netflix – טופ 10', 'Netflix Top 10 Shows (Global)': 'Netflix – טופ 10',
  'Popular documentaries': 'תיעודיים פופולריים', 'Israeli films': 'סרטים ישראליים', 'New Israeli films': 'סרטים ישראליים חדשים',
  'Israeli series': 'סדרות ישראליות', 'Arabic films': 'סרטים בערבית', 'New Arabic films': 'סרטים חדשים בערבית', 'Arabic series': 'סדרות בערבית'};
const catalogHe = n => CATALOG_NAMES_HE[n] || n;

/* ---------- cards ---------- */
function card(m){
  const p = Object.values(progress).find(x => x.metaId === m.id);
  const pct = p && p.d ? Math.min(100, p.t / p.d * 100) : 0;
  const art = m.poster
    ? `<div class="art" style="background-image:url('${esc(m.poster)}')">${pct?`<div class="prog" style="width:${pct}%"></div>`:''}</div>`
    : `<div class="art noart">${esc(m.name)}</div>`;
  hebrewize([m.id]);
  const name = heTitle(m.id, m.name);
  return `<a class="poster" href="#/detail/${esc(m.type)}/${encodeURIComponent(m.id)}">${art}<div class="t" data-heid="${esc(m.id)}" dir="${hasHebrew(name) ? 'rtl' : 'auto'}">${esc(name)}</div><div class="y">${esc(yearOf(m))}</div></a>`;
}
const skeletons = n => Array.from({length:n}, () => `<div class="poster"><div class="art skel"></div></div>`).join('');

/* ---------- views ---------- */
/* ---------- categories ---------- */
const SC_ID = 'pw.ers.netflix-catalog', BOOTH_ID = 'org.booth.catalogs', CINEMETA_ID = 'com.linvo.cinemeta';
// rows: [add-on id, catalog id (or pattern), extra args, title override]
const CATEGORIES = [
  {id: 'netflix', name: 'Netflix', rows: [[SC_ID, /^netflix-top10/], [SC_ID, 'nfx']]},
  {id: 'apple', name: 'Apple TV+', rows: [[SC_ID, 'atp']]},
  {id: 'disney', name: 'Disney+', rows: [[SC_ID, 'dnp']]},
  {id: 'prime', name: 'Prime Video', rows: [[SC_ID, 'amp']]},
  {id: 'hbo', name: 'HBO Max', rows: [[SC_ID, 'hbm']]},
  {id: 'paramount', name: 'Paramount+', rows: [[SC_ID, 'pmp']]},
  {id: 'docs', name: 'תיעודי', rows: [[SC_ID, 'cts'], [SC_ID, 'mgl'], [CINEMETA_ID, 'top', 'genre=Documentary', 'תיעודיים פופולריים']]},
  {id: 'israeli', name: 'ישראלי', rows: [[BOOTH_ID, /^booth\.he\./]]},
  {id: 'arabic', name: 'ערבית', rows: [[BOOTH_ID, /^booth\.ar\./]]},
];

/** Resolve a category's row specs against the installed add-ons. */
function rowsFor(cat){
  const out = [];
  for(const [aid, cid, extra, title] of cat.rows){
    const a = addons.find(x => x.manifest.id === aid);
    if(!a) continue;
    for(const c of a.manifest.catalogs || [])
      if(cid instanceof RegExp ? cid.test(c.id) : c.id === cid) out.push({a, c, extra, title: title || catalogHe(c.name)});
  }
  return out;
}

function renderCats(active){
  const nav = $('#cats');
  nav.hidden = active == null;
  if(active == null) return;
  const avail = CATEGORIES.filter(c => rowsFor(c).length);
  nav.innerHTML = [`<a href="#/" class="${active === 'home' ? 'on' : ''}">הכל</a>`,
    ...avail.map(c => `<a href="#/cat/${c.id}" class="${active === c.id ? 'on' : ''}"><bdi>${esc(c.name)}</bdi></a>`),
    `<a href="#/live" class="${active === 'live' ? 'on' : ''}">📺 שידור חי</a>`].join('');
  nav.querySelector('.on')?.scrollIntoView({inline: 'center', block: 'nearest'});
}

/** Hero + "continue watching" + a row per catalog; rows load in parallel. */
function renderRows(rows, {hero = true, cont = []} = {}){
  const app = $('#app');
  app.innerHTML = `${hero ? `<section class="hero" id="hero"><div class="bg skel"></div><div class="beam"></div><div class="copy"><h1>&nbsp;</h1></div></section>` : '<div style="height:8px"></div>'}
    ${cont.length ? `<div class="row"><h2>המשך צפייה</h2><div class="strip">${cont.map(x => card({id:x.metaId,type:x.type,name:x.name,poster:x.poster})).join('')}</div></div>` : ''}
    ${rows.map((x, i) => `<div class="row"><h2><bdi>${esc(x.title)}</bdi> <small>${esc(typeHe(x.c.type))}</small></h2><div class="strip" id="row${i}">${skeletons(8)}</div></div>`).join('')}
    ${!rows.length ? `<p class="note">אין עדיין קטלוגים. התקן תוסף עם קטלוגים בעמוד <a href="#/addons">התוספים</a>.</p>` : ''}`;
  let heroDone = !hero;
  rows.forEach(async (x, i) => {
    const el = $('#row' + i);
    try{
      const d = await getJSON(`${x.a.base}/catalog/${x.c.type}/${x.c.id}${x.extra ? '/' + x.extra : ''}.json`);
      const metas = d.metas || [];
      if(el) el.innerHTML = metas.map(card).join('') || '<p class="note">הקטלוג ריק.</p>';
      if(!heroDone && metas.length){ heroDone = true; renderHero(metas.find(m => m.background) || metas[0]); }
    }catch(e){ if(el) el.innerHTML = `<p class="err">לא ניתן לטעון את הקטלוג (${esc(e.message)}).</p>`; }
  });
}

async function viewHome(){
  renderCats('home');
  // Cinemeta's popular rows, then the first row of every category.
  const cm = addons.find(a => a.manifest.id === CINEMETA_ID);
  const rows = cm ? (cm.manifest.catalogs || []).filter(c => c.id === 'top').map(c => ({a: cm, c, title: 'פופולרי'})) : [];
  for(const cat of CATEGORIES){
    const r = rowsFor(cat);
    if(r.length) rows.push(...r.slice(0, 2).map(x => ({...x, title: x.title.startsWith(cat.name) ? x.title : `${cat.name} · ${x.title}`})));
  }
  if(!rows.length) for(const a of addons) for(const c of a.manifest.catalogs || []){
    if((c.extra||[]).some(e => e.isRequired) || (c.extraRequired||[]).length) continue;
    if(rows.length < 8) rows.push({a, c, title: catalogHe(c.name) || c.id});
  }
  const cont = Object.values(progress).sort((x,y) => y.at - x.at).slice(0, 12);
  renderRows(rows, {cont});
}

function viewCategory(id){
  const cat = CATEGORIES.find(c => c.id === id);
  if(!cat) return viewHome();
  renderCats(id);
  renderRows(rowsFor(cat));
}

function renderHero(m){
  const h = $('#hero'); if(!h) return;
  h.innerHTML = `<div class="bg" style="background-image:url('${esc(m.background || m.poster)}')"></div><div class="beam"></div>
    <div class="copy"><h1 data-heid="${esc(m.id)}" dir="auto">${esc(heTitle(m.id, m.name))}</h1><p dir="auto">${esc((m.description||'').slice(0, 220))}${(m.description||'').length>220?'…':''}</p>
    <a class="btn primary" href="#/detail/${esc(m.type)}/${encodeURIComponent(m.id)}">לפרטים</a></div>`;
}

async function viewDiscover(type, catKey, genre){
  const app = $('#app');
  const types = [...new Set(addons.flatMap(a => (a.manifest.catalogs||[]).map(c => c.type)))];
  type = type || types[0] || 'movie';
  const cats = addons.flatMap(a => (a.manifest.catalogs||[]).filter(c => c.type === type && !(c.extra||[]).some(e => e.isRequired && e.name !== 'genre')).map(c => ({a, c, key: a.manifest.id + '|' + c.id})));
  const cur = cats.find(x => x.key === catKey) || cats[0];
  const genreExtra = cur && (cur.c.extra||[]).find(e => e.name === 'genre');
  const genres = (genreExtra && genreExtra.options) || cur?.c.genres || [];
  const go = (t, k, g) => location.hash = `#/discover/${t}/${encodeURIComponent(k||'')}/${encodeURIComponent(g||'')}`;
  app.innerHTML = `<div class="page"><h1>גלה</h1><div class="filters">
    <select id="ft" aria-label="סוג">${types.map(t => `<option value="${esc(t)}" ${t===type?'selected':''}>${esc(typeHe(t))}</option>`).join('')}</select>
    <select id="fc" aria-label="קטלוג">${cats.map(x => `<option value="${esc(x.key)}" ${x===cur?'selected':''}>${esc(catalogHe(x.c.name)||x.c.id)} (${esc(x.a.manifest.name)})</option>`).join('')}</select>
    ${genres.length ? `<select id="fg" aria-label="ז׳אנר"><option value="">כל הז׳אנרים</option>${genres.map(g => `<option value="${esc(g)}" ${g===genre?'selected':''}>${esc(genreHe(g))}</option>`).join('')}</select>` : ''}
  </div><div class="grid" id="grid">${skeletons(18)}</div><button class="btn ghost more" id="more" hidden>טען עוד</button></div>`;
  $('#ft').onchange = e => go(e.target.value);
  $('#fc').onchange = e => go(type, e.target.value);
  if($('#fg')) $('#fg').onchange = e => go(type, cur.key, e.target.value);
  if(!cur){ $('#grid').innerHTML = '<p class="note">אין קטלוגים מהסוג הזה.</p>'; return; }
  let skip = 0;
  const load = async () => {

/* ---------- streams: grouped by quality, with filters ---------- */
const QUALS = ['4K', '1080p', '720p', 'SD', 'CAM', 'Other'];
const GB = 1024 ** 3;
const PREVIEW = 5;
let streamFilter = Object.assign({quals: {CAM: false}, minSeeds: 0, maxGB: 0, sort: 'seeds'}, store.get('streamFilter', {}));
let streamsToken = 0;
const openGroups = new Set(), expandedGroups = new Set();
let groupsTouched = false;

const fmtSize = b => b >= GB ? (b / GB).toFixed(1) + ' GB' : Math.round(b / 1024 ** 2) + ' MB';
const score = x => x.direct ? Infinity : (x.seeds ?? -1);

/** Pull quality, seeders, size, provider and tags out of a Stremio stream (Torrentio format, with fallbacks). */
function parseStream(s, addon, i){
  const title = s.title || s.description || '';
  const text = `${s.name || ''}\n${title}\n${s.behaviorHints?.filename || ''}`.toLowerCase();
  const q = /\b(hd)?cam(rip)?\b|\b(hd)?ts\b|telesync|\bscr\b|screener|\btc\b|telecine/.test(text) ? 'CAM'
    : /2160p|\b4k\b|\buhd\b/.test(text) ? '4K'
    : /1080p/.test(text) ? '1080p'
    : /720p/.test(text) ? '720p'
    : /480p|576p|360p|\bsd\b|dvdrip|xvid/.test(text) ? 'SD' : 'Other';
  const seeds = title.match(/👤\s*(\d+)/)?.[1];
  const sm = title.match(/💾\s*([\d.,]+)\s*([KMGT])i?B/i);
  const size = sm ? parseFloat(sm[1].replace(',', '.')) * 1024 ** ('KMGT'.indexOf(sm[2].toUpperCase()) + 1)
                  : (s.behaviorHints?.videoSize || null);
  const tags = [[/\b(dv|dovi|dolby.?vision)\b/, 'DV'], [/\bhdr(10\+?)?(?![a-z])/, 'HDR'], [/x265|hevc|h\.?265/, 'HEVC'],
                [/remux/, 'REMUX'], [/\b3d\b/, '3D']].filter(([re]) => re.test(text)).map(([, t]) => t);
  return {
    s, addon, i, q, size, tags,
    seeds: seeds != null ? +seeds : null,
    provider: (title.match(/⚙️\s*([^\n]+)/)?.[1] || '').trim(),
    flags: title.match(/[\u{1F1E6}-\u{1F1FF}]{2}/gu) || [],
    name: (title.split('\n')[0] || s.name || addon).trim(),
    direct: !!(s.url || s.externalUrl || s.ytId),
  };
}

function passes(x){
  const f = streamFilter;
  return f.quals[x.q] !== false
    && (x.direct || (x.seeds ?? 0) >= f.minSeeds)
    && (!f.maxGB || !x.size || x.size <= f.maxGB * GB);
}

function playStream(s, label, ctx){
  // Release/file name lets the app pick Hebrew subtitles timed for this exact release.
  const release = s.behaviorHints?.filename || (s.title || s.description || '').split('\n')[0] || '';
  const vid = ctx.videoId || '';
  if(s.url && window.BoothAndroid) BoothAndroid.playUrl(s.url, label, vid, release);
  else if(s.url || s.ytId) openPlayer(s, label, ctx);
  else if(s.externalUrl && window.BoothAndroid) BoothAndroid.playUrl(s.externalUrl, label, vid, release);
  else if(s.externalUrl) window.open(s.externalUrl, '_blank', 'noopener');
  else if(s.infoHash && window.BoothAndroid) BoothAndroid.playTorrent(s.infoHash, Number.isInteger(s.fileIdx) ? s.fileIdx : -1, label, JSON.stringify(s.sources || []), vid, release);
  else alert('מקורות טורנט מתנגנים באפליקציית Booth לאנדרואיד.');
}

function renderStreams(box, all, pending, errors, label, ctx){
  const f = streamFilter;
  const counts = Object.fromEntries(QUALS.map(q => [q, all.filter(x => x.q === q).length]));
  const sorters = {
    seeds: (a, b) => (score(b) - score(a)) || 0,
    small: (a, b) => (a.size ?? Infinity) - (b.size ?? Infinity) || 0,
    large: (a, b) => (b.size ?? 0) - (a.size ?? 0),
  };
  const shown = all.filter(passes).sort(sorters[f.sort] || sorters.seeds);
  const groups = QUALS.map(q => [q, shown.filter(x => x.q === q)]).filter(([, xs]) => xs.length);
  if(!groupsTouched && !openGroups.size && groups.length) openGroups.add(groups[0][0]);

  const opt = (v, text) => `<option value="${v}">${text}</option>`;
  const row = x => `<button class="srow" data-i="${x.i}">
      <span class="seeds">${x.direct ? 'ישיר' : x.seeds != null ? '👤 ' + x.seeds : '—'}</span>
      <span class="info"><span class="t" dir="auto">${esc(x.name)}</span>
      <span class="m">${esc([x.size && fmtSize(x.size), x.provider || x.addon, ...x.tags].filter(Boolean).join(' · '))} ${x.flags.join(' ')}</span></span>
    </button>`;
  const group = ([q, xs]) => {
    const seeds = xs.map(x => x.seeds).filter(n => n != null);
    const sizes = xs.map(x => x.size).filter(Boolean);
    const meta = [(xs.length > 1 ? `${xs.length} מקורות` : 'מקור אחד'),
                  seeds.length && `עד 👤 ${Math.max(...seeds)}`,
                  sizes.length && [...new Set([fmtSize(Math.min(...sizes)), fmtSize(Math.max(...sizes))])].join(' – ')].filter(Boolean).join(' · ');
    const list = expandedGroups.has(q) ? xs : xs.slice(0, PREVIEW);
    return `<details class="qgroup" data-q="${q}" ${openGroups.has(q) ? 'open' : ''}>
      <summary><span class="qname">${q}</span><span class="qmeta">${meta}</span><button class="qbest" data-q="${q}" aria-label="נגן את מקור ה־${q} הטוב ביותר">▶ הכי טוב</button></summary>
      ${list.map(row).join('')}
      ${list.length < xs.length ? `<button class="smore" data-q="${q}">הצג את כל ה־${xs.length}</button>` : ''}
    </details>`;
  };

  // Re-rendering replaces the controls; keep D-pad/keyboard focus on the same one.
  const a = document.activeElement;
  const focusKey = a && box.contains(a) ? (a.id ? '#' + a.id : a.dataset.q ? `.${a.className.split(' ')[0]}[data-q="${a.dataset.q}"]` : null) : null;

  box.innerHTML = `
    <div class="sfilter" role="group" aria-label="סינון מקורות">
      ${QUALS.filter(q => counts[q]).map(q => `<button class="chip ${f.quals[q] !== false ? 'on' : ''}" data-q="${q}" aria-pressed="${f.quals[q] !== false}">${q}<span class="c">${counts[q]}</span></button>`).join('')}
      <select id="fSeeds" aria-label="מינימום זורעים">${[0, 5, 20, 100].map(n => opt(n, n ? `👤 ${n}+` : 'כל כמות זורעים')).join('')}</select>
      <select id="fSize" aria-label="גודל מקסימלי">${[0, 2, 5, 10, 20].map(n => opt(n, n ? `עד ${n} GB` : 'כל גודל')).join('')}</select>
      <select id="fSort" aria-label="מיון">${opt('seeds', 'הכי הרבה זורעים')}${opt('small', 'הקטן ביותר קודם')}${opt('large', 'הגדול ביותר קודם')}</select>
    </div>
    <p class="note sfsum">${all.length ? `${shown.length} מתוך ${all.length} מקורות` : ''}${pending ? (all.length ? ' · ' : '') + 'טוען מקורות…' : ''}</p>
    ${groups.map(group).join('')}
    ${!pending && all.length && !shown.length ? '<p class="note">אין מקורות שמתאימים לסינון.</p>' : ''}
    ${!pending && !all.length && !errors.length ? '<p class="note">לא נמצאו מקורות לכותר הזה.</p>' : ''}
    ${errors.map(e => `<p class="err">${esc(e)}</p>`).join('')}`;

  $('#fSeeds').value = f.minSeeds; $('#fSize').value = f.maxGB; $('#fSort').value = f.sort;
  if(focusKey) box.querySelector(focusKey)?.focus();

  const rerender = () => { store.set('streamFilter', streamFilter); renderStreams(box, all, pending, errors, label, ctx); };
  box.querySelectorAll('.chip').forEach(b => b.onclick = () => { f.quals[b.dataset.q] = f.quals[b.dataset.q] === false; rerender(); });
  $('#fSeeds').onchange = e => { f.minSeeds = +e.target.value; rerender(); };
  $('#fSize').onchange = e => { f.maxGB = +e.target.value; rerender(); };
  $('#fSort').onchange = e => { f.sort = e.target.value; rerender(); };
  box.querySelectorAll('.qgroup').forEach(d => d.ontoggle = () => {
    groupsTouched = true;
    d.open ? openGroups.add(d.dataset.q) : openGroups.delete(d.dataset.q);
  });
  box.querySelectorAll('.qbest').forEach(b => b.onclick = e => {
    e.preventDefault(); e.stopPropagation();
    const best = shown.filter(x => x.q === b.dataset.q).reduce((m, x) => score(x) > score(m) ? x : m);
    playStream(best.s, label, ctx);
  });
  box.querySelectorAll('.smore').forEach(b => b.onclick = () => { expandedGroups.add(b.dataset.q); rerender(); });
  box.querySelectorAll('.srow').forEach(b => b.onclick = () => playStream(all[b.dataset.i].s, label, ctx));
}

async function loadStreams({type, meta}, videoId, label){
  const box = $('#streams');
  const src = addons.filter(a => supports(a.manifest, 'stream', type, videoId));
  if(!src.length){ box.innerHTML = `<p class="note">לא מותקן תוסף מקורות לכותר הזה. אפשר להוסיף אחד בעמוד <a href="#/addons">התוספים</a>.</p>`; return; }
  const token = ++streamsToken;
  const ctx = {videoId, type, meta};
  const all = [], errors = [];
  let pending = src.length;
  openGroups.clear(); expandedGroups.clear(); groupsTouched = false;
  const render = () => { if(token === streamsToken && box.isConnected) renderStreams(box, all, pending > 0, errors, label, ctx); };
  render();
  await Promise.all(src.map(async a => {
    try{
      const d = await getJSON(`${a.base}/stream/${type}/${encodeURIComponent(videoId)}.json`);
      for(const s of d.streams || []) all.push(parseStream(s, a.manifest.name, all.length));
    }catch(e){ errors.push(`${a.manifest.name} לא הגיב (${e.message}).`); }
    pending--;
    render();
  }));
}

/** Text fetch through the Android app when available (no CORS, reaches LAN devices like a Raspberry Pi). */
const nativeCallbacks = {};
window.boothFetchDone = (id, ok, body) => {
  const cb = nativeCallbacks[id]; delete nativeCallbacks[id];
  if(cb) ok ? cb.res(body) : cb.rej(new Error(body));
};
function fetchText(url){
  if(window.BoothAndroid && BoothAndroid.fetchText) return new Promise((res, rej) => {
    const id = 'f' + Math.random().toString(36).slice(2);
    nativeCallbacks[id] = {res, rej};
    BoothAndroid.fetchText(url, id);
  });
  return fetch(url).then(r => { if(!r.ok) throw new Error(r.status + ' from ' + new URL(url).host); return r.text(); });
}

function parseM3U(text){
  const out = [];
  let cur = null;
  for(const raw of text.split(/\r?\n/)){
    const line = raw.trim();
    if(!line) continue;
    if(line.startsWith('#EXTINF')){
      const attr = k => (line.match(new RegExp(k + '="([^"]*)"')) || [])[1] || '';
      const bare = line.replace(/[\w-]+="[^"]*"/g, '');
      cur = {name: bare.slice(bare.indexOf(',') + 1).trim() || 'ערוץ', logo: attr('tvg-logo'),
             group: attr('group-title') || 'ערוצים', ua: attr('http-user-agent'), referer: attr('http-referrer')};
    } else if(line.startsWith('#EXTVLCOPT:')){
      if(!cur) continue;
      const [k, ...v] = line.slice(11).split('=');
      if(k === 'http-user-agent') cur.ua = v.join('=');
      if(k === 'http-referrer') cur.referer = v.join('=');
    } else if(line.startsWith('#EXTGRP:')){
      if(cur) cur.group = line.slice(8).trim();
    } else if(!line.startsWith('#')){
      out.push(cur ? {...cur, url: line} : {name: line.split('/').pop(), group: 'ערוצים', url: line});
      cur = null;
    }
  }
  return out;
}

  renderCats('live');
  const app = $('#app');
  const sources = [{key: 'il', name: 'ערוצים ישראליים'}, ...playlists.map(p => ({key: p.url, name: p.name}))];
  let sel = store.get('livePl', 'il');
  if(!sources.some(x => x.key === sel)) sel = 'il';
  const liveGroup = store.get('liveGroup', '');
  app.innerHTML = `<div class="page"><h1>שידור חי</h1>
    <div class="ltabs" role="group" aria-label="פלייליסטים">${sources.map(x => `<button class="chip ${x.key === sel ? 'on' : ''}" data-pl="${esc(x.key)}">${esc(x.name)}</button>`).join('')}</div>
    <div class="ltools"><input class="field" id="lq" placeholder="סינון ערוצים" aria-label="סינון ערוצים"><select class="field" id="lg" aria-label="קבוצה"></select>
      ${sel !== 'il' ? `<button class="danger" id="lrm">הסר את הפלייליסט</button>` : ''}</div>
    <div id="chs"><p class="note">טוען ערוצים…</p></div>
    <h2 style="font-family:var(--display);font-size:20px;margin:34px 0 4px">הוספת פלייליסט</h2>
    <form class="addpl" id="plf"><input class="field" id="pln" placeholder="שם (למשל RaspberryTV)" aria-label="שם הפלייליסט">
      <input class="field" id="plu" placeholder="http://192.168.1.50:9981/playlist/channels.m3u" aria-label="קישור לפלייליסט (M3U)" dir="ltr"><button class="btn primary">הוסף</button></form>
    ${msg ? `<p class="${msg.err ? 'err' : 'note'}">${esc(msg.text)}</p>` : ''}
    <p class="hint">כל פלייליסט M3U עובד. ב־Raspberry Pi: <b>TVHeadend</b> <code>http://&lt;pi-ip&gt;:9981/playlist/channels.m3u</code> (אם נדרשת התחברות, הוסף <code>user:pass@</code> לפני כתובת ה־IP) ·
      <b>Threadfin / xTeVe</b> <code>http://&lt;pi-ip&gt;:34400/m3u/threadfin.m3u</code> · <b>Jellyfin</b> <code>http://&lt;pi-ip&gt;:8096/LiveTv/Tuners/…/m3u</code>.</p></div>`;

  app.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => { store.set('livePl', b.dataset.pl); store.set('liveGroup', ''); viewLive(); });
  $('#plf').onsubmit = async e => {
    e.preventDefault();
    const url = $('#plu').value.trim(), name = $('#pln').value.trim() || 'הפלייליסט שלי';
    if(!url) return;
    try{
      const chans = parseM3U(await fetchText(url));
      if(!chans.length) throw new Error('לא נמצאו ערוצים בפלייליסט');
      playlistCache[url] = chans;
      playlists = playlists.filter(p => p.url !== url).concat({name, url});
      store.set('playlists', playlists); store.set('livePl', url);
      viewLive({text: `נוסף „${name}” עם ${chans.length} ערוצים.`});
    }catch(err){ viewLive({err: true, text: `לא ניתן לטעון את הפלייליסט (${err.message}).`}); }
  };
  if($('#lrm')) $('#lrm').onclick = () => {
    playlists = playlists.filter(p => p.url !== sel); store.set('playlists', playlists); store.set('livePl', 'il'); viewLive();
  };

  let chans;
  try{
    chans = sel === 'il' ? IL_CHANNELS : (playlistCache[sel] ||= parseM3U(await fetchText(sel)));
  }catch(err){ $('#chs').innerHTML = `<p class="err">לא ניתן לטעון את הפלייליסט (${esc(err.message)}).</p>`; return; }

  const groups = [...new Set(chans.map(c => c.group))];
  $('#lg').innerHTML = `<option value="">כל הקבוצות (${chans.length})</option>` + groups.map(g => `<option ${g === liveGroup ? 'selected' : ''}>${esc(g)}</option>`).join('');
  $('#lg').hidden = groups.length < 2;
  const draw = () => {
    const q = $('#lq').value.trim().toLowerCase(), g = $('#lg').value;
    const list = chans.filter(c => (!g || c.group === g) && (!q || c.name.toLowerCase().includes(q)));
    $('#chs').innerHTML = list.length ? `<div class="channels">${list.map(c => `<button class="chan" data-i="${chans.indexOf(c)}">
        <span class="logo">${c.logo ? `<img src="${esc(c.logo)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:${esc(JSON.stringify(c.name.slice(0, 2)))}}))">` : `<span>${esc(c.name.slice(0, 2))}</span>`}</span>
        <b>${esc(c.name)}</b><small>${esc(c.group)}</small></button>`).join('')}</div>` : '<p class="note">אין ערוצים שמתאימים.</p>';
    $('#chs').querySelectorAll('.chan').forEach(b => b.onclick = () => playLive(chans[b.dataset.i]));
  };
  $('#lq').oninput = draw;
  $('#lg').onchange = () => { store.set('liveGroup', $('#lg').value); draw(); };
  draw();
}

/* ---------- settings: skins & layouts ---------- */
const SKINS = [
  {id: 'tungsten', name: 'טונגסטן', note: 'ענבר חם על כחול לילה', c: ['#14161f', '#272c3f', '#f0b429', '#efe6cf']},
  {id: 'midnight', name: 'חצות', note: 'שחור מלא למסכי OLED, טורקיז', c: ['#000000', '#171b22', '#3dd6d0', '#e8eef5']},
  {id: 'velvet', name: 'קטיפה', note: 'אדום יין עם זהב', c: ['#1a0f14', '#331e27', '#e8b86b', '#f6e7dc']},
  {id: 'forest', name: 'יער', note: 'ירוק עמוק עם ליים', c: ['#0f1a15', '#1e3027', '#9be15d', '#e6efe4']},
  {id: 'daylight', name: 'אור יום', note: 'רקע בהיר, הדגשה באדום', c: ['#f4efe6', '#ebe3d5', '#c8412d', '#1d1a16']},
];
const LAYOUTS = [
  {id: 'cinema', name: 'קולנוע', note: 'באנר גדול ושורות גוללות',
   prev: '<i class="b"></i><span class="r">' + '<i></i>'.repeat(5) + '</span>'},
  {id: 'grid', name: 'קיר פוסטרים', note: 'בלי באנר; כל שורה נפרשת לרשת',
   prev: ('<span class="r">' + '<i></i>'.repeat(6) + '</span>').repeat(3)},
  {id: 'list', name: 'רשימה', note: 'שורות קומפקטיות עם שמות. הכי נוח בטלפון',
   prev: '<span class="l"><i></i><em></em></span>'.repeat(3)},
  {id: 'tv', name: 'טלוויזיה', note: 'פוסטרים וטקסט גדולים לשלט',
   prev: '<i class="b"></i><span class="r big">' + '<i></i>'.repeat(3) + '</span>'},
];
const POSTER_SIZES = [{id: 's', name: 'קטן'}, {id: 'm', name: 'בינוני'}, {id: 'l', name: 'גדול'}];
const isTv = () => !!(window.BoothAndroid && BoothAndroid.isTv && BoothAndroid.isTv());
let settings = Object.assign({skin: 'tungsten', layout: isTv() ? 'tv' : 'cinema', poster: 'm', lang: 'he'}, store.get('settings', {}));
function applySettings(){
  const r = document.documentElement;
  r.dataset.skin = settings.skin; r.dataset.layout = settings.layout; r.dataset.poster = settings.poster;
}
applySettings();

function viewSettings(){
  const card = (g, o, preview) => `<button class="setopt ${settings[g] === o.id ? 'on' : ''}" data-g="${g}" data-v="${o.id}" aria-pressed="${settings[g] === o.id}">
      ${preview}<span class="sn">${esc(o.name)}</span><span class="sd">${esc(o.note)}</span></button>`;
  const swatch = o => `<span class="swatch" style="background:${o.c[0]}" aria-hidden="true"><i style="background:${o.c[1]}"></i><i style="background:${o.c[2]}"></i><b style="color:${o.c[3]}">Aa</b></span>`;
  const a = document.activeElement;
  const focusKey = a?.dataset?.g ? `[data-g="${a.dataset.g}"][data-v="${a.dataset.v}"]` : null;
  $('#app').innerHTML = `<div class="page"><h1>הגדרות</h1>
    <section class="sset"><h2>ערכת עיצוב</h2><div class="sopts">${SKINS.map(o => card('skin', o, swatch(o))).join('')}</div></section>
    <section class="sset"><h2>פריסה</h2><div class="sopts">${LAYOUTS.map(o => card('layout', o, `<span class="lprev" aria-hidden="true">${o.prev}</span>`)).join('')}</div></section>
    <section class="sset"><h2>גודל פוסטרים</h2><div class="seg" role="group" aria-label="גודל פוסטרים">${POSTER_SIZES.map(o =>
      `<button class="${settings.poster === o.id ? 'on' : ''}" data-g="poster" data-v="${o.id}" aria-pressed="${settings.poster === o.id}">${o.name}</button>`).join('')}</div></section>
    <section class="sset"><h2>שמות ותקצירים</h2><div class="seg" role="group" aria-label="שפת השמות והתקצירים">${[{id: 'he', name: 'עברית'}, {id: 'en', name: 'English'}].map(o =>
      `<button class="${settings.lang === o.id ? 'on' : ''}" data-g="lang" data-v="${o.id}" aria-pressed="${settings.lang === o.id}">${o.name}</button>`).join('')}</div>
      <p class="note" style="margin:8px 0 0">השמות בעברית מגיעים מ־Wikidata והתקצירים מוויקיפדיה העברית. כותרים בלי ערך בעברית נשארים באנגלית.</p></section>
    <section class="sset"><h2>כתוביות</h2><p class="note" style="margin:0">כתוביות בעברית מתווספות אוטומטית לכל סרט ופרק (Wizdom ו־OpenSubtitles), לפי הגרסה שבחרת. אפשר להחליף או לכבות אותן בכפתור הכתוביות בנגן.</p></section>
    <p><button class="danger" id="sreset">איפוס לברירת המחדל</button></p></div>`;
  $('#app').querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
    settings[b.dataset.g] = b.dataset.v;
    store.set('settings', settings); applySettings(); viewSettings();
  });
  $('#sreset').onclick = () => {
    settings = {skin: 'tungsten', layout: isTv() ? 'tv' : 'cinema', poster: 'm', lang: 'he'};
    store.set('settings', settings); applySettings(); viewSettings();
  };
  if(focusKey) $('#app').querySelector(focusKey)?.focus();
}

function viewAddons(msg){
  $('#app').innerHTML = `<div class="page"><h1>תוספים</h1>
    <p class="note" style="max-width:68ch">הדבק קישור manifest של כל תוסף תואם Stremio. הקטלוגים, הפרטים ומקורות הצפייה מגיעים מהתוספים שמותקנים כאן.</p>
    <form class="add" id="addf"><input class="field" id="aurl" placeholder="https://…/manifest.json" aria-label="קישור manifest" dir="ltr"><button class="btn primary">התקן</button></form>
    ${msg ? `<p class="${msg.err?'err':'note'}">${esc(msg.text)}</p>` : ''}
    ${addons.map(a => `<div class="addon">${a.manifest.logo ? `<img src="${esc(a.manifest.logo)}" alt="">` : '<div class="ph"></div>'}
      <div><h3>${esc(a.manifest.name)} <span class="note">v${esc(a.manifest.version)}</span></h3><p>${esc(a.manifest.description)}</p><p>${esc((a.manifest.resources||[]).map(r => r.name||r).join(', '))}</p></div>
      <button class="danger" data-u="${esc(a.url)}">הסר</button></div>`).join('')}
    ${addonUrls.length > addons.length ? `<p class="err">${addonUrls.length - addons.length} תוספים לא זמינים כרגע ומוסתרים.</p>` : ''}</div>`;
  $('#addf').onsubmit = async e => {
    e.preventDefault();
    const url = $('#aurl').value.trim(); if(!url) return;
    if(addonUrls.includes(url)) return viewAddons({text:'התוסף הזה כבר מותקן.'});
    try{
      const m = await getJSON(normUrl(url));
      if(!m.id || !m.resources) throw new Error('זה לא קובץ manifest תקין');
      addonUrls.push(url); store.set('addons', addonUrls); await loadAddons();
      viewAddons({text:`${m.name} הותקן.`});
    }catch(err){ viewAddons({text:`ההתקנה נכשלה: ${err.message}. ודא שהקישור מסתיים ב־manifest.json.`, err:true}); }
  };
  document.querySelectorAll('.danger').forEach(b => b.onclick = async () => {
    addonUrls = addonUrls.filter(u => u !== b.dataset.u); store.set('addons', addonUrls); await loadAddons(); viewAddons({text:'הוסר.'});
  });
}

/* ---------- player ---------- */
let hls = null;
function openPlayer(s, title, ctx){
  $('#ptitle').textContent = title;
  const body = $('#pbody');
  if(s.ytId){
    body.innerHTML = `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(s.ytId)}?autoplay=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
  } else {
    body.innerHTML = `<video id="vid" controls autoplay playsinline></video>`;
    const v = $('#vid');
    if(/\.m3u8(\?|$)/.test(s.url) && window.Hls && Hls.isSupported()){ hls = new Hls(); hls.loadSource(s.url); hls.attachMedia(v); }
    else v.src = s.url;
    if(ctx){
      const saved = progress[ctx.videoId];
      if(saved) v.addEventListener('loadedmetadata', () => { if(saved.t < v.duration - 30) v.currentTime = saved.t; }, {once:true});
      let last = 0;
      v.addEventListener('timeupdate', () => {
        if(Math.abs(v.currentTime - last) < 5) return; last = v.currentTime;
        progress[ctx.videoId] = {t: v.currentTime, d: v.duration, at: Date.now(), metaId: ctx.meta.id, type: ctx.type, name: ctx.meta.name, poster: ctx.meta.poster};
        store.set('progress', progress);
      });
      v.addEventListener('error', () => body.insertAdjacentHTML('afterbegin', `<p class="err" style="position:absolute;top:70px;right:20px">הדפדפן לא יכול לנגן את הפורמט הזה. נסה מקור אחר.</p>`));
    }
  }
  $('#player').classList.add('open');
}
function closePlayer(){
  if(hls){ hls.destroy(); hls = null; }
  $('#pbody').innerHTML = ''; $('#player').classList.remove('open');
}
$('#close').onclick = closePlayer;
addEventListener('keydown', e => { if(e.key === 'Escape') closePlayer(); });

/* ---------- router ---------- */
$('#sf').onsubmit = e => { e.preventDefault(); const q = $('#q').value.trim(); if(q) location.hash = '#/search/' + encodeURIComponent(q); };
async function route(){
  const [, r = '', a, b, c] = location.hash.split('/').map(decodeURIComponent);
  document.querySelectorAll('.nav a').forEach(x => x.classList.toggle('on', x.dataset.r === (r || 'home')));
  scrollTo(0, 0);
  if(!['', 'cat', 'live'].includes(r)) renderCats(null);
  if(r === 'discover') viewDiscover(a, b, c);
  else if(r === 'cat') viewCategory(a);
  else if(r === 'live') viewLive();
  else if(r === 'search') viewSearch(a);
  else if(r === 'detail') viewDetail(a, b);
  else if(r === 'library') viewLibrary();
  else if(r === 'addons') viewAddons();
  else if(r === 'settings') viewSettings();
  else viewHome();
}
addEventListener('hashchange', route);
heReady = loadHebrewTitles();
loadAddons().then(route);
</script>
<div id="tstatus" role="status" aria-live="polite" style="display:none;position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:10000;max-width:calc(100vw - 32px);padding:12px 14px 12px 18px;border-radius:12px;background:var(--raise);border:1px solid var(--line);color:var(--light);font:14px/1.4 var(--body);box-shadow:0 8px 28px #0008;align-items:center;gap:14px">
  <span id="tstatusMsg"></span>
  <button id="tstatusBtn" style="flex:none;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer">ביטול</button>
</div>
<script>
// Torrent progress from the Android engine. Empty message hides the bar.
window.boothTorrentStatus = (msg, isError) => {
  const bar = document.getElementById('tstatus');
  document.getElementById('tstatusMsg').textContent = msg;
  bar.style.display = msg ? 'flex' : 'none';
  bar.style.borderColor = isError ? 'var(--velvet)' : 'var(--line)';
  const btn = document.getElementById('tstatusBtn');
  btn.textContent = isError ? 'סגור' : 'ביטול';
  btn.onclick = () => { if (!isError && window.BoothAndroid) BoothAndroid.cancelTorrent(); bar.style.display = 'none'; };
};
</script>
