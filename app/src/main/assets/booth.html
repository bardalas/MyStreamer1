<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>המקרן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=Rubik:wght@500;700;800&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// Apply saved skin/layout before first paint (Settings page). TV devices default to the TV layout.
try{
  const s = JSON.parse(localStorage.getItem('booth:settings') || '{}'), r = document.documentElement;
  const tv = !!(window.BoothAndroid && BoothAndroid.isTv && BoothAndroid.isTv());
  r.dataset.skin = s.skin || 'tungsten'; r.dataset.layout = s.layout || (tv ? 'tv' : 'cinema'); r.dataset.poster = s.poster || 'm'; r.dataset.nosrc = s.nosrc || 'grey';
}catch(e){}
</script>
<style>
:root{
  --night:#14161f; --surface:#1d2130; --raise:#272c3f; --line:#323850;
  --light:#efe6cf; --muted:#8e93a8; --tungsten:#f0b429; --velvet:#a3384b;
  --on-accent:#14161f; --text2:#d4cdb9; --err:#ff9d8a; --ghost:rgba(239,230,207,.1);
  --shade-55:rgba(20,22,31,.55); --shade-50:rgba(20,22,31,.5); --shade-20:rgba(20,22,31,.2);
  --glow:rgba(240,180,41,.45); --glow-soft:rgba(240,180,41,.35); --beam:rgba(240,180,41,.13);
  --poster-w:132px;
  --display:"Bricolage Grotesque","Rubik",system-ui,sans-serif;
  --body:"Figtree","Heebo",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--light);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tungsten);outline-offset:2px}
img{max-width:100%;display:block}

/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:14px 28px;background:linear-gradient(var(--night) 60%,transparent)}
.logo{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo svg{flex:none;transform:scaleX(-1)}   /* beam points toward the menu in RTL */
.nav{display:flex;gap:4px}
.nav a{text-decoration:none;padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:500}
.nav a.on{color:var(--light);background:var(--raise)}
.search{flex:0 1 300px;min-width:150px;margin-inline-start:auto;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 16px 4px 4px;width:min(340px,40vw)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.search button{background:var(--tungsten);color:var(--on-accent);border:0;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}

main{padding:0 28px 60px}

/* hero: projector beam */
.hero{position:relative;margin:0 -28px 32px;min-height:46vh;display:flex;align-items:flex-end;overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 25%;filter:saturate(.85)}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:
  linear-gradient(270deg,var(--night) 8%,var(--shade-55) 45%,transparent 75%),
  linear-gradient(0deg,var(--night) 2%,transparent 45%)}
.hero .beam{display:none;position:absolute;z-index:1;left:-10%;transform:scaleX(-1);top:-30%;width:70%;height:160%;background:conic-gradient(from 200deg at 100% 0%,transparent 0deg,var(--beam) 14deg,transparent 30deg);pointer-events:none}
.hero .copy{position:relative;z-index:2;padding:0 28px 48px;max-width:760px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,56px);line-height:1.05;letter-spacing:-.02em;margin:0 0 12px}
.hero p{color:var(--text2);max-width:56ch;margin:0 0 18px;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 22px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--tungsten);color:var(--on-accent)}
.btn.ghost{background:var(--ghost);color:var(--light)}
.btn.ghost.saved{background:var(--velvet)}

/* rows and posters */
.row{margin-bottom:34px}
.row h2,.page h1{font-family:var(--display);font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
.row h2{font-size:22px}
.row h2 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-inline-start:8px}
.strip{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{height:6px}.strip::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--poster-w),1fr));gap:22px 16px}
.poster{flex:0 0 var(--poster-w);scroll-snap-align:start;text-decoration:none;display:block}
.poster .art{aspect-ratio:2/3;border-radius:6px;background:var(--surface) center/cover;position:relative;overflow:hidden;transition:transform .2s}
.poster:hover .art,.poster:focus-visible .art{transform:translateY(-2px)}
.poster .t{margin-top:8px;font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poster .y{color:var(--muted);font-size:13px}
.poster .prog{position:absolute;inset-inline-start:0;bottom:0;height:4px;background:var(--tungsten)}
.noart{display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-family:var(--display);color:var(--muted)}

/* page filters */
.page{padding-top:12px}
.page h1{font-size:40px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 24px}
.filters select,.field{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.more{margin:28px auto 0;display:block}

/* detail */
.detail{display:grid;grid-template-columns:260px 1fr;gap:40px;position:relative;z-index:2;margin-top:-30vh;padding-top:12px}
.detail .poster-lg{border-radius:8px;aspect-ratio:2/3;background:var(--surface) center/cover;box-shadow:0 20px 50px -10px #000}
.detail h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,48px);line-height:1.05;letter-spacing:-.02em;margin:0 0 12px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.facts span{background:var(--raise);border-radius:4px;padding:3px 9px;font-size:13px;color:var(--text2)}
.facts .imdb{font-weight:600}
.desc{max-width:68ch;color:var(--text2)}
.people{color:var(--muted);font-size:14px;margin:12px 0 22px;max-width:68ch}
.people b{color:var(--light);font-weight:500}
.backdrop{height:50vh;margin:0 -28px;background-size:cover;background-position:center 20%;position:relative}
.backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--night) 12%,var(--shade-50) 60%,var(--shade-20))}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;margin-top:28px}
.panel{background:var(--surface);border-radius:10px;padding:18px}
.panel h3{margin:0 0 12px;font-family:var(--display);font-size:19px}
.eps{max-height:520px;overflow:auto;display:flex;flex-direction:column;gap:4px}
.ep{display:grid;grid-template-columns:34px 1fr;gap:10px;text-align:start;background:none;border:0;border-radius:6px;padding:8px;cursor:pointer}
.ep:hover{background:var(--raise)} .ep.on{background:var(--raise);box-shadow:inset -3px 0 var(--tungsten)}
.ep .n{font-family:var(--display);font-weight:700;color:var(--tungsten)}
.ep .d{font-size:12px;color:var(--muted)}

/* sources: one Play button, quality shortcuts, the rest tucked away */
.panel,#streams{min-width:0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--tungsten);border-color:var(--tungsten);color:var(--on-accent);font-weight:600}
.play{display:flex;flex-direction:column;gap:14px}
.playbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:10px;padding:14px 18px;background:var(--tungsten);color:var(--on-accent);font-size:17px;font-weight:700;cursor:pointer}
.playbtn small{font-weight:500;font-size:13px;opacity:.8}
.playbtn:disabled{background:var(--raise);color:var(--muted);cursor:default}
.quals{display:flex;flex-wrap:wrap;gap:8px}
.quals button{border:1px solid var(--line);background:none;color:var(--light);border-radius:8px;padding:7px 14px;font-size:14px;cursor:pointer}
.quals button:hover,.quals button:focus-visible{border-color:var(--tungsten)}
.alt>summary{cursor:pointer;color:var(--muted);font-size:14px;list-style:none}
.alt>summary::-webkit-details-marker{display:none}
.alt>summary::before{content:"◂ ";display:inline-block;transition:transform .15s}
.alt[open]>summary::before{transform:rotate(-90deg)}
.srow{display:flex;gap:12px;width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);background:none;color:var(--light);padding:10px 4px;cursor:pointer;font-size:14px}
.srow:hover,.srow:focus-visible{background:var(--raise)}
.srow b{flex:0 0 52px;font-weight:600}
.srow span{color:var(--muted);font-variant-numeric:tabular-nums}
/* titles without any source */
.poster.nosrc .art{filter:grayscale(1);opacity:.35}
.poster.nosrc .t,.poster.nosrc .y{opacity:.45}
[data-nosrc="hide"] .poster.nosrc{display:none}
.note{color:var(--muted);font-size:14px}
.err{color:var(--err);font-size:14px}

/* addons */
.addon{display:grid;grid-template-columns:56px 1fr auto;gap:16px;align-items:center;background:var(--surface);border-radius:10px;padding:14px;margin-bottom:10px;max-width:820px}
.addon img,.addon .ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--raise)}
.addon h3{margin:0;font-size:16px}
.addon p{margin:2px 0 0;color:var(--muted);font-size:13px}
.add{display:flex;gap:10px;max-width:820px;margin:0 0 24px}
.add input{flex:1}
.danger{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--muted)}

/* player */
.player{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column}
.player.open{display:flex}
.player header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#000}
.player header b{font-family:var(--display);font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player video,.player iframe{flex:1;width:100%;border:0;background:#000;min-height:0}

/* ---------- skins (Settings) ---------- */
:root[data-skin="midnight"]{--night:#000;--surface:#0e1116;--raise:#171b22;--line:#262c36;--light:#e8eef5;--muted:#7f8a98;--tungsten:#3dd6d0;--velvet:#e0457b;
  --on-accent:#001614;--text2:#c3ccd6;--shade-55:rgba(0,0,0,.55);--shade-50:rgba(0,0,0,.5);--shade-20:rgba(0,0,0,.2);
  --glow:rgba(61,214,208,.45);--glow-soft:rgba(61,214,208,.35);--beam:rgba(61,214,208,.12);--ghost:rgba(232,238,245,.1)}
:root[data-skin="velvet"]{--night:#1a0f14;--surface:#26161d;--raise:#331e27;--line:#4a2c38;--light:#f6e7dc;--muted:#ab929b;--tungsten:#e8b86b;--velvet:#c2415d;
  --on-accent:#1a0f14;--text2:#dfc9bd;--shade-55:rgba(26,15,20,.55);--shade-50:rgba(26,15,20,.5);--shade-20:rgba(26,15,20,.2);
  --glow:rgba(232,184,107,.45);--glow-soft:rgba(232,184,107,.35);--beam:rgba(232,184,107,.13);--ghost:rgba(246,231,220,.1)}
:root[data-skin="forest"]{--night:#0f1a15;--surface:#16241d;--raise:#1e3027;--line:#2d4438;--light:#e6efe4;--muted:#8ba494;--tungsten:#9be15d;--velvet:#d9643a;
  --on-accent:#0f1a15;--text2:#c9d8c8;--shade-55:rgba(15,26,21,.55);--shade-50:rgba(15,26,21,.5);--shade-20:rgba(15,26,21,.2);
  --glow:rgba(155,225,93,.4);--glow-soft:rgba(155,225,93,.3);--beam:rgba(155,225,93,.1);--ghost:rgba(230,239,228,.1)}
:root[data-skin="daylight"]{--night:#f4efe6;--surface:#fffaf2;--raise:#ebe3d5;--line:#d8cebd;--light:#1d1a16;--muted:#6b6358;--tungsten:#c8412d;--velvet:#8a2432;
  --on-accent:#fff;--text2:#3d372f;--err:#b3261e;--shade-55:rgba(244,239,230,.55);--shade-50:rgba(244,239,230,.5);--shade-20:rgba(244,239,230,.2);
  --glow:rgba(200,65,45,.3);--glow-soft:rgba(200,65,45,.25);--beam:rgba(200,65,45,.07);--ghost:rgba(29,26,22,.08)}

/* ---------- layouts (Settings) ---------- */
:root[data-poster="s"]{--poster-w:104px}
:root[data-poster="l"]{--poster-w:168px}
/* Poster wall: no banner, every row wraps into a grid */
[data-layout="grid"] .hero{display:none}
[data-layout="grid"] main{padding-top:8px}
[data-layout="grid"] .strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--poster-w),1fr));gap:22px 16px;overflow:visible}
/* List: compact rows with small art, title and year */
[data-layout="list"] .hero{display:none}
[data-layout="list"] main{padding-top:8px}
[data-layout="list"] .strip,[data-layout="list"] .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px 16px;overflow:visible}
[data-layout="list"] .poster{display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto 1fr;column-gap:12px;padding:8px;border-radius:8px;background:var(--surface)}
[data-layout="list"] .poster .art{grid-row:1 / span 2;width:52px}
[data-layout="list"] .poster .t{margin-top:2px}
[data-layout="list"] .poster:hover .art,[data-layout="list"] .poster:focus-visible .art{transform:none;box-shadow:none}
[data-layout="list"] .poster:hover,[data-layout="list"] .poster:focus-visible{background:var(--raise)}
/* TV: 10-foot UI - larger type, posters and focus for a remote */
[data-layout="tv"] body{font-size:17px}
[data-layout="tv"] .poster{flex-basis:var(--poster-w)}
[data-layout="tv"] .grid{grid-template-columns:repeat(auto-fill,minmax(var(--poster-w),1fr))}
[data-layout="tv"] .strip{gap:24px;padding:8px 6px 18px}
[data-layout="tv"] .row h2{font-size:28px}
[data-layout="tv"] .nav a{padding:10px 20px;font-size:18px}
[data-layout="tv"] :focus-visible{outline-width:4px;outline-offset:4px}
[data-layout="tv"] .poster:focus .art,[data-layout="tv"] .poster:focus-visible .art{transform:scale(1.06);box-shadow:0 0 0 4px var(--tungsten),0 16px 40px -10px var(--glow-soft)}
[data-layout="tv"] .poster:focus-visible{outline:none}

/* settings page */
.sset{margin:0 0 32px;max-width:1000px}
.sset h2{font-family:var(--display);font-size:20px;font-weight:700;margin:0 0 12px}
.sopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.setopt{display:flex;flex-direction:column;gap:6px;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;color:var(--light)}
.setopt:hover{border-color:var(--muted)}
.setopt.on{border-color:var(--tungsten);box-shadow:0 0 0 1px var(--tungsten)}
.setopt .sn{font-weight:600;display:flex;align-items:center;gap:6px}
.setopt.on .sn::after{content:"✓";color:var(--tungsten)}
.setopt .sd{font-size:12px;color:var(--muted);line-height:1.35}
.swatch{display:flex;align-items:flex-end;gap:5px;height:72px;border-radius:7px;padding:9px;border:1px solid var(--line)}
.swatch i{width:18px;height:18px;border-radius:50%}
.swatch b{margin-inline-start:auto;font-family:var(--display);font-size:24px;line-height:1}
.lprev{display:flex;flex-direction:column;gap:4px;height:72px;padding:6px;border-radius:7px;background:var(--night);border:1px solid var(--line)}
.lprev .b{height:22px;flex:none;border-radius:3px;background:var(--raise)}
.lprev .r{display:flex;gap:4px;flex:1}
.lprev .r i{flex:1;border-radius:2px;background:var(--tungsten);opacity:.5}
.lprev .r.big i{opacity:.8}
.lprev .l{display:flex;gap:6px;align-items:center;flex:1}
.lprev .l i{width:11px;align-self:stretch;border-radius:2px;background:var(--tungsten);opacity:.5}
.lprev .l em{flex:1;height:5px;border-radius:3px;background:var(--muted);opacity:.55}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:999px;padding:8px 18px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--tungsten);color:var(--on-accent)}

.cats{position:sticky;top:64px;z-index:15;display:flex;gap:8px;overflow-x:auto;padding:4px 28px 12px;background:linear-gradient(var(--night) 75%,transparent);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats[hidden]{display:none}
.cats a{flex:none;text-decoration:none;padding:6px 10px;border-radius:0;color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.cats a:hover{color:var(--light)}
.cats a.on{color:var(--light);box-shadow:inset 0 -2px var(--tungsten)}
[data-layout="tv"] .cats a{padding:10px 20px;font-size:17px}

/* live tv */
.ltabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.ltools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
.ltools .field{min-width:220px}
.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.chan{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--light);cursor:pointer;text-align:center}
.chan:hover,.chan:focus-visible{background:var(--raise);border-color:var(--tungsten)}
.chan .logo{width:100%;height:64px;display:flex;align-items:center;justify-content:center}
.chan .logo img{max-height:64px;max-width:90%;object-fit:contain}
.chan .logo span{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--raise);font-family:var(--display);font-weight:700;font-size:20px;color:var(--tungsten)}
.chan b{font-size:14px;line-height:1.25}
.chan small{font-size:12px;color:var(--muted)}
[data-layout="tv"] .channels{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.addpl{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;max-width:900px;margin:8px 0 6px}
.hint{font-size:13px;color:var(--muted);max-width:900px;margin:0 0 24px}
.hint code{background:var(--raise);padding:1px 6px;border-radius:4px;font-size:12px}
@media (max-width:760px){.cats{top:104px;padding:4px 16px 10px}.addpl{grid-template-columns:1fr}}

/* Hebrew metadata */
.desc[dir="rtl"]{font-size:16px;line-height:1.7}
.desc .src{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.desc .src a{color:var(--muted)}
.readmore{background:none;border:0;color:var(--tungsten);font-weight:600;cursor:pointer;padding:0 4px}
.orig{display:block;font-family:var(--body);font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:6px}

/* RaspberryTV: access key form and catch-up sheet */
.keyform{display:flex;gap:10px;flex-wrap:wrap;align-items:center;max-width:560px;margin:4px 0 8px}
.keyform input{width:160px;letter-spacing:.15em;text-align:center;font-variant-numeric:tabular-nums}
.chan .rec{font-size:11px;color:var(--tungsten)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--night);border:1px solid var(--line);border-radius:14px 14px 0 0;width:min(720px,100%);max-height:88vh;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header img{height:32px;max-width:72px;object-fit:contain}
.sheet header b{flex:1;font-size:17px}
.sheet header button{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.sheet .body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.days button{flex:none;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.days button.on{color:var(--light);border-color:var(--tungsten)}
.prog{display:flex;gap:12px;width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);background:none;color:var(--light);padding:10px 4px;cursor:pointer;font-size:14px}

<script>
/* ---------- storage ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem('booth:'+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){
    try{ localStorage.setItem('booth:'+k, JSON.stringify(v)); }
    catch(e){ store.prune(); try{ localStorage.setItem('booth:'+k, JSON.stringify(v)); }catch(e2){} }
  },
  // big caches are written at most once a second, off the scrolling path
  dirty: {},
  lazy(k, v){ store.dirty[k] = v; clearTimeout(store.timer); store.timer = setTimeout(store.flush, 1000); },
  flush(){ const d = store.dirty; store.dirty = {}; for(const k in d) store.set(k, d[k]); },
  /** Storage is full: drop the rebuildable caches, never the library/progress/settings. */
  prune(){
    for(const k of ['heMeta', 'avail', 'svcMap']) try{ localStorage.removeItem('booth:' + k); }catch(e){}
  },
};
addEventListener('visibilitychange', () => { if(document.visibilityState === 'hidden') store.flush(); });
/** Keep a plain object cache under a size limit (oldest-inserted entries go first). */
function capMap(obj, max){
  const keys = Object.keys(obj);
  if(keys.length <= max) return obj;
  for(const k of keys.slice(0, keys.length - max)) delete obj[k];
  return obj;
}
const CINEMETA = 'https://v3-cinemeta.strem.io/manifest.json';
const TORRENTIO = 'https://torrentio.strem.fun/manifest.json';
// Netflix, Apple TV+, Disney+, Prime, HBO Max, Paramount+, Curiosity Stream, MagellanTV (Israel region).
const STREAMING_CATALOGS = 'https://7a82163c306e-stremio-netflix-catalog-addon.baby-beamup.club/bmZ4LGF0cCxkbnAsYW1wLGhibSxwbXAsY3RzLG1nbDo6SUw6MTc4OTg0MTUwODAwMDoxOjA6/manifest.json';
let addonUrls = store.get('addons', [CINEMETA, TORRENTIO, STREAMING_CATALOGS]);
if(store.get('defaultsRev', 1) < 2){
  if(!addonUrls.includes(STREAMING_CATALOGS)) addonUrls.push(STREAMING_CATALOGS);
  store.set('defaultsRev', 2);
}
if(store.get('defaultsRev', 1) < 3){
  // Israeli/Arabic catalogs are now built into the app (live from Wikidata); drop the old repo-hosted add-on.
  addonUrls = addonUrls.filter(u => !u.includes('raw.githubusercontent.com/bardalas/MyStreamer1'));
  store.set('addons', addonUrls); store.set('defaultsRev', 3);
}
let library = store.get('library', {});
let progress = store.get('progress', {});
let addons = [];   // {url, base, manifest}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normUrl = u => u.trim().replace(/^stremio:\/\//, 'https://');
const baseOf = u => normUrl(u).replace(/\/manifest\.json(\?.*)?$/, '');
/** fetch with a deadline: a hung socket must not leave a screen "loading" forever. */
async function fetchTimed(url, ms, opts){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try{ return await fetch(url, {...opts, signal: ctl.signal}); }
  catch(e){ throw new Error(e.name === 'AbortError' ? 'אין תגובה' : e.message); }
  finally{ clearTimeout(timer); }
}
async function getJSON(url, ms = 9000){
  const r = await fetchTimed(url, ms);
  if(!r.ok) throw new Error(r.status + ' from ' + new URL(url).host);
  return r.json();
}
function supports(m, resource, type, id){
  for(const r of m.resources || []){
    const name = typeof r === 'string' ? r : r.name;
    if(name !== resource) continue;
    const types = (typeof r === 'object' && r.types) || m.types || [];
    const pref = (typeof r === 'object' && r.idPrefixes) || m.idPrefixes;
    if(type && !types.includes(type)) continue;
    if(id && pref && pref.length && !pref.some(p => id.startsWith(p))) continue;
    return true;
  }
  return false;
}
const yearOf = m => m.releaseInfo || (m.year ?? '') || (m.released ? m.released.slice(0,4) : '');

async function loadAddons(){
  const res = await Promise.allSettled(addonUrls.map(async url => ({url, base: baseOf(url), manifest: await getJSON(normUrl(url))})));
  addons = res.filter(r => r.status === 'fulfilled').map(r => r.value).concat(LOCAL_ADDON);
}

/* ---------- Hebrew titles, plots & search — fetched live from Wikidata and Hebrew Wikipedia ----------
   Uses the regular Wikidata API (search + wbgetentities). Titles are looked up only for posters that
   actually scroll into view, and cached on the device. */
const WDAPI = 'https://www.wikidata.org/w/api.php?format=json&origin=*&';
let heCache = store.get('heMeta', {});             // tt -> {t: Hebrew title, w: hewiki article}
const hePending = new Set();
let heTimer = null, heBusy = false;
const hebrewOn = () => (typeof settings === 'undefined' || settings.lang !== 'en');
const hasHebrew = s => /[\u0590-\u05FF]/.test(s || '');
// Wikidata labels sometimes carry a disambiguator: "אובססיה (סרט, 2025)" -> "אובססיה".
const heClean = t => (t || '').replace(/\s*\((?:סרט|סדרה|סדרת|מיני-סדרה|מיני סדרה|תוכנית|סרטון)[^)]*\)\s*$/, '').trim();
const heTitle = (id, fallback) => (hebrewOn() && heCache[id]?.t) || fallback;
for(const e of Object.values(heCache)) if(e?.t) e.t = heClean(e.t);   // titles cached by 0.9/0.10 weren't cleaned
// 0.11/0.12 could cache "no Hebrew entry" when Wikidata answered with an error; forget those once,
// and let negative answers expire after a week.
if(store.get('heRev', 0) < 1){
  for(const [id, e] of Object.entries(heCache)) if(!e?.t && !e?.w) delete heCache[id];
  store.set('heMeta', heCache); store.set('heRev', 1);
}
for(const [id, e] of Object.entries(heCache)) if(!e?.t && !e?.w && (!e.n || Date.now() - e.n > 7 * 864e5)) delete heCache[id];

const claim = (e, p) => e?.claims?.[p]?.[0]?.mainsnak?.datavalue?.value;
const claimIds = (e, p) => (e?.claims?.[p] || []).map(c => c.mainsnak?.datavalue?.value?.id).filter(Boolean);
const claimYear = e => (e?.claims?.P577 || []).map(c => c.mainsnak?.datavalue?.value?.time?.slice(1, 5)).filter(Boolean).sort()[0];
const hewiki = e => (e?.sitelinks?.hewiki?.title || '').replace(/ /g, '_');

/** Run fn over items with limited concurrency. */
async function pool(items, n, fn){
  const queue = [...items];
  await Promise.all(Array.from({length: Math.min(n, queue.length)}, async () => { while(queue.length) await fn(queue.shift()); }));
}

/** IMDb ids -> Hebrew title + Hebrew Wikipedia article, via the Wikidata API. */
async function heLookup(ids){
  const byItem = {};
  // one small search per id: a combined search can't say which item matched which IMDb id
  await pool(ids, isTvLayout() ? 2 : 6, async id => {
    try{
      const s = await getJSON(`${WDAPI}action=query&list=search&srlimit=1&srprop=&srsearch=haswbstatement:P345=${id}`);
      const q = s.query?.search?.[0]?.title;
      if(q) byItem[q] = id;
      else if(Array.isArray(s.query?.search)) heCache[id] = {t: '', w: '', n: Date.now()};   // really not on Wikidata
      // anything else (rate-limit or error JSON): leave uncached and try again later
    }catch(e){ /* network error: try again next time it is shown */ }
  });
  const qs = Object.keys(byItem);
  for(let i = 0; i < qs.length; i += 50){
    const d = await getJSON(`${WDAPI}action=wbgetentities&props=labels|sitelinks&languages=he&sitefilter=hewiki&ids=${qs.slice(i, i + 50).join('|')}`);
    for(const [q, e] of Object.entries(d.entities || {})) heCache[byItem[q]] = {t: heClean(e.labels?.he?.value), w: hewiki(e)};
  }
  store.lazy('heMeta', capMap(heCache, 4000));
}

/** Queue ids for a Hebrew title lookup (batched; the page is updated in place). */
function hebrewize(ids){
  if(!hebrewOn()) return;
  for(const id of ids) if(/^tt\d+$/.test(id) && !(id in heCache)) hePending.add(id);
  if(hePending.size){ clearTimeout(heTimer); heTimer = setTimeout(heFlush, 250); }
}
async function heFlush(){
  if(heBusy || !hePending.size) return;
  heBusy = true;
  const batch = [...hePending].slice(0, 30);
  batch.forEach(id => hePending.delete(id));
  try{ await heLookup(batch); }catch(e){ /* offline or rate-limited */ }
  applyHebrew();
  heBusy = false;
  if(hePending.size) heTimer = setTimeout(heFlush, 400);
}
function applyHebrew(){
  if(!hebrewOn()) return;
  document.querySelectorAll('[data-heid]').forEach(el => {
    const t = heCache[el.dataset.heid]?.t;
    if(t && el.textContent !== t){ el.textContent = t; el.dir = 'rtl'; }
  });
}

// Look titles up only when their poster comes into view (rows hold hundreds of titles).
const heObserver = new IntersectionObserver(entries => {
  const ids = [];
  for(const en of entries) if(en.isIntersecting){ heObserver.unobserve(en.target); ids.push(en.target.dataset.heid); }
  if(ids.length) hebrewize(ids);
}, {rootMargin: '300px'});
function armHeAndAvail(root){
  if(hebrewOn()) root.querySelectorAll?.('[data-heid]').forEach(el => { if(!(el.dataset.heid in heCache)) heObserver.observe(el); });
  root.querySelectorAll?.('[data-avail]').forEach(el => { if(!availKnown(el.dataset.avail)) availObserver.observe(el); });
}
new MutationObserver(muts => {
  if(!hebrewOn()) return;
  for(const m of muts) for(const n of m.addedNodes){
    if(n.nodeType !== 1) continue;
    const els = n.matches('[data-heid]') ? [n] : n.querySelectorAll('[data-heid]');
    const now = [];
    for(const el of els){
      if(el.dataset.heid in heCache) continue;
      // the first posters of a row are on screen right away; the rest wait until scrolled to
      const card = el.closest('.poster');
      if(!card || [...card.parentNode.children].indexOf(card) < 10) now.push(el.dataset.heid);
      else heObserver.observe(el);
    }
    if(now.length) hebrewize(now);
  }
}).observe(document.body, {childList: true, subtree: true});

const plotCache = {};
/** Hebrew plot for an IMDb id from Hebrew Wikipedia: the plot section, else the lead. */
async function hebrewPlot(id){
  if(id in plotCache) return plotCache[id];
  if(!(id in heCache)) await heLookup([id]);
  const article = heCache[id]?.w;
  if(!article) return plotCache[id] = null;
  const d = await getJSON(`https://he.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exsectionformat=wiki&redirects=1&format=json&origin=*&titles=${encodeURIComponent(article)}`);
  const text = Object.values(d.query.pages)[0]?.extract || '';
  const plot = text.match(/^==\s*(?:עלילה|עלילת הסרט|עלילת הסדרה|תקציר העלילה|תקציר הסדרה|תקציר|תקציר עלילה)\s*==\s*$([\s\S]*?)(?=^==[^=]|$(?![\s\S]))/m);
  const body = (plot ? plot[1] : text.split(/^==/m)[0]).replace(/^===.*===$/gm, '').replace(/\n{2,}/g, '\n').trim();

const SERIES_CLASSES = new Set(['Q5398426', 'Q1259759', 'Q63952888', 'Q526877', 'Q117467246', 'Q15416', 'Q7725310']);
const FILM_CLASSES = new Set(['Q11424', 'Q202866', 'Q93204', 'Q24869', 'Q506240', 'Q24862', 'Q229390', 'Q226730', 'Q2484376', 'Q17517379', 'Q20650540']);
const EPISODE_CLASS = 'Q21191270';

/** Wikidata items -> Stremio metas (tt ids only), filling the Hebrew title cache on the way. */
async function wdMetas(qids, forceType){
  const out = [];
  for(let i = 0; i < qids.length; i += 50){
    const d = await getJSON(`${WDAPI}action=wbgetentities&props=labels|claims|sitelinks&languages=he|en|ar&sitefilter=hewiki&ids=${qids.slice(i, i + 50).join('|')}`);
    for(const q of qids.slice(i, i + 50)){
      const e = d.entities?.[q];
      const id = claim(e, 'P345');
      if(!e || typeof id !== 'string' || !id.startsWith('tt')) continue;
      const classes = claimIds(e, 'P31');
      if(classes.includes(EPISODE_CLASS)) continue;
      const series = classes.some(c => SERIES_CLASSES.has(c));
      if(!forceType && !series && !classes.some(c => FILM_CLASSES.has(c))) continue;
      const he = heClean(e.labels?.he?.value);
      heCache[id] = {t: he, w: hewiki(e)};
      out.push({id, type: forceType || (series ? 'series' : 'movie'), name: he || e.labels?.en?.value || e.labels?.ar?.value || id,
                poster: `https://images.metahub.space/poster/medium/${id}/img`, releaseInfo: claimYear(e) || ''});
    }
  }
  store.set('heMeta', heCache);
  return out;
}

async function hebrewSearch(q){
  const s = await getJSON(`${WDAPI}action=query&list=search&srlimit=20&srprop=&srsearch=${encodeURIComponent(q + ' haswbstatement:P345')}`);
  const qids = (s.query?.search || []).map(r => r.title).filter(t => /^Q\d+$/.test(t));

/* ---------- YouTube (official broadcaster channels) — fetched live, played in the YouTube app ---------- */
const ytCache = {};
function ytInitialData(html){
  let m = html.match(/var ytInitialData = (\{[\s\S]*?\});<\/script>/);
  if(m) return JSON.parse(m[1]);
  // mobile site (m.youtube.com): the same JSON as an escaped string literal
  m = html.match(/var ytInitialData = '((?:[^'\\]|\\.)*)';/);
  if(!m) return {};
  return JSON.parse(JSON.parse('"' + m[1].replace(/\\x([0-9a-fA-F]{2})/g, '\\u00$1').replace(/\\'/g, "'") + '"'));
}
const ytText = t => t?.simpleText || (t?.runs || []).map(r => r.text).join('') || t?.content || '';
/** Playlists or videos from a YouTube page (both use "lockup" view models). */
function ytLockups(data){
  const out = [];
  (function walk(o){
    if(!o || typeof o !== 'object') return;
    // mobile-site renderers
    const r = o.compactPlaylistRenderer || o.gridPlaylistRenderer || o.playlistRenderer;
    if(r?.playlistId){
      const thumb = (r.thumbnail?.thumbnails || r.thumbnails?.[0]?.thumbnails || []).slice(-1)[0]?.url || '';
      out.push({id: r.playlistId, name: ytText(r.title), video: false, thumb});
      return;
    }
    const v = o.playlistVideoRenderer || o.compactVideoRenderer || o.videoRenderer;
    if(v?.videoId){
      out.push({id: v.videoId, name: ytText(v.title), video: true, thumb: `https://i.ytimg.com/vi/${v.videoId}/mqdefault.jpg`});
      return;
    }
    if(o.lockupViewModel){
      const v = o.lockupViewModel, id = v.contentId;
      const title = v.metadata?.lockupMetadataViewModel?.title?.content;
      const video = v.contentType === 'LOCKUP_CONTENT_TYPE_VIDEO';
      const img = JSON.stringify(v.contentImage || {}).match(/https:\/\/i\.ytimg\.com\/[^"]+/);
      if(id && title) out.push({id, name: title, video, thumb: video ? `https://i.ytimg.com/vi/${id}/mqdefault.jpg` : (img ? img[0].replace(/\\u0026/g, '&') : '')});
      return;
    }
    for(const k in o) walk(o[k]);
  })(data);
  return out;
}

/* ---------- Kan BOX (kan.org.il) — the public website's pages; episodes are plain HLS ---------- */
const KAN = 'https://www.kan.org.il';
let kanBoxCache = null;
const kanClean = t => (t || '').replace(/(small\s*)?poster( image)?( small)?\s*\d+\s*x\s*\d+/gi, '').replace(/\s*-\s*כאן 11$/, '').replace(/\s*לוגו$/, '').trim();
const kanAbs = u => !u ? '' : u.startsWith('http') ? u : KAN + (u.startsWith('/') ? '' : '/') + u;
const kanDoc = async url => new DOMParser().parseFromString(await fetchText(url), 'text/html');

/** Kan BOX sections (דרמה, קומדיה וסאטירה, דוקו, סרטים, ילדים…) -> programmes with posters. */
async function kanBox(){
  if(kanBoxCache) return kanBoxCache;
  const doc = await kanDoc(`${KAN}/lobby/kan-box/`);
  const sections = [];
  for(const h2 of doc.querySelectorAll('h2')){
    const title = h2.textContent.trim();
    if(!title || title.length > 40 || /אולי יעניין/.test(title)) continue;
    let box = h2.parentElement;
    for(let i = 0; i < 6 && box && !box.querySelector('a[href*="/p-"] img'); i++) box = box.parentElement;
    if(!box) continue;
    const progs = new Map();
    for(const a of box.querySelectorAll('a[href]')){
      const m = a.getAttribute('href').match(/\/content\/kan\/[\w-]+\/p-(\d+)\/?$/);
      const img = a.querySelector('img');
      if(!m || !img || progs.has(m[1])) continue;
      const name = kanClean(img.getAttribute('alt') || a.getAttribute('aria-label'));
      if(name) progs.set(m[1], {id: m[1], url: kanAbs(a.getAttribute('href')), name, img: kanAbs(img.getAttribute('data-src') || img.getAttribute('src'))});
    }
    if(progs.size) sections.push({title, items: [...progs.values()]});
  }
  if(!sections.length) throw new Error('לא נמצאו תוכניות');
  return kanBoxCache = sections;
}
function kanCard(x){
  return `<a class="poster" href="#/kan/${encodeURIComponent(x.url.replace(KAN, ''))}/${encodeURIComponent(x.name)}">
    <div class="art" data-bg="${esc(x.img)}"></div><div class="t" dir="auto">${esc(x.name)}</div></a>`;
}

/** Episodes listed on a programme/season page. */
function kanEpisodes(doc, progPath){
  const eps = new Map();
  for(const a of doc.querySelectorAll('a[href]')){
    const href = kanAbs(a.getAttribute('href'));
    if(!href.startsWith(KAN + progPath) || !/\/\d+\/?$/.test(href.slice((KAN + progPath).length))) continue;
    if(eps.has(href)) continue;
    const title = a.querySelector('.card-title')?.textContent.trim() || a.getAttribute('aria-label') || a.textContent.trim().split('\n')[0];
    if(!title || /^לצפייה ב/.test(title.trim())) continue;     // skip "watch the first episode" promo links
    eps.set(href, {url: href, name: title.trim(), text: a.querySelector('.card-text')?.textContent.trim() || '',
                   img: kanAbs(a.querySelector('img')?.getAttribute('src'))});
  }
  return [...eps.values()];
}

/** Episode page -> its HLS URL (no DRM). */
async function kanPlay(url, title){
  try{
    const html = await fetchText(url);
    const m = html.match(/https:\/\/[^"'\s<>]+?\.m3u8[^"'\s<>]*/);
    if(!m) throw new Error('לא נמצא וידאו בעמוד');
    const hls = m[0].replace(/&amp;/g, '&');
    // broadcaster VOD route (no subtitle search, no licence); Kan's player sends its site as referer
    if(window.BoothAndroid && BoothAndroid.playVod) BoothAndroid.playVod(hls, '', title, `${KAN}/`);
    else if(window.BoothAndroid && BoothAndroid.playDrm) BoothAndroid.playDrm(hls, '', title);
    else openPlayer({url: hls}, title, null);
  }catch(e){ alert(`לא ניתן לנגן את הפרק (${e.message}).`); }
}

const metaCache = {};
async function fetchMeta(type, id){
  const key = type + ':' + id;

  for(const a of addons.filter(a => supports(a.manifest, 'meta', type, id))){
    try{ const m = (await getJSON(`${a.base}/meta/${type}/${encodeURIComponent(id)}.json`)).meta; if(m) return metaCache[key] = m; }catch(e){}
  }
  return null;
}

const MAKO = 'https://www.mako.co.il';
const MAKO_GENRES = [['הכל', ''], ['ריאליטי', 'genre&vcmId=4f9dbac980653210VgnVCM2000002a0c10acRCRD'],
  ['דוקומנטרי', 'genre&vcmId=8e8abac980653210VgnVCM2000002a0c10acRCRD'], ['דרמה', 'genre&vcmId=05fcbac980653210VgnVCM2000002a0c10acRCRD'],
  ['קומדיה', 'genre&vcmId=fe2dbac980653210VgnVCM2000002a0c10acRCRD'], ['בישול', 'genre&vcmId=5d738481c9674210VgnVCM2000002a0c10acRCRD'],
  ['החדשות', 'provider&vcmId=ee06c13070733210VgnVCM2000002a0c10acRCRD']];
const makoCache = {};
function nextData(html){
  // slice by index instead of running a lazy regex over ~1MB of HTML
  const start = html.indexOf('<script id="__NEXT_DATA__"');
  const from = start < 0 ? -1 : html.indexOf('>', start) + 1;
  const to = from > 0 ? html.indexOf('<\/script>', from) : -1;
  if(to < 0) throw new Error('לא ניתן לקרוא את העמוד');
  return JSON.parse(html.slice(from, to)).props.pageProps;
}
async function makoPrograms(filter){
  if(makoCache['idx' + filter]) return makoCache['idx' + filter];
  const pp = nextData(await fetchText(`${MAKO}/mako-vod-index${filter ? '?filter=' + filter : ''}`));
  return makoCache['idx' + filter] = (pp.programs?.items || []).map(i => ({name: i.title, path: i.pageUrl, img: i.pic}));
}

function openSite(url){

/** Resolve a category's row specs against the installed add-ons. */
function rowsFor(cat){
  const out = [];
  for(const spec of cat.rows){
    if(!Array.isArray(spec)){ out.push(spec); continue; }       // YouTube row
    const [aid, cid, extra, title] = spec;
    const a = addons.find(x => x.manifest.id === aid);
    if(!a) continue;
    for(const c of a.manifest.catalogs || [])
      if(cid instanceof RegExp ? cid.test(c.id) : c.id === cid) out.push({a, c, extra, title: title || catalogHe(c.name)});
  }
  return out;
}

function renderCats(active){

/** Hero + "continue watching" + a row per catalog; rows load in parallel. */
function renderRows(rows, {hero = true, cont = [], heading = '', top = ''} = {}){
  const app = $('#app');
  app.innerHTML = `${hero ? `<section class="hero" id="hero"><div class="bg skel"></div><div class="beam"></div><div class="copy"><h1>&nbsp;</h1></div></section>` : heading ? `<div class="page"><h1>${esc(heading)}</h1></div>` : '<div style="height:8px"></div>'}
    ${top}
    ${cont.length ? `<div class="row"><h2>המשך צפייה</h2><div class="strip">${cont.map(x => card({id:x.metaId,type:x.type,name:x.name,poster:x.poster})).join('')}</div></div>` : ''}
    ${rows.map((x, i) => `<div class="row"><h2><bdi>${esc(x.title)}</bdi>${x.yt || x.r13 || x.kan || x.merge || /סרט|סדר/.test(x.title) ? '' : ` <small>${esc(typeHe(x.c.type))}</small>`}</h2><div class="strip" id="row${i}">${skeletons(8)}</div></div>`).join('')}
    ${!rows.length ? `<p class="note">אין עדיין קטלוגים. התקן תוסף עם קטלוגים בעמוד <a href="#/addons">התוספים</a>.</p>` : ''}`;
  let heroDone = !hero;
  // Each title appears once per page: it stays in the first (highest) row that has it.
  const claimed = new Map();
  const dedupe = (i, metas) => metas.filter(m => {
    const j = claimed.get(m.id);
    if(j !== undefined && j < i) return false;
    if(j !== undefined && j > i) document.querySelectorAll(`#row${j} [data-id="${CSS.escape(m.id)}"]`).forEach(e => e.remove());
    claimed.set(m.id, i);
    return true;
  });
  rows.forEach(async (x, i) => {
    const el = $('#row' + i);
    if(x.merge){
      try{
        const sc = addons.find(a => a.manifest.id === SC_ID);
        const lists = await Promise.all(x.merge.map(async id => {
          const c = (sc?.manifest.catalogs || []).find(c => c.id === id && c.type === x.type);
          if(!c) return [];
          const metas = (await catalogFetch(sc, c.type, c.id).catch(() => ({metas: []}))).metas || [];
          metas.forEach(m => noteServices(m.id, SERVICES[id]));
          return metas;
        }));
        const merged = [];                                   // round-robin so every service is represented
        for(let k = 0; merged.length < 200 && lists.some(l => l[k]); k++) for(const l of lists) if(l[k] && !merged.some(m => m.id === l[k].id)) merged.push(l[k]);
        if(el) el.innerHTML = dedupe(i, merged).slice(0, rowMax()).map(card).join('') || '<p class="note">אין כרגע.</p>';
      }catch(e){ if(el) el.innerHTML = `<p class="err">לא ניתן לטעון (${esc(e.message)}).</p>`; }
      return;
    }
    if(x.kan){
      try{
        const secs = await kanBox();
        const sec = secs.find(z => x.kan.test(z.title));
        el.innerHTML = sec ? sec.items.slice(0, rowMax()).map(kanCard).join('') : '<p class="note">אין כרגע.</p>';
      }catch(e){ if(el) el.innerHTML = `<p class="err">לא ניתן לטעון מכאן (${esc(e.message)}).</p>`; }
      return;
    }
    if(x.r13){
      try{ el.innerHTML = (await r13row(x.r13)).slice(0, rowMax()).map(r13card).join('') || '<p class="note">אין כרגע.</p>'; }
      catch(e){ if(el) el.innerHTML = `<p class="err">לא ניתן לטעון מרשת 13 (${esc(e.message)}).</p>`; }
      return;
    }
    if(x.yt){
      try{ el.innerHTML = (await ytRow(x.yt, x.ch)).slice(0, 30).map(ytCard).join('') || '<p class="note">אין כרגע.</p>'; }
      catch(e){ if(el) el.innerHTML = `<p class="err">לא ניתן לטעון מ־YouTube (${esc(e.message)}).</p>`; }
      return;
    }
    try{
      const d = await catalogFetch(x.a, x.c.type, x.c.id, x.extra);
      const metas = d.metas || [];
      if(el) el.innerHTML = dedupe(i, metas).slice(0, rowMax()).map(card).join('') || '<p class="note">הקטלוג ריק.</p>';
      if(!heroDone && metas.length){ heroDone = true; renderHero(metas.find(m => m.background) || metas[0]); }
    }catch(e){ if(el) el.innerHTML = `<p class="err">לא ניתן לטעון את הקטלוג (${esc(e.message)}).</p>`; }
  });
}

/* ---------- sources: pick the best automatically ---------- */
const GB = 1024 ** 3;
let streamsToken = 0;
const fmtSize = b => b >= GB ? (b / GB).toFixed(1) + ' GB' : Math.round(b / 1024 ** 2) + ' MB';
const isCam = s => /\b(hd)?cam(rip)?\b|\b(hd)?ts\b|telesync|\bscr\b|screener|\btc\b|telecine/i.test(`${s.name || ''}\n${s.title || s.description || ''}`);

/** Pull quality, seeders, size, provider and tags out of a Stremio stream (Torrentio format, with fallbacks). */
function parseStream(s, addon, i){
  const title = s.title || s.description || '';
  const text = `${s.name || ''}\n${title}\n${s.behaviorHints?.filename || ''}`.toLowerCase();
  const q = /\b(hd)?cam(rip)?\b|\b(hd)?ts\b|telesync|\bscr\b|screener|\btc\b|telecine/.test(text) ? 'CAM'
    : /2160p|\b4k\b|\buhd\b/.test(text) ? '4K'
    : /1080p/.test(text) ? '1080p'
    : /720p/.test(text) ? '720p'
    : /480p|576p|360p|\bsd\b|dvdrip|xvid/.test(text) ? 'SD' : 'Other';
  const seeds = title.match(/👤\s*(\d+)/)?.[1];
  const sm = title.match(/💾\s*([\d.,]+)\s*([KMGT])i?B/i);
  const size = sm ? parseFloat(sm[1].replace(',', '.')) * 1024 ** ('KMGT'.indexOf(sm[2].toUpperCase()) + 1)
                  : (s.behaviorHints?.videoSize || null);
  const tags = [[/\b(dv|dovi|dolby.?vision)\b/, 'DV'], [/\bhdr(10\+?)?(?![a-z])/, 'HDR'], [/x265|hevc|h\.?265/, 'HEVC'],
                [/remux/, 'REMUX'], [/\b3d\b/, '3D']].filter(([re]) => re.test(text)).map(([, t]) => t);
  return {
    s, addon, i, q, size, tags,
    seeds: seeds != null ? +seeds : null,
    provider: (title.match(/⚙️\s*([^\n]+)/)?.[1] || '').trim(),
    flags: title.match(/[\u{1F1E6}-\u{1F1FF}]{2}/gu) || [],
    name: (title.split('\n')[0] || s.name || addon).trim(),
    direct: !!(s.url || s.externalUrl || s.ytId),
  };
}

/** How good a source is to stream on a phone/TV: direct links first, then well-seeded 1080p. */
function rank(x){
  if(x.direct) return 1e9;
  const seeds = x.seeds ?? 0;
  if(seeds < 1) return -1;
  const quality = {'1080p': 1, '720p': .85, '4K': .75, 'SD': .45, 'Other': .35}[x.q] ?? .3;
  const size = x.size && x.size > 20 * GB ? .5 : 1;        // huge remuxes stall when streamed
  return Math.log10(seeds + 1) * quality * size;
}

function playStream(s, label, ctx){
  // Release/file name lets the app pick Hebrew subtitles timed for this exact release.
  const release = s.behaviorHints?.filename || (s.title || s.description || '').split('\n')[0] || '';
  const vid = ctx.videoId || '';
  // what is playing (for "continue watching") and where to resume from
  const meta = JSON.stringify({metaId: ctx.meta?.id || vid, type: ctx.type || 'movie', name: ctx.meta?.name || label, poster: ctx.meta?.poster || ''});
  const done = progress[vid];
  const pos = done && done.d && done.t < done.d - 60 ? Math.floor(done.t * 1000) : 0;
  if(s.url && window.BoothAndroid) BoothAndroid.playUrl(s.url, label, vid, release, meta, pos);
  else if(s.url || s.ytId) openPlayer(s, label, ctx);
  else if(s.externalUrl && window.BoothAndroid) BoothAndroid.playUrl(s.externalUrl, label, vid, release, meta, 0);
  else if(s.externalUrl) window.open(s.externalUrl, '_blank', 'noopener');
  else if(s.infoHash && window.BoothAndroid) BoothAndroid.playTorrent(s.infoHash, Number.isInteger(s.fileIdx) ? s.fileIdx : -1, label, JSON.stringify(s.sources || []), vid, release, meta, pos);
  else alert('מקורות טורנט מתנגנים באפליקציית המקרן לאנדרואיד.');
}

function renderStreams(box, all, pending, label, ctx, errors = [], retry){
  const list = all.filter(x => x.q !== 'CAM' && rank(x) >= 0).sort((a, b) => rank(b) - rank(a));
  const best = list[0];
  if(!best){
    if(!pending && errors.length){
      box.innerHTML = `<div class="play"><button class="playbtn" disabled>לא ניתן לטעון מקורות</button>
        <p class="err" style="margin:0">${errors.map(esc).join('<br>')}</p><button class="btn ghost" id="sretry">נסה שוב</button></div>`;
      $('#sretry').onclick = retry;
      return;
    }
    box.innerHTML = `<div class="play"><button class="playbtn" disabled>${pending ? 'מחפש מקורות…' : 'אין מקורות זמינים כרגע'}</button></div>`;
    return;
  }
  const byQuality = ['4K', '1080p', '720p', 'SD'].map(q => list.find(x => x.q === q)).filter(Boolean);
  const detail = x => [x.q === 'Other' ? '' : x.q, x.size && fmtSize(x.size)].filter(Boolean).join(' · ');
  box.innerHTML = `<div class="play">
      <button class="playbtn" data-i="${best.i}">▶ נגן <small>${esc(detail(best))}</small></button>
      ${byQuality.length > 1 ? `<div class="quals" role="group" aria-label="איכות">${byQuality.map(x => `<button data-i="${x.i}">${x.q}</button>`).join('')}</div>` : ''}
      ${list.length > 1 ? `<details class="alt"><summary>מקורות נוספים (${list.length - 1})</summary>
        ${list.slice(1, 40).map(x => `<button class="srow" data-i="${x.i}"><b>${x.q === 'Other' ? '—' : x.q}</b><span>${x.size ? fmtSize(x.size) : ''}</span><span>${x.direct ? 'ישיר' : '👤 ' + (x.seeds ?? 0)}</span></button>`).join('')}
      </details>` : ''}
      ${pending ? '<p class="note" style="margin:0">מחפש מקורות נוספים…</p>' : ''}
    </div>`;
  box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => playStream(all[b.dataset.i].s, label, ctx));
}

async function loadStreams({type, meta}, videoId, label){
  const box = $('#streams');
  const src = addons.filter(a => supports(a.manifest, 'stream', type, videoId));
  if(!src.length){ box.innerHTML = `<p class="note">לא מותקן תוסף מקורות. אפשר להוסיף אחד בעמוד <a href="#/addons">התוספים</a>.</p>`; return; }
  const token = ++streamsToken;
  const ctx = {videoId, type, meta};
  const all = [], errors = [];
  let pending = src.length;
  const retry = () => loadStreams({type, meta}, videoId, label);
  const render = () => { if(token === streamsToken && box.isConnected) renderStreams(box, all, pending > 0, label, ctx, errors, retry); };
  render();
  await Promise.all(src.map(async a => {
    const url = `${a.base}/stream/${type}/${encodeURIComponent(videoId)}.json`;
    try{
      let d;
      try{ d = await getJSON(url); }
      catch(e){ await new Promise(r => setTimeout(r, 1500)); d = await getJSON(url); }   // one quiet retry
      for(const s of d.streams || []) all.push(parseStream(s, a.manifest.name, all.length));
    }catch(e){ errors.push(`${a.manifest.name}: ${e.message || 'אין תגובה'}`); }
    pending--;
    render();
  }));
  if(type === 'movie' && !errors.length) setAvail(`${type}:${meta.id}`, all.some(x => x.q !== 'CAM' && rank(x) >= 0));
}

/* ---------- which titles have sources (greys out / hides the rest) ---------- */
let avail = store.get('avail', {});                 // "type:tt…" -> [ok, checkedAt, emptyAnswers]
if(store.get('availRev', 0) < 1){ avail = {}; store.set('avail', avail); store.set('availRev', 1); }   // 0.11/0.12 results may be wrong
const AVAIL_TTL = 3 * 864e5;
const availPending = new Set();
let availBusy = false;
const isNoSrc = e => e && !e[0] && (e[2] || 0) >= 2;
// known = available (fresh), or confirmed empty twice (fresh); a single empty answer is re-checked after 10 minutes
const availKnown = k => { const e = avail[k]; if(!e) return false; const age = Date.now() - e[1];
  return e[0] || isNoSrc(e) ? age < AVAIL_TTL : age < 6e5; };
function setAvail(key, ok){
  const prev = avail[key];
  avail[key] = ok ? [true, Date.now(), 0] : [false, Date.now(), prev && !prev[0] ? (prev[2] || 1) + 1 : 1];
  store.lazy('avail', capMap(avail, 2000));
  const none = isNoSrc(avail[key]);
  document.querySelectorAll(`[data-avail="${key}"]`).forEach(el => el.classList.toggle('nosrc', none));
}
async function hasSources(key){
  const [type, id] = key.split(':');
  const vid = type === 'series' ? `${id}:1:1` : id;          // a series counts as available if S1E1 is
  for(const a of addons.filter(a => supports(a.manifest, 'stream', type, vid))){
    try{
      const d = await getJSON(`${a.base}/stream/${type}/${encodeURIComponent(vid)}.json`);
      if((d.streams || []).some(s => !isCam(s))) return true;
    }catch(e){ return null; }                                 // unknown: don't grey out on a network error
  }
  return false;
}
let availScreen = 0;                                          // how many probes this screen already used
addEventListener('hashchange', () => { availPending.clear(); availScreen = 0; });
function queueAvail(keys){
  if(isTvLayout()) return;                                   // TV boxes: skip background source checks
  if(availScreen > 40) return;                               // and never turn a screen into a request storm
  availScreen += keys.length;
  for(const k of keys) if(!availKnown(k)) availPending.add(k);
  if(!availBusy) availFlush();
}
async function availFlush(){
  availBusy = true;
  while(availPending.size){
    const batch = [...availPending].slice(0, 2);          // gentle on the stream add-on
    batch.forEach(k => availPending.delete(k));
    await Promise.all(batch.map(async k => { const ok = await hasSources(k); if(ok !== null) setAvail(k, ok); }));
    await new Promise(r => setTimeout(r, 300));
  }
  availBusy = false;
}
const availObserver = new IntersectionObserver(entries => {
  const keys = [];
  for(const en of entries) if(en.isIntersecting){ availObserver.unobserve(en.target); keys.push(en.target.dataset.avail); }
  if(keys.length) queueAvail(keys);
}, {rootMargin: '300px'});
new MutationObserver(muts => {
  const now = [];
  for(const m of muts) for(const n of m.addedNodes){
    if(n.nodeType !== 1) continue;
    for(const el of n.matches('[data-avail]') ? [n] : n.querySelectorAll('[data-avail]')){
      if(availKnown(el.dataset.avail)) continue;
      if([...el.parentNode.children].indexOf(el) < 6) now.push(el.dataset.avail); else availObserver.observe(el);
    }
  }
  if(now.length) queueAvail(now);
}).observe(document.body, {childList: true, subtree: true});

function viewLibrary(){
  const items = Object.values(library).sort((a,b) => b.added - a.added);
  $('#app').innerHTML = `<div class="page"><h1>הספרייה</h1>${items.length ? `<div class="grid">${items.map(card).join('')}</div>` : `<p class="note">הספרייה ריקה. פתח כותר ובחר „הוסף לספרייה”.</p>`}</div>`;
}

/** Text fetch through the Android app when available (no CORS, reaches LAN devices like a Raspberry Pi). */
const nativeCallbacks = {};
window.boothFetchDone = (id, ok, body) => {
  const cb = nativeCallbacks[id]; delete nativeCallbacks[id];
  if(cb) ok ? cb.res(body) : cb.rej(new Error(body));
};
function fetchText(url){
  if(window.BoothAndroid && BoothAndroid.fetchText) return new Promise((res, rej) => {
    const id = 'f' + Math.random().toString(36).slice(2);
    nativeCallbacks[id] = {res, rej};
    BoothAndroid.fetchText(url, id);
  });
  return fetchTimed(url, 15000).then(r => { if(!r.ok) throw new Error(r.status + ' from ' + new URL(url).host); return r.text(); });
}

function parseM3U(text){
  const out = [];
  let cur = null;
  for(const raw of text.split(/\r?\n/)){
    const line = raw.trim();
    if(!line) continue;
    if(line.startsWith('#EXTINF')){
      const attr = k => { const m = line.match(new RegExp(k + '=(?:"([^"]*)"|([^\\s,]+))')); return m ? (m[1] ?? m[2] ?? '') : ''; };
      const bare = line.replace(/[\w-]+="[^"]*"/g, '');
      cur = {name: bare.slice(bare.indexOf(',') + 1).trim() || 'ערוץ', logo: attr('tvg-logo'),
             group: attr('group-title') || 'ערוצים', ua: attr('http-user-agent'), referer: attr('http-referrer'),
             epg: attr('tvg-id'), rec: parseInt(attr('tvg-rec')) || 0};
    } else if(line.startsWith('#EXTVLCOPT:')){
      if(!cur) continue;
      const [k, ...v] = line.slice(11).split('=');
      if(k === 'http-user-agent') cur.ua = v.join('=');
      if(k === 'http-referrer') cur.referer = v.join('=');
    } else if(line.startsWith('#EXTGRP:')){
      if(cur) cur.group = line.slice(8).trim();
    } else if(!line.startsWith('#')){
      out.push(cur ? {...cur, url: line} : {name: line.split('/').pop(), group: 'ערוצים', url: line});
      cur = null;
    }
  }
  return out;
}

/* ---------- RaspberryTV: live channels + catch-up with the subscriber's access key ----------
   Same service API the OTT-Play app uses: the playlist is keyed by the 8-character access key,
   streams are Flussonic-style (index.m3u8 / index-<start>-<duration>.m3u8) with a per-user token,
   and the programme guide comes from protected-api.com. The key is stored only on this device. */
const RTV_PLAYLIST = key => `https://play-berry.net/playlist/${encodeURIComponent(key)}.m3u8`;
const RTV_EPG = id => `http://protected-api.com/epg/${encodeURIComponent(id)}?date=`;
let rtvCache = null;

async function loadRtv(){
  const key = store.get('rtvKey', '');
  if(!key) return null;
  if(rtvCache) return rtvCache;
  const chans = parseM3U(await fetchText(RTV_PLAYLIST(key)));
  for(const c of chans){
    // Live plays the playlist URL exactly as given. For catch-up, recognise the service's
    // http://server:port/<path>/<token>/<channel>.m3u8 layout (as OTT-Play does).
    const m = c.url.match(/^https?:\/\/([^/:]+)(?::\d+)?\/[^/]+\/([^/]+)\/([^/.?]+)\.m3u8/);
    if(m){ c.server = m[1]; c.token = m[2]; c.cid = m[3]; }
    c.ua ||= BROWSER_UA;                      // some IPTV servers turn away the player's default agent
  }
  if(!chans.length) throw new Error('הרשימה ריקה. ודא שהמנוי פעיל ושהקוד נכון');
  return rtvCache = chans;
}

const BROWSER_UA = 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36';

/** Flussonic-style catch-up URL: timeshift for the last minutes, otherwise a start+duration window. */
function rtvArchiveUrl(c, start, end){
  const now = Date.now() / 1000;
  start = Math.floor(start);
  if(!end || end <= start) end = now + 600;
  const file = start > now - 600 ? `timeshift_abs-${start}.m3u8` : `index-${start}-${Math.floor(end - start)}.m3u8`;
  if(c.cid) return `http://${c.server}:80/${c.cid}/${file}?token=${c.token}`;
  // otherwise swap the file name of the live URL (…/<channel>/index.m3u8?token=… style)
  const [path, query] = c.url.split('?');
  return path.replace(/[^/]+$/, file) + (query ? '?' + query : '');
}

const DAY_NAMES = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
const hhmm = t => new Date(t * 1000).toLocaleTimeString('he-IL', {hour: '2-digit', minute: '2-digit'});
const dayKey = t => new Date(t * 1000).toDateString();

/** Channel sheet: watch live, or pick a past programme from the guide (catch-up). */
async function openChannel(c){
  document.querySelector('.sheet')?.remove();
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = `<div role="dialog" aria-modal="true" aria-label="${esc(c.name)}">
      <header>${c.logo ? `<img src="${esc(c.logo)}" alt="">` : ''}<b>${esc(c.name)}</b><button aria-label="סגור">✕</button></header>
      <div class="body"><button class="playbtn" id="goLive">▶ שידור חי</button>
        ${c.rec ? `<div id="guide"><p class="note">טוען את לוח השידורים…</p></div>` : ''}</div></div>`;
  document.body.appendChild(sheet);
  const close = () => sheet.remove();
  sheet.querySelector('header button').onclick = close;
  sheet.onclick = e => { if(e.target === sheet) close(); };
  sheet.querySelector('#goLive').onclick = () => { close(); playLive(c); };
  sheet.querySelector('#goLive').focus();
  if(!c.rec) return;

  const guide = sheet.querySelector('#guide');
  const now = Date.now() / 1000, from = now - c.rec * 86400;
  let progs = [];
  try{
    const d = JSON.parse(await fetchText(RTV_EPG(c.epg)));
    progs = (Array.isArray(d) ? d : []).map(g => ({t: +g.time, to: +g.time_to, name: g.name || '', descr: g.descr || ''}))
      .filter(g => g.t && g.to > from && g.t < now + 3 * 3600).sort((a, b) => a.t - b.t);
  }catch(e){ /* no guide: fall back to picking a time */ }

  if(!progs.length){
    // No programme guide: jump back by time instead.
    guide.innerHTML = `<p class="note" style="margin:0">אין לוח שידורים לערוץ הזה. אפשר לחזור אחורה לפי שעה (עד ${c.rec} ימים):</p>
      <div class="keyform"><input class="field" type="datetime-local" id="tpick" dir="ltr"><button class="btn primary" id="tgo">נגן מהשעה הזו</button></div>`;
    const pad = n => String(n).padStart(2, '0');
    const d = new Date(Date.now() - 3600e3);
    sheet.querySelector('#tpick').value = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    sheet.querySelector('#tgo').onclick = () => {
      const t = new Date(sheet.querySelector('#tpick').value).getTime() / 1000;
      if(!t || t < from || t > now) return alert(`אפשר לבחור זמן מ־${c.rec} הימים האחרונים בלבד.`);
      close(); playLive({...c, url: rtvArchiveUrl(c, t, t + 3 * 3600), name: `${c.name} · ${hhmm(t)}`});
    };
    return;
  }

  const days = [...new Set(progs.map(g => dayKey(g.t)))];
  const today = new Date().toDateString(), yesterday = new Date(Date.now() - 864e5).toDateString();
  const dayLabel = k => k === today ? 'היום' : k === yesterday ? 'אתמול' : `יום ${DAY_NAMES[new Date(k).getDay()]}`;
  let sel = today in Object.fromEntries(days.map(k => [k, 1])) ? today : days[days.length - 1];
  const draw = () => {
    const list = progs.filter(g => dayKey(g.t) === sel);
    guide.innerHTML = `<div class="days">${days.map(k => `<button class="${k === sel ? 'on' : ''}" data-day="${esc(k)}">${dayLabel(k)}</button>`).join('')}</div>
      <div>${list.map((g, i) => {
        const state = g.t > now ? 'future' : g.to > now ? 'now' : '';
        return `<button class="prog ${state}" data-p="${progs.indexOf(g)}" ${state === 'future' ? 'disabled' : ''} title="${esc(g.descr)}"><time>${hhmm(g.t)}</time><span>${esc(g.name)}${state === 'now' ? ' · עכשיו' : ''}</span></button>`;
      }).join('')}</div>`;
    guide.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { sel = b.dataset.day; draw(); });
    guide.querySelectorAll('.prog:not(.future)').forEach(b => b.onclick = () => {
      const g = progs[b.dataset.p];
      close();
      playLive({...c, url: rtvArchiveUrl(c, g.t, g.to), name: `${c.name} · ${g.name}`});
    });
    guide.querySelector('.prog.now')?.scrollIntoView({block: 'center'});
  };
  draw();
}

  const app = $('#app');

  let sel = store.get('livePl', sources[0].key);
  if(!sources.some(x => x.key === sel)) sel = sources[0].key;
  app.innerHTML = `<div class="page"><h1>שידור חי</h1>
    <div class="live-top">
      ${sources.length > 1 ? sources.map(x => `<button class="chip ${x.key === sel ? 'on' : ''}" data-pl="${esc(x.key)}">${esc(x.name)}</button>`).join('') : ''}
      <input class="field" id="lq" type="search" placeholder="חיפוש ערוץ" aria-label="חיפוש ערוץ">
      <select class="field" id="lg" aria-label="קבוצה" hidden></select>
    </div>
    <div id="cont"></div>
    <div id="chs"><p class="note">טוען ערוצים…</p></div>
    ${store.get('rtvKey', '') ? '' : `<p class="note" style="margin-top:24px">מנוי RaspberryTV? הזן את קוד הגישה פעם אחת ב<a href="#/settings">הגדרות</a>.</p>`}</div>`;
  app.querySelectorAll('[data-pl]').forEach(b => b.onclick = () => { store.set('livePl', b.dataset.pl); store.set('liveGroup', ''); viewLive(); });

  let chans;
  try{ chans = await liveChannels(sel); }
  catch(err){ $('#chs').innerHTML = `<p class="err">לא ניתן לטעון את הערוצים (${esc(err.message)}).</p>`; return; }

  const groups = [...new Set(chans.map(c => c.group))];
  const liveGroup = store.get('liveGroup', '');
  if(groups.length > 1){
    $('#lg').hidden = false;
    $('#lg').innerHTML = `<option value="">כל הערוצים (${chans.length})</option>` + groups.map(g => `<option ${g === liveGroup ? 'selected' : ''}>${esc(g)}</option>`).join('');
  }

  const last = store.get('lastChannel', null);
  const lastIdx = last && last.src === sel ? chans.findIndex(c => c.name === last.name) : -1;
  $('#cont').innerHTML = lastIdx >= 0 ? `<button class="continue" id="goLast">▶ המשך לצפות · <span>${esc(chans[lastIdx].name)}</span></button>` : '';
  if(lastIdx >= 0) $('#goLast').onclick = () => watchChannel(chans, lastIdx, sel);

  const initials = c => esc(c.name.replace(/[^\p{L}\p{N}]/gu, '').slice(0, 2));
  const numbers = new Map(chans.map((c, i) => [c, i + 1]));   // channel number without scanning the list per row
  let nowIo = null;
  const draw = () => {
    nowIo?.disconnect();
    const q = $('#lq').value.trim().toLowerCase(), g = $('#lg').hidden ? '' : $('#lg').value;
    const list = chans.filter(c => (!g || c.group === g) && (!q || c.name.toLowerCase().includes(q)));
    $('#chs').innerHTML = list.length ? `<div class="chlist">${list.map((c, i) => `<div class="chrow">
        <button class="chmain" data-i="${i}"><span class="chnum">${numbers.get(c)}</span>
          <span class="chlogo">${c.logo ? `<img src="${esc(c.logo)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{textContent:'${initials(c)}'}))">` : `<span>${initials(c)}</span>`}</span>
          <span class="chinfo"><b>${esc(c.name)}</b><small data-now="${i}">${c.epg ? '' : esc(c.group || '')}</small></span></button>
        ${c.rec ? `<button class="chback" data-back="${i}" aria-label="צפייה אחורה ב${esc(c.name)}" title="צפייה אחורה (${c.rec} ימים)">⟲</button>` : ''}
      </div>`).join('')}</div>` : '<p class="note">אין ערוצים שמתאימים.</p>';
    $('#chs').querySelectorAll('[data-i]').forEach(b => {
      const c = list[b.dataset.i];
      let longPressed = false, timer = null;
      b.onclick = () => { if(longPressed){ longPressed = false; return; } watchChannel(list, +b.dataset.i, sel); };
      if(!c.rec) return;
      // Long press (touch, or holding OK on a remote) opens catch-up: the week's programme guide.
      const openBack = () => { longPressed = true; openChannel(c); };
      b.oncontextmenu = e => { e.preventDefault(); openBack(); };
      b.onpointerdown = () => { longPressed = false; clearTimeout(timer); timer = setTimeout(openBack, 600); };
      b.onpointerup = b.onpointerleave = b.onpointercancel = () => clearTimeout(timer);
      b.onkeydown = e => { if(e.key === 'Enter' && e.repeat && !longPressed){ e.preventDefault(); openBack(); } };
    });
    $('#chs').querySelectorAll('[data-back]').forEach(b => b.onclick = () => openChannel(list[b.dataset.back]));
    // "now playing" line for visible channels
    const showNow = async el => {
      const p = await nowPlaying(list[el.dataset.now]);
      if(!p || !el.isConnected || el.dataset.done) return;
      el.dataset.done = 1;
      const pct = Math.max(0, Math.min(100, (Date.now() / 1000 - p.t) / (p.to - p.t) * 100));
      el.textContent = `${p.name} · ${hhmm(p.t)}–${hhmm(p.to)}`;
      el.insertAdjacentHTML('afterend', `<span class="bar"><i style="width:${pct.toFixed(0)}%"></i></span>`);
    };
    nowIo = new IntersectionObserver(entries => {
      for(const en of entries) if(en.isIntersecting){ nowIo.unobserve(en.target); showNow(en.target); }
    }, {rootMargin: '200px'});
    list.forEach((c, i) => {
      if(!c.epg) return;
      const el = $('#chs').querySelector(`[data-now="${i}"]`);
      if(i < 12) showNow(el); else nowIo.observe(el);
    });
  };
  let typing = null;
  $('#lq').oninput = () => { clearTimeout(typing); typing = setTimeout(draw, 200); };   // playlists can hold thousands
  $('#lg').onchange = () => { store.set('liveGroup', $('#lg').value); draw(); };
  draw();
}
