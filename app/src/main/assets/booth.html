<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=Rubik:wght@500;700;800&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// Apply saved skin/layout/language before first paint (Settings page). TV devices default to the TV layout.
const RTL_LANGS = ['he', 'ar', 'fa', 'ur'];
const dirOf = l => RTL_LANGS.includes(l) ? 'rtl' : 'ltr';
try{
  const s = JSON.parse(localStorage.getItem('booth:settings') || '{}'), r = document.documentElement;
  r.lang = s.uiLang || 'he'; r.dir = dirOf(r.lang);
  const tv = !!(window.BoothAndroid && BoothAndroid.isTv && BoothAndroid.isTv());
  r.dataset.skin = s.skin || 'veo'; r.dataset.layout = s.layout || (tv ? 'tv' : 'cinema'); r.dataset.poster = s.poster || 'm'; r.dataset.nosrc = s.nosrc || 'grey';
}catch(e){}
</script>
<style>
:root{
  --flip:1;   /* 1 in right-to-left, -1 in left-to-right: mirrors physical offsets that logical properties cannot express */
  --night:#14161f; --surface:#1d2130; --raise:#272c3f; --line:#323850;
  --light:#efe6cf; --muted:#8e93a8; --tungsten:#f0b429; --velvet:#a3384b;
  --on-accent:#14161f; --text2:#d4cdb9; --err:#ff9d8a; --ghost:rgba(239,230,207,.1);
  --shade-55:rgba(20,22,31,.55); --shade-50:rgba(20,22,31,.5); --shade-20:rgba(20,22,31,.2);
  --glow:rgba(240,180,41,.45); --glow-soft:rgba(240,180,41,.35); --beam:rgba(240,180,41,.13);
  --poster-w:132px;
  --display:"Bricolage Grotesque","Rubik",system-ui,sans-serif;
  --body:"Figtree","Heebo",system-ui,sans-serif;
}
:root[dir="ltr"]{--flip:-1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--light);font-family:var(--body);font-size:15px;line-height:1.5}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tungsten);outline-offset:2px}
img{max-width:100%;display:block}

/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:12px 28px;background:var(--night);border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.logo svg{flex:none;transform:scaleX(-1)}   /* beam points toward the menu in RTL */
.nav{display:flex;gap:4px}
.nav a{text-decoration:none;padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:500}
.nav a.on{color:var(--light);background:var(--raise)}
.search{flex:0 1 300px;min-width:150px;margin-inline-start:auto;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding-block:4px;padding-inline:16px 4px;width:min(340px,40vw)}
.search input{flex:1;background:none;border:0;outline:0;min-width:0}
.search:focus-within{border-color:var(--tungsten);box-shadow:0 0 0 2px var(--tungsten)}
[data-layout="tv"] .search:focus-within{box-shadow:0 0 0 4px var(--tungsten)}
.search button{background:var(--tungsten);color:var(--on-accent);border:0;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}

main{padding:0 28px 60px}

/* hero: projector beam */
.hero{position:relative;margin:0 -28px 32px;min-height:46vh;display:flex;align-items:flex-end;overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center 25%;filter:saturate(.85)}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:
  linear-gradient(calc(180deg + 90deg * var(--flip)),var(--night) 8%,var(--shade-55) 45%,transparent 75%),
  linear-gradient(0deg,var(--night) 2%,transparent 45%)}
.hero .beam{display:none;position:absolute;z-index:1;left:-10%;transform:scaleX(-1);top:-30%;width:70%;height:160%;background:conic-gradient(from 200deg at 100% 0%,transparent 0deg,var(--beam) 14deg,transparent 30deg);pointer-events:none}
.hero .copy{position:relative;z-index:2;flex:1;min-width:0;padding:0 28px 48px;max-width:760px}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,56px);line-height:1.05;letter-spacing:-.02em;margin:0 0 12px}
.hero p{color:var(--text2);max-width:56ch;margin:0 0 18px;font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 22px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--tungsten);color:var(--on-accent)}
.btn.ghost{background:var(--ghost);color:var(--light)}
.btn.ghost.saved{background:var(--velvet)}

/* rows and posters */
.row{margin-bottom:34px}
.row h2,.page h1{font-family:var(--display);font-weight:700;letter-spacing:-.02em;margin:0 0 12px}
.row h2{font-size:22px}
.row h2 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-inline-start:8px}
.strip{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.strip{scrollbar-width:none} .strip::-webkit-scrollbar{width:0;height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--poster-w),1fr));gap:22px 16px}
.poster{flex:0 0 var(--poster-w);scroll-snap-align:start;text-decoration:none;display:block}
.poster .art{aspect-ratio:2/3;border-radius:6px;background:var(--surface) center/cover;position:relative;overflow:hidden;transition:transform .2s}
.poster:hover .art,.poster:focus-visible .art{transform:translateY(-2px)}
.poster .t{margin-top:8px;font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.poster .y{color:var(--muted);font-size:13px}
.poster .t .rate{margin-inline-start:6px;font-size:11px;font-weight:600;white-space:nowrap}
.sortnote{margin:-6px 0 14px;color:var(--muted);font-size:13px}
.poster .track{position:absolute;inset-inline:0;bottom:0;height:5px;background:var(--shade-55)}
.poster .track i{display:block;height:100%;background:var(--tungsten)}
.poster .seen{position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;background:var(--tungsten);color:var(--on-accent);font-size:13px;font-weight:700;line-height:1}
[data-layout="tv"] .poster .seen{width:28px;height:28px;font-size:16px}
[data-layout="tv"] .poster .track{height:6px}
.poster.watched .art{opacity:.75}
.noart{display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font-family:var(--display);color:var(--muted)}

/* page filters */
.page{padding-top:12px}
.page h1{font-size:40px}
.field{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.more{margin:28px auto 0;display:block}

/* detail */
.detail{display:grid;grid-template-columns:260px 1fr;gap:40px;position:relative;z-index:2;margin-top:-30vh;padding-top:12px}
.detail .poster-lg{border-radius:8px;aspect-ratio:2/3;background:var(--surface) center/cover;box-shadow:0 20px 50px -10px #000}
.detail h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4vw,48px);line-height:1.05;letter-spacing:-.02em;margin:0 0 12px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.facts span{background:var(--raise);border-radius:4px;padding:3px 9px;font-size:13px;color:var(--text2)}
.facts .imdb{font-weight:600}
.desc{max-width:68ch;color:var(--text2)}
.people{color:var(--muted);font-size:14px;margin:12px 0 22px;max-width:68ch}
.people b{color:var(--light);font-weight:500}
.backdrop{height:50vh;margin:0 -28px;background-size:cover;background-position:center 20%;position:relative}
.backdrop::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--night) 12%,var(--shade-50) 60%,var(--shade-20))}
.dinfo{min-width:0}
.dinfo .playrow{margin:10px 0}
.dinfo .playrow .btn{margin-inline-start:2px}
.dinfo .src{display:block;margin:-6px 0 8px;font-size:12px;color:var(--muted)}
.dinfo .src a{color:var(--muted)}
[data-layout="tv"] .desc .readmore{display:none}
.psrc{display:contents}
.epanel{margin-top:22px}
.panel{background:var(--surface);border-radius:10px;padding:18px}
.panel h3{margin:0 0 12px;font-family:var(--display);font-size:19px}
.eps{overflow:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:none}
.eps::-webkit-scrollbar{width:0}
.ep{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;text-align:start;background:none;border:0;border-radius:6px;padding:6px 8px;cursor:pointer;color:var(--light);font-size:15px}
.ep>span:last-child{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:12px;min-width:0}
.ep>span:last-child>div:first-child{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep.seen .n::after{content:'✓';display:block;font-size:11px;color:var(--muted)}
.ep.seen>span>div:first-child{color:var(--muted)}
.ep .bar{flex:0 0 100%;position:static;padding:0;border:0;height:3px;border-radius:2px;background:var(--line);margin-top:4px}
.ep .bar>i{display:block;height:100%;border-radius:2px;background:var(--tungsten)}
/* something did not load: say so once, with a way to try again */
.oops{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--raise);color:var(--muted);font-size:14px}
.oops button{background:none;border:1px solid var(--line);color:var(--light);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
.oops button:focus-visible,.oops button:hover{border-color:var(--tungsten);color:var(--tungsten)}
#offbar{position:fixed;inset-inline:0;bottom:0;z-index:60;display:none;gap:12px;align-items:center;justify-content:center;
  padding:10px 16px;background:#7a1f1f;color:#fff;font:14px/1.4 var(--body)}
#offbar.on{display:flex}
.ep:hover{background:var(--raise)} .ep.on{background:var(--raise);box-shadow:inset calc(-3px * var(--flip)) 0 var(--tungsten)}
.ep .n{font-family:var(--display);font-weight:700;color:var(--tungsten)}
.ep .d{font-size:12px;color:var(--muted)}

/* sources: Play, the quality shortcuts and the rest of the list share one row */
.panel{min-width:0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--tungsten);border-color:var(--tungsten);color:var(--on-accent);font-weight:600}
.playrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.playbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:7px 16px;background:var(--tungsten);color:var(--on-accent);font-size:15px;font-weight:600;cursor:pointer}
.playbtn small{font-weight:400;font-size:12px;opacity:.75}
[data-layout="tv"] .playbtn{font-size:16px;padding:8px 18px}
.qbtn{border:1px solid var(--line);background:none;color:var(--light);border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer}
.qbtn:hover,.qbtn:focus-visible{border-color:var(--tungsten)}
.playrow .btn{padding:6px 14px;font-size:14px}
[data-layout="tv"] .qbtn,[data-layout="tv"] .playrow .btn{font-size:14px}
[data-layout="tv"] .playrow .btn{padding:5px 12px}
[data-layout="tv"] .qbtn{padding:4px 10px}
.altbtn{background:none;border:0;padding:8px 6px;color:var(--muted);font-size:14px;cursor:pointer;font-family:inherit}
.altbtn::after{content:" ▾"}
.altbtn[aria-expanded="true"]{color:var(--light)}
.altbtn[aria-expanded="true"]::after{content:" ▴"}
.altlist{margin-top:8px;max-height:30vh;overflow:auto;scrollbar-width:none}
.altlist::-webkit-scrollbar{width:0}
.srow{display:flex;gap:12px;width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);background:none;color:var(--light);padding:10px 4px;cursor:pointer;font-size:14px}
.srow:hover,.srow:focus-visible{background:var(--raise)}
.srow b{flex:0 0 52px;font-weight:600}
.srow span{color:var(--muted);font-variant-numeric:tabular-nums}
.srcstat{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.srcstat::before{content:"";flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--tungsten);animation:spin .8s linear infinite}
.srcstat.err{color:var(--err)}
.srcstat.err::before,.srcstat.idle::before{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
/* titles without any source */
.poster.nosrc .art{filter:grayscale(1);opacity:.35}
.poster.nosrc .t,.poster.nosrc .y{opacity:.45}
[data-nosrc="hide"] .poster.nosrc{display:none}
.note{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.page h1,.row h2{overflow-wrap:anywhere}
.err{color:var(--err);font-size:14px}

/* addons */
.addon{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border-radius:10px;padding:14px;margin-bottom:10px;max-width:820px}
.addon img,.addon .ph{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--raise)}
.addon>div{min-width:0}
.addon h3{margin:0;font-size:16px;overflow-wrap:anywhere}
.addon p{margin:2px 0 0;color:var(--muted);font-size:13px;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.add{display:flex;gap:10px;max-width:820px;margin:0 0 24px;flex-wrap:wrap}
.add input{flex:1 1 200px;min-width:0}
.danger{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;cursor:pointer;color:var(--muted)}

/* player */
.player{position:fixed;inset:0;z-index:50;background:#000;display:none;flex-direction:column}
.player.open{display:flex}
.player header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#000}
.player header b{font-family:var(--display);font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player video,.player iframe{flex:1;width:100%;border:0;background:#000;min-height:0}

/* ---------- skins (Settings) ---------- */
:root[data-skin="veo"]{--night:#050a16;--surface:#0d1524;--raise:#16203a;--line:#22304f;--light:#e9f0ff;--muted:#8695b5;--tungsten:#3d8bff;--velvet:#c040f0;
  --on-accent:#04070f;--text2:#c2cfe8;--shade-55:rgba(5,10,22,.55);--shade-50:rgba(5,10,22,.5);--shade-20:rgba(5,10,22,.2);
  --glow:rgba(61,139,255,.45);--glow-soft:rgba(61,139,255,.35);--beam:rgba(61,139,255,.13);--ghost:rgba(233,240,255,.1)}
:root[data-skin="midnight"]{--night:#000;--surface:#0e1116;--raise:#171b22;--line:#262c36;--light:#e8eef5;--muted:#7f8a98;--tungsten:#3dd6d0;--velvet:#e0457b;
  --on-accent:#001614;--text2:#c3ccd6;--shade-55:rgba(0,0,0,.55);--shade-50:rgba(0,0,0,.5);--shade-20:rgba(0,0,0,.2);
  --glow:rgba(61,214,208,.45);--glow-soft:rgba(61,214,208,.35);--beam:rgba(61,214,208,.12);--ghost:rgba(232,238,245,.1)}
:root[data-skin="velvet"]{--night:#1a0f14;--surface:#26161d;--raise:#331e27;--line:#4a2c38;--light:#f6e7dc;--muted:#ab929b;--tungsten:#e8b86b;--velvet:#c2415d;
  --on-accent:#1a0f14;--text2:#dfc9bd;--shade-55:rgba(26,15,20,.55);--shade-50:rgba(26,15,20,.5);--shade-20:rgba(26,15,20,.2);
  --glow:rgba(232,184,107,.45);--glow-soft:rgba(232,184,107,.35);--beam:rgba(232,184,107,.13);--ghost:rgba(246,231,220,.1)}
:root[data-skin="forest"]{--night:#0f1a15;--surface:#16241d;--raise:#1e3027;--line:#2d4438;--light:#e6efe4;--muted:#8ba494;--tungsten:#9be15d;--velvet:#d9643a;
  --on-accent:#0f1a15;--text2:#c9d8c8;--shade-55:rgba(15,26,21,.55);--shade-50:rgba(15,26,21,.5);--shade-20:rgba(15,26,21,.2);
  --glow:rgba(155,225,93,.4);--glow-soft:rgba(155,225,93,.3);--beam:rgba(155,225,93,.1);--ghost:rgba(230,239,228,.1)}
:root[data-skin="daylight"]{--night:#f4efe6;--surface:#fffaf2;--raise:#ebe3d5;--line:#d8cebd;--light:#1d1a16;--muted:#6b6358;--tungsten:#c8412d;--velvet:#8a2432;
  --on-accent:#fff;--text2:#3d372f;--err:#b3261e;--shade-55:rgba(244,239,230,.55);--shade-50:rgba(244,239,230,.5);--shade-20:rgba(244,239,230,.2);
  --glow:rgba(200,65,45,.3);--glow-soft:rgba(200,65,45,.25);--beam:rgba(200,65,45,.07);--ghost:rgba(29,26,22,.08)}

/* ---------- layouts (Settings) ---------- */
:root[data-poster="s"]{--poster-w:104px}
:root[data-poster="l"]{--poster-w:168px}
/* Poster wall: no banner, every row wraps into a grid */
[data-layout="grid"] .hero{display:none}
[data-layout="grid"] main{padding-top:8px}
[data-layout="grid"] .strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--poster-w),1fr));gap:22px 16px;overflow:visible}
/* List: compact rows with small art, title and year */
[data-layout="list"] .hero{display:none}
[data-layout="list"] main{padding-top:8px}
[data-layout="list"] .strip,[data-layout="list"] .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px 16px;overflow:visible}
[data-layout="list"] .poster{display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto 1fr;column-gap:12px;padding:8px;border-radius:8px;background:var(--surface)}
[data-layout="list"] .poster .art{grid-row:1 / span 2;width:52px}
[data-layout="list"] .poster .t{margin-top:2px}
[data-layout="list"] .poster:hover .art,[data-layout="list"] .poster:focus-visible .art{transform:none;box-shadow:none}
[data-layout="list"] .poster:hover,[data-layout="list"] .poster:focus-visible{background:var(--raise)}
/* TV: 10-foot UI - larger type, posters and focus for a remote */
[data-layout="tv"] body{font-size:17px}
[data-layout="tv"] .poster{flex-basis:var(--poster-w)}
[data-layout="tv"] .grid{grid-template-columns:repeat(auto-fill,minmax(var(--poster-w),1fr))}
[data-layout="tv"] .strip{gap:24px;padding:8px 6px 18px}
[data-layout="tv"] .row h2{font-size:28px}
[data-layout="tv"] .nav a{padding:10px 20px;font-size:18px}
/* the focus ring sits between neighbours instead of over them */
[data-layout="tv"] .bar{gap:30px}
[data-layout="tv"] .nav{gap:16px}
[data-layout="tv"] .bar :focus-visible{outline-width:3px;outline-offset:2px}
[data-layout="tv"] :focus-visible{outline-width:4px;outline-offset:4px}
[data-layout="tv"] .poster:focus .art,[data-layout="tv"] .poster:focus-visible .art{transform:scale(1.06);box-shadow:0 0 0 4px var(--tungsten),0 16px 40px -10px var(--glow-soft)}
[data-layout="tv"] .poster:focus-visible{outline:none}

/* settings page */
.sset{margin:0 0 32px;max-width:1000px}
.sset h2{font-family:var(--display);font-size:20px;font-weight:700;margin:0 0 12px}
.sopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.setopt{display:flex;flex-direction:column;gap:6px;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;color:var(--light)}
.setopt:hover{border-color:var(--muted)}
.setopt.on{border-color:var(--tungsten);box-shadow:0 0 0 1px var(--tungsten)}
.setopt .sn{font-weight:600;display:flex;align-items:center;gap:6px}
.setopt.on .sn::after{content:"✓";color:var(--tungsten)}
.setopt .sd{font-size:12px;color:var(--muted);line-height:1.35}
.swatch{display:flex;align-items:flex-end;gap:5px;height:72px;border-radius:7px;padding:9px;border:1px solid var(--line)}
.swatch i{width:18px;height:18px;border-radius:50%}
.swatch b{margin-inline-start:auto;font-family:var(--display);font-size:24px;line-height:1}
.lprev{display:flex;flex-direction:column;gap:4px;height:72px;padding:6px;border-radius:7px;background:var(--night);border:1px solid var(--line)}
.lprev .b{height:22px;flex:none;border-radius:3px;background:var(--raise)}
.lprev .r{display:flex;gap:4px;flex:1}
.lprev .r i{flex:1;border-radius:2px;background:var(--tungsten);opacity:.5}
.lprev .r.big i{opacity:.8}
.lprev .l{display:flex;gap:6px;align-items:center;flex:1}
.lprev .l i{width:11px;align-self:stretch;border-radius:2px;background:var(--tungsten);opacity:.5}
.lprev .l em{flex:1;height:5px;border-radius:3px;background:var(--muted);opacity:.55}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
/* Episodes: a season column on the side, the list beside it. Both scroll inside their own box,
   so a long series never spreads down the whole screen. */
.epwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.epwrap:has(.seasonbar){grid-template-columns:minmax(92px,auto) minmax(0,1fr)}
.seasonbar{display:flex;flex-direction:column;gap:3px;max-height:46vh;overflow:auto;scrollbar-width:none;
  border-inline-end:1px solid var(--line);padding-inline-end:10px}
.seasonbar::-webkit-scrollbar{width:0}
.seasonbar button{background:none;border:0;border-radius:8px;padding:8px 12px;text-align:start;white-space:nowrap;
  color:var(--muted);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
.seasonbar button.on{background:var(--raise);color:var(--light);box-shadow:inset calc(-3px * var(--flip)) 0 var(--tungsten)}
.seasonbar button:hover,.seasonbar button:focus-visible{color:var(--light)}
.eps{max-height:46vh}
[data-layout="tv"] .seasonbar button{font-size:16px;padding:10px 14px}
@media(max-width:600px){.epwrap:has(.seasonbar){grid-template-columns:minmax(78px,auto) minmax(0,1fr)}}
.seg button{border:0;background:none;border-radius:999px;padding:8px 18px;cursor:pointer;color:var(--muted);font-weight:600}
.seg button.on{background:var(--tungsten);color:var(--on-accent)}

.cats{position:sticky;top:var(--barh,64px);z-index:15;display:flex;gap:8px;overflow-x:auto;padding:8px 28px;background:var(--night);border-bottom:1px solid var(--line);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats[hidden]{display:none}
.cats a{flex:none;display:flex;align-items:center;gap:8px;text-decoration:none;padding:6px 10px;border-radius:0;color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
.cats .ic{flex:none;display:flex}
.cats .ic svg{width:19px;height:19px}
.cats a:hover{color:var(--light)}
.cats a.on{color:var(--light);box-shadow:inset 0 -2px var(--tungsten)}
[data-layout="tv"] .cats a{padding:10px 20px;font-size:17px}

/* live tv */
.ltabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.ltools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
.ltools .field{min-width:220px}
.channels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.chan{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--light);cursor:pointer;text-align:center}
.chan:hover,.chan:focus-visible{background:var(--raise);border-color:var(--tungsten)}
.chan .logo{width:100%;height:64px;display:flex;align-items:center;justify-content:center}
.chan .logo img{max-height:64px;max-width:90%;object-fit:contain}
.chan .logo span{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--raise);font-family:var(--display);font-weight:700;font-size:20px;color:var(--tungsten)}
.chan b{font-size:14px;line-height:1.25}
.chan small{font-size:12px;color:var(--muted)}
[data-layout="tv"] .channels{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.addpl{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;max-width:900px;margin:8px 0 6px}
.hint{font-size:13px;color:var(--muted);max-width:900px;margin:0 0 24px}
.hint code{background:var(--raise);padding:1px 6px;border-radius:4px;font-size:12px}
@media (max-width:760px){.cats{top:104px;padding:4px 16px 10px}.addpl{grid-template-columns:1fr}}

/* Hebrew metadata */
.desc[dir="rtl"]{font-size:16px;line-height:1.7}
.desc .src{display:block;margin-top:6px;font-size:12px;color:var(--muted)}
.desc .src a{color:var(--muted)}
.readmore{background:none;border:0;color:var(--tungsten);font-weight:600;cursor:pointer;padding:0 4px}
.orig{display:block;font-family:var(--body);font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:6px}

/* The secondary menu as a rail on the side: a quiet column of icons that opens into the full menu when
   the pointer or the remote arrives on it. It opens over the page, never pushing it: the content keeps
   the width of the closed rail, so nothing moves under the viewer. */
@media(min-width:900px){
  .cats{position:fixed;top:var(--barh,72px);inset-inline-start:0;width:var(--rail-shut,72px);height:calc(100vh - var(--barh,72px));
    flex-direction:column;gap:2px;padding:14px 12px 60px;overflow-y:auto;overflow-x:hidden;background:var(--night);
    border-inline-end:1px solid var(--line);scrollbar-width:none;transition:width .16s}
  .cats:hover,.cats:focus-within{width:var(--rail,190px);box-shadow:0 0 34px #0009}
  .cats a{padding:10px 14px;border-radius:10px;font-size:15px;box-shadow:none;gap:14px}
  .cats .lbl{opacity:0;transition:opacity .12s}
  .cats:hover .lbl,.cats:focus-within .lbl{opacity:1}
  .cats a.on{background:var(--raise);color:var(--light);box-shadow:inset calc(3px * var(--flip)) 0 var(--tungsten)}
  .cats a.on .ic{color:var(--tungsten)}
  body.railed main{margin-inline-start:var(--rail-shut,72px)}
}
[data-layout="tv"]{--rail:250px;--rail-shut:86px}
[data-layout="tv"] .cats a{font-size:18px;padding:13px 18px}
[data-layout="tv"] .cats .ic svg{width:26px;height:26px}

/* A title on the TV: the backdrop is the room's wallpaper, and everything you can DO with the
   title - play, sources, episodes - is on the first screen, without scrolling. */
[data-layout="tv"] .backdrop{position:fixed;inset:0;height:100vh;margin:0;z-index:0;opacity:.5}
[data-layout="tv"] .backdrop::after{background:linear-gradient(0deg,var(--night) 30%,var(--shade-50) 75%,var(--shade-20))}
[data-layout="tv"] .detail{margin-top:0;padding-top:12px;grid-template-columns:110px 1fr;gap:20px;align-items:start}
[data-layout="tv"] main{padding-bottom:16px}
[data-layout="tv"] .detail h1{font-size:30px;margin:0 0 6px}
[data-layout="tv"] .detail .facts{margin-bottom:8px}
[data-layout="tv"] .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:64ch;margin:0 0 12px}
[data-layout="tv"] .detail.series .people{display:none}
[data-layout="tv"] .detail.movie .desc{-webkit-line-clamp:6}
[data-layout="tv"] .epanel{margin-top:12px}
[data-layout="tv"] .panel{padding:10px 12px}
[data-layout="tv"] .ep{font-size:16px}
/* a series on the TV never scrolls the page: the header keeps its size and the episodes fill what is left */
[data-layout="tv"] body.titlefit{height:100vh;overflow:hidden;display:flex;flex-direction:column}
[data-layout="tv"] body.titlefit main{flex:1;min-height:0;display:flex;flex-direction:column;padding-bottom:12px}
[data-layout="tv"] body.titlefit .epanel{flex:1;min-height:0}
[data-layout="tv"] body.titlefit .epwrap{height:100%;align-items:stretch;grid-template-rows:minmax(0,1fr)}
[data-layout="tv"] body.titlefit .eps,[data-layout="tv"] body.titlefit .seasonbar{max-height:none;height:100%}

/* RaspberryTV access key: typed with the remote, no on-screen keyboard needed */
.keypad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;direction:ltr}
.keypad button{background:var(--surface);border:1px solid var(--line);color:var(--light);border-radius:8px;
  padding:12px 0;font:600 17px var(--body);cursor:pointer}
.keypad button:hover,.keypad button:focus-visible{border-color:var(--tungsten);color:var(--tungsten)}
.keypad button.wide{grid-column:span 2}
.keyboxes{display:flex;gap:8px;justify-content:center;direction:ltr;margin:4px 0 14px}
.keyboxes span{width:38px;height:48px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);font:700 20px var(--display)}
.keyboxes span.set{border-color:var(--tungsten);color:var(--tungsten)}
[data-layout="tv"] .keypad button{padding:15px 0;font-size:19px}
[data-layout="tv"] .keyboxes span{width:46px;height:58px;font-size:24px}

/* sorting and filtering: one pill per subject showing its current choice; a tap opens the choices */
.sortbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.sortpill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.sortpill b{color:var(--light);font-weight:600}
.sortpill::after{content:"▾";font-size:11px}
.sortpill.on{border-color:var(--tungsten)}
.sortpill.on b{color:var(--tungsten)}
.sortpill:hover,.sortpill:focus-visible{border-color:var(--tungsten)}
.sortpill.clear{background:none}
.sortpill.clear::after{content:none}
[data-layout="tv"] .sortpill{font-size:15px;padding:6px 14px}
.sortopts{gap:6px}
.sopt{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:start;background:var(--surface);border:1px solid var(--line);color:var(--light);border-radius:10px;padding:12px 16px;font:inherit;font-size:16px;cursor:pointer}
.sopt.on{border-color:var(--tungsten);color:var(--tungsten)}
.sopt.on::after{content:"✓"}
.sopt:hover,.sopt:focus-visible{border-color:var(--tungsten)}
[data-layout="tv"] .sopt{font-size:19px;padding:14px 18px}
[data-layout="tv"] .sheet{align-items:center}
[data-layout="tv"] .sheet>div{border-radius:14px}
.rate{color:var(--tungsten);font-weight:600}


/* a newer version is out: a quiet card at the bottom, never in the way */
.update{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9000;
  display:flex;flex-direction:column;align-items:center;gap:14px;max-width:min(430px,calc(100vw - 48px));
  padding:18px 22px;border-radius:14px;background:var(--raise);border:1px solid var(--tungsten);color:var(--light);
  font:14px/1.5 var(--body);text-align:center;box-shadow:0 18px 44px #000a}
.update .btns{display:flex;gap:10px}
.update b{font-weight:700}
.update button{border:1px solid var(--line);background:none;color:var(--light);border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
.update button.go{background:var(--tungsten);color:var(--on-accent);border-color:transparent;font-weight:600}
[data-layout="tv"] .update{font-size:16px}

/* opening a source: a slim bar at the bottom, with its own way out */
.tstat{display:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10000;
  flex-direction:row;align-items:center;gap:16px;max-width:min(560px,calc(100vw - 32px));padding:9px 10px 9px 20px;
  border-radius:999px;background:var(--raise);border:1px solid var(--line);color:var(--light);
  font:14px/1.4 var(--body);box-shadow:0 12px 32px #000b}
.tstat.bad{border-color:var(--velvet)}
.tstat span{min-width:0}
.tbar{flex:none;width:84px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.tbar[hidden]{display:none}
.tbar i{display:block;height:100%;width:0;background:var(--tungsten);transition:width .4s}
.tstat button{flex:none;background:var(--tungsten);color:var(--on-accent);border:0;border-radius:999px;padding:8px 20px;font:600 14px var(--body);cursor:pointer}
[data-layout="tv"] .tstat{font-size:17px} [data-layout="tv"] .tstat button{font-size:17px;padding:10px 24px}

/* settings: categories in a side menu, one page at a time */
.sgrid{display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}
.stabs{display:flex;flex-direction:column;gap:6px;position:sticky;top:84px}
.stabs button{text-align:start;background:none;border:0;border-radius:10px;padding:12px 15px;color:var(--muted);font:inherit;cursor:pointer}
.stabs button.on{background:var(--raise);color:var(--light);box-shadow:inset calc(-3px * var(--flip)) 0 var(--tungsten)}
.stabs button:hover{color:var(--light)}
.spane{min-width:0}
.spane .sset:first-child{margin-top:0}
[data-layout="tv"] .stabs button{font-size:19px;padding:15px 18px}
[data-layout="tv"] .sgrid{grid-template-columns:270px 1fr}
@media(max-width:760px){.sgrid{grid-template-columns:1fr}.stabs{flex-direction:row;overflow-x:auto;position:static;scrollbar-width:none}
  .stabs::-webkit-scrollbar{height:0}.stabs button{white-space:nowrap;box-shadow:none}.stabs button.on{box-shadow:inset 0 -3px var(--tungsten)}}
/* the title card: banner on top, synopsis, actions - a modest sheet, never a full page */
.titleSheet>div{max-height:92vh}
.tc-banner{height:min(30vh,220px);background:var(--surface) center 20%/cover}
.titleSheet .facts{display:flex;flex-wrap:wrap;gap:8px}
.titleSheet .qvdesc{max-height:24vh;overflow:auto;margin:0;color:var(--text2)}
.titleSheet .qvdesc[dir="rtl"]{font-size:15px;line-height:1.7}
.qvact{display:flex;flex-wrap:wrap;gap:10px}

/* RaspberryTV: access key form and catch-up sheet */
.keyform{display:flex;gap:10px;flex-wrap:wrap;align-items:center;max-width:560px;margin:4px 0 8px}
.keyform input{width:160px;letter-spacing:.15em;text-align:center;font-variant-numeric:tabular-nums}
.chan .rec{font-size:11px;color:var(--tungsten)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--night);border:1px solid var(--line);border-radius:14px 14px 0 0;width:min(720px,100%);max-height:88vh;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header img{height:32px;max-width:72px;object-fit:contain}
.sheet header b{flex:1;font-size:17px}
.sheet header button{background:none;border:0;color:var(--muted);font-size:22px;cursor:pointer;line-height:1}
.sheet .body{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.days button{flex:none;border:1px solid var(--line);background:none;color:var(--muted);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.days button.on{color:var(--light);border-color:var(--tungsten)}
.prog{display:flex;gap:12px;width:100%;text-align:start;border:0;border-bottom:1px solid var(--line);background:none;color:var(--light);padding:10px 4px;cursor:pointer;font-size:14px}
.prog:hover,.prog:focus-visible{background:var(--raise)}
.prog time{flex:0 0 46px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog.now{color:var(--tungsten)}
.prog.future{opacity:.4;cursor:default}

/* live tv: channel list */
.live-top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.live-top .field{padding:7px 12px}
.live-top #lq{flex:1;min-width:160px;max-width:320px}
.live-groups{display:contents}                    /* its chips sit in the same row as the search */
[data-layout="tv"] .live-groups .chip{font-size:16px;padding:9px 16px}
.continue{display:flex;align-items:center;gap:10px;width:100%;max-width:900px;border:1px solid var(--line);background:var(--surface);color:var(--light);border-radius:10px;padding:12px 16px;margin:0 0 14px;cursor:pointer;font-size:15px;text-align:start}
.continue:hover,.continue:focus-visible{border-color:var(--tungsten)}
.continue span{color:var(--tungsten);font-weight:700}
.chlist{display:flex;flex-direction:column;max-width:900px}
.chrow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.chmain{flex:1;display:flex;align-items:center;gap:14px;background:none;border:0;color:var(--light);padding:10px 6px;text-align:start;cursor:pointer;min-width:0}
.chmain:hover,.chmain:focus-visible{background:var(--raise)}
.chnum{flex:none;width:28px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center;font-size:14px}
.chlogo{flex:none;width:64px;height:40px;display:flex;align-items:center;justify-content:center}
.chlogo img{max-width:64px;max-height:40px;object-fit:contain}
.chlogo span{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--raise);color:var(--tungsten);font-weight:700}
.chinfo{display:flex;flex-direction:column;min-width:0;gap:3px}
.chinfo b{font-weight:600;font-size:15px}
.chinfo small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chinfo .bar{display:block;height:3px;width:160px;max-width:100%;background:var(--line);border-radius:2px;overflow:hidden}
.chinfo .bar i{display:block;height:100%;background:var(--tungsten)}
.chback{flex:none;width:56px;background:none;border:0;border-inline-start:1px solid var(--line);color:var(--muted);font-size:20px;cursor:pointer}
.chback:hover,.chback:focus-visible{color:var(--light);background:var(--raise)}
[data-layout="tv"] .chinfo b{font-size:19px}
[data-layout="tv"] .chlogo{width:84px;height:52px}
[data-layout="tv"] .chlogo img{max-width:84px;max-height:52px}
.plrow{display:flex;align-items:center;gap:10px;max-width:760px;padding:8px 0;border-bottom:1px solid var(--line)}
.plrow b{flex:1;font-weight:500}
.plrow code{color:var(--muted);font-size:12px;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* wide (16:9) cards for TV-channel shows and episodes */
.poster.wide{flex-basis:calc(var(--poster-w) * 1.55)}
.poster.wide .art{aspect-ratio:16/9}
button.poster{background:none;border:0;padding:0;color:inherit;text-align:start;cursor:pointer;font:inherit}
/* settings: home categories order */
.catorder{display:flex;flex-direction:column;max-width:520px}
.catorder div{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.catorder label{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer}
.catorder button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;width:34px;height:30px;cursor:pointer}

/* broadcaster show page */
.showhead{display:flex;gap:18px;align-items:flex-start;margin:0 0 18px;max-width:900px}
.showhead img{width:120px;border-radius:8px;flex:none}
.showhead p{color:var(--text2);margin:6px 0 0;font-size:14px;line-height:1.6}
.seasons{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.eplist{display:flex;flex-direction:column;max-width:900px;max-height:58vh;overflow:auto;scrollbar-width:none}
.eplist::-webkit-scrollbar{width:0}
.eprow{display:flex;gap:14px;align-items:center;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);color:var(--light);padding:10px 4px;cursor:pointer}
.eprow:hover,.eprow:focus-visible{background:var(--raise)}
.eprow img{width:160px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;flex:none;background:var(--surface)}
.eprow b{display:block;font-weight:600;font-size:15px}
.eprow small{display:block;color:var(--muted);font-size:13px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@media (max-width:760px){.eprow img{width:120px}.showhead img{width:90px}}

/* channels area: one broadcaster at a time */
.bctabs{display:flex;gap:6px;margin:0 0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.bctabs a{flex:none;padding:10px 18px;text-decoration:none;color:var(--muted);font-weight:600;font-size:16px;border-bottom:3px solid transparent;margin-bottom:-1px}
.bctabs a.on{color:var(--light);border-bottom-color:var(--bc, var(--tungsten))}
.bchead{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:0 0 18px}
.bchead .livebtn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 18px;background:var(--bc, var(--tungsten));color:#fff;font-weight:700;cursor:pointer}
.bchead .note{margin:0}
[data-layout="tv"] .bctabs a{font-size:20px;padding:12px 24px}

/* quick view: first tap on a poster */


/* Keshet 12 (mako) tab */
.mkbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 14px}
.mkbar input{flex:1;min-width:160px;max-width:320px;padding:7px 12px}
.openbtn{display:inline-flex;align-items:center;gap:8px}

/* TV: no animations or smooth scrolling (weak GPUs), no scroll snapping while moving with the remote */
[data-layout="tv"] *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
[data-layout="tv"]{scrollbar-width:none}
[data-layout="tv"] ::-webkit-scrollbar{width:0;height:0}
[data-layout="tv"] .art{contain:paint}                      /* keep a focus move from repainting the row */
[data-layout="tv"] .strip{scroll-snap-type:none}
[data-layout="tv"] input[readonly]{caret-color:transparent;cursor:pointer}

/* where a title streams: a small badge on the poster */
/* which service a title is on: a small mark beside its name, not a label over the artwork */
.svcs{display:inline-flex;gap:3px;margin-inline-start:6px;vertical-align:-2px;direction:ltr}
.svcm{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;
  border-radius:5px;color:#fff;font:700 10px/1 var(--body);letter-spacing:.02em}
[data-layout="tv"] .svcm{min-width:20px;height:20px;font-size:11px}
.facts .svcf{background:var(--raise);border:1px solid var(--line)}

.skel{background:linear-gradient(90deg,var(--surface),var(--raise),var(--surface));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.nav a{white-space:nowrap}

@media (max-width:760px){
  .bar{flex-wrap:wrap;padding:12px 16px;gap:10px 14px}.search{flex:1 1 140px;min-width:0;width:auto}.nav{order:3;width:100%}
  main{padding:0 16px 50px}.hero,.backdrop{margin:0 -16px 28px}
  .detail{grid-template-columns:1fr;margin-top:-22vh}.detail .poster-lg{width:150px}
  .poster{flex-basis:calc(var(--poster-w) * .8)}
  .grid{grid-template-columns:repeat(auto-fill,minmax(calc(var(--poster-w) * .8),1fr))}
  .nav{overflow-x:auto;max-width:100%}.nav a{padding:6px 11px;white-space:nowrap}
}

/* a phone: the search takes its own line, and everything around it gets a little tighter */
@media (max-width:430px){
  .bar{padding:10px 14px;gap:8px 12px}
  .logo{font-size:20px;gap:6px}
  .logo img{width:22px;height:22px}
  .search{flex:1 1 100%;order:2;min-width:0;width:auto;padding-inline:14px 4px}
  .nav{order:3}
  .nav a{padding:6px 9px;font-size:13px}
  main{padding:0 14px 50px}
  .hero,.backdrop{margin:0 -14px 24px}
  .hero .copy{padding:0 14px 32px}
  .sortbar{gap:6px}
  .sortpill{font-size:13px;padding:6px 12px}
  .detail{gap:18px}
  .cols,.epwrap{gap:12px}
}

<script>

const store = {

  set(k, v){
    try{ localStorage.setItem('booth:'+k, JSON.stringify(v)); }
    catch(e){ store.prune(); try{ localStorage.setItem('booth:'+k, JSON.stringify(v)); }catch(e2){} }
  },
  // big caches are written at most once a second, off the scrolling path
  dirty: {},
  lazy(k, v){ store.dirty[k] = v; clearTimeout(store.timer); store.timer = setTimeout(store.flush, 1000); },
  flush(){ const d = store.dirty; store.dirty = {}; for(const k in d) store.set(k, d[k]); },
  /** Storage is full: drop the rebuildable caches, never the library/progress/settings. */
  prune(){
    for(const k of ['heMeta', 'avail', 'svcMap']) try{ localStorage.removeItem('booth:' + k); }catch(e){}
  },
};

/** Keep a plain object cache under a size limit (oldest-inserted entries go first). */
function capMap(obj, max){
  const keys = Object.keys(obj);
  if(keys.length <= max) return obj;
  for(const k of keys.slice(0, keys.length - max)) delete obj[k];
  return obj;
}

/** Failed load: one calm line and a button that runs the same load again. */
function showErr(el, what, e, retry){

/** fetch with a deadline: a hung socket must not leave a screen "loading" forever. */
async function fetchTimed(url, ms, opts){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try{ return await fetch(url, {...opts, signal: ctl.signal}); }
  catch(e){ throw new Error(e.name === 'AbortError' ? tr('net.noResponse') : e.message); }
  finally{ clearTimeout(timer); }
}
async function getJSON(url, ms = 9000){

  if(!r.ok) throw new Error(r.status + ' from ' + new URL(url).host);

}
function supports(m, resource, type, id){

    const name = typeof r === 'string' ? r : r.name;
    if(name !== resource) continue;
    const types = (typeof r === 'object' && r.types) || m.types || [];
    const pref = (typeof r === 'object' && r.idPrefixes) || m.idPrefixes;
    if(type && !types.includes(type)) continue;
    if(id && pref && pref.length && !pref.some(p => id.startsWith(p))) continue;
    return true;
  }
  return false;
}

/* ---------- Hebrew titles, plots & search — fetched live from Wikidata and Hebrew Wikipedia ----------
   Uses the regular Wikidata API (search + wbgetentities). Titles are looked up only for posters that
   actually scroll into view, and cached on the device. */
const WDAPI = 'https://www.wikidata.org/w/api.php?format=json&origin=*&';
let heCache = store.get('heMeta', {});             // tt -> {t: Hebrew title, w: hewiki article}
const hePending = new Set();
let heTimer = null, heBusy = false;
const hebrewOn = () => (typeof settings === 'undefined' || settings.lang !== 'en');
const hasHebrew = s => /[\u0590-\u05FF]/.test(s || '');
// Wikidata labels sometimes carry a disambiguator: "אובססיה (סרט, 2025)" -> "אובססיה".
const heClean = t => (t || '').replace(/\s*\((?:סרט|סדרה|סדרת|מיני-סדרה|מיני סדרה|תוכנית|סרטון)[^)]*\)\s*$/, '').trim();
const heTitle = (id, fallback) => (hebrewOn() && heCache[id]?.t) || fallback;
for(const e of Object.values(heCache)) if(e?.t) e.t = heClean(e.t);   // titles cached by 0.9/0.10 weren't cleaned
// 0.11/0.12 could cache "no Hebrew entry" when Wikidata answered with an error; forget those once,
// and let negative answers expire after a week.
if(store.get('heRev', 0) < 1){
  for(const [id, e] of Object.entries(heCache)) if(!e?.t && !e?.w) delete heCache[id];
  store.set('heMeta', heCache); store.set('heRev', 1);
}
for(const [id, e] of Object.entries(heCache)) if(!e?.t && !e?.w && (!e.n || Date.now() - e.n > 7 * 864e5)) delete heCache[id];

const claim = (e, p) => e?.claims?.[p]?.[0]?.mainsnak?.datavalue?.value;
const claimIds = (e, p) => (e?.claims?.[p] || []).map(c => c.mainsnak?.datavalue?.value?.id).filter(Boolean);
const claimYear = e => (e?.claims?.P577 || []).map(c => c.mainsnak?.datavalue?.value?.time?.slice(1, 5)).filter(Boolean).sort()[0];
const hewiki = e => (e?.sitelinks?.hewiki?.title || '').replace(/ /g, '_');

/** Run fn over items with limited concurrency. */
async function pool(items, n, fn){
  const queue = [...items];
  await Promise.all(Array.from({length: Math.min(n, queue.length)}, async () => { while(queue.length) await fn(queue.shift()); }));
}

/** IMDb ids -> Hebrew title + Hebrew Wikipedia article, via the Wikidata API. */
async function heLookup(ids){
  const byItem = {};
  // one small search per id: a combined search can't say which item matched which IMDb id
  await pool(ids, isTvLayout() ? 2 : 6, async id => {
    try{
      const s = await getJSON(`${WDAPI}action=query&list=search&srlimit=1&srprop=&srsearch=haswbstatement:P345=${id}`);
      const q = s.query?.search?.[0]?.title;
      if(q) byItem[q] = id;
      else if(Array.isArray(s.query?.search)) heCache[id] = {t: '', w: '', n: Date.now()};   // really not on Wikidata
      // anything else (rate-limit or error JSON): leave uncached and try again later
    }catch(e){ /* network error: try again next time it is shown */ }
  });
  const qs = Object.keys(byItem);
  for(let i = 0; i < qs.length; i += 50){
    const d = await getJSON(`${WDAPI}action=wbgetentities&props=labels|sitelinks&languages=he&sitefilter=hewiki&ids=${qs.slice(i, i + 50).join('|')}`);
    for(const [q, e] of Object.entries(d.entities || {})) heCache[byItem[q]] = {t: heClean(e.labels?.he?.value), w: hewiki(e)};
  }
  store.lazy('heMeta', capMap(heCache, 4000));
}

/** Queue ids for a Hebrew title lookup (batched; the page is updated in place). */
function hebrewize(ids){
  if(!hebrewOn()) return;
  for(const id of ids) if(/^tt\d+$/.test(id) && !(id in heCache)) hePending.add(id);
  if(hePending.size){ clearTimeout(heTimer); heTimer = setTimeout(heFlush, 250); }
}
async function heFlush(){
  if(heBusy || !hePending.size) return;
  heBusy = true;
  const batch = [...hePending].slice(0, 30);
  batch.forEach(id => hePending.delete(id));
  try{ await heLookup(batch); }catch(e){ /* offline or rate-limited */ }
  applyHebrew();
  heBusy = false;
  if(hePending.size) heTimer = setTimeout(heFlush, 400);
}
function applyHebrew(){
  if(!hebrewOn()) return;
  document.querySelectorAll('[data-heid]').forEach(el => {
    const t = heCache[el.dataset.heid]?.t;
    if(t && el.textContent !== t){ el.textContent = t; el.dir = 'rtl'; }
  });
}

// Look titles up only when their poster comes into view (rows hold hundreds of titles).
const heObserver = new IntersectionObserver(entries => {
  const ids = [];
  for(const en of entries) if(en.isIntersecting){ heObserver.unobserve(en.target); ids.push(en.target.dataset.heid); }
  if(ids.length) hebrewize(ids);
}, {rootMargin: '300px'});
function armHeAndAvail(root){
  if(hebrewOn()) root.querySelectorAll?.('[data-heid]').forEach(el => { if(!(el.dataset.heid in heCache)) heObserver.observe(el); });
  root.querySelectorAll?.('[data-avail]').forEach(el => { if(!availKnown(el.dataset.avail)) availObserver.observe(el); });
}
new MutationObserver(muts => {
  if(!hebrewOn()) return;
  for(const m of muts) for(const n of m.addedNodes){
    if(n.nodeType !== 1) continue;
    const els = n.matches('[data-heid]') ? [n] : n.querySelectorAll('[data-heid]');
    const now = [];
    for(const el of els){
      if(el.dataset.heid in heCache) continue;
      // the first posters of a row are on screen right away; the rest wait until scrolled to
      const card = el.closest('.poster');
      if(!card || [...card.parentNode.children].indexOf(card) < 10) now.push(el.dataset.heid);
      else heObserver.observe(el);
    }
    if(now.length) hebrewize(now);
  }
}).observe(document.body, {childList: true, subtree: true});

const plotCache = {};
/** Hebrew plot for an IMDb id from Hebrew Wikipedia: the plot section, else the lead. */
async function hebrewPlot(id){
  if(id in plotCache) return plotCache[id];
  if(!(id in heCache)) await heLookup([id]);
  const article = heCache[id]?.w;
  if(!article) return plotCache[id] = null;
  const d = await getJSON(`https://he.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&exsectionformat=wiki&redirects=1&format=json&origin=*&titles=${encodeURIComponent(article)}`);
  const text = Object.values(d.query.pages)[0]?.extract || '';
  const plot = text.match(/^==\s*(?:עלילה|עלילת הסרט|עלילת הסדרה|תקציר העלילה|תקציר הסדרה|תקציר|תקציר עלילה)\s*==\s*$([\s\S]*?)(?=^==[^=]|$(?![\s\S]))/m);
  const body = (plot ? plot[1] : text.split(/^==/m)[0]).replace(/^===.*===$/gm, '').replace(/\n{2,}/g, '\n').trim();

}

const SERIES_CLASSES = new Set(['Q5398426', 'Q1259759', 'Q63952888', 'Q526877', 'Q117467246', 'Q15416', 'Q7725310']);
const FILM_CLASSES = new Set(['Q11424', 'Q202866', 'Q93204', 'Q24869', 'Q506240', 'Q24862', 'Q229390', 'Q226730', 'Q2484376', 'Q17517379', 'Q20650540']);
const EPISODE_CLASS = 'Q21191270';

/** Wikidata items -> Stremio metas (tt ids only), filling the Hebrew title cache on the way. */
async function wdMetas(qids, forceType){
  const out = [];
  for(let i = 0; i < qids.length; i += 50){
    const d = await getJSON(`${WDAPI}action=wbgetentities&props=labels|claims|sitelinks&languages=he|en|ar&sitefilter=hewiki&ids=${qids.slice(i, i + 50).join('|')}`);
    for(const q of qids.slice(i, i + 50)){
      const e = d.entities?.[q];
      const id = claim(e, 'P345');
      if(!e || typeof id !== 'string' || !id.startsWith('tt')) continue;
      const classes = claimIds(e, 'P31');
      if(classes.includes(EPISODE_CLASS)) continue;
      const series = classes.some(c => SERIES_CLASSES.has(c));
      if(!forceType && !series && !classes.some(c => FILM_CLASSES.has(c))) continue;
      const he = heClean(e.labels?.he?.value);
      heCache[id] = {t: he, w: hewiki(e)};
      out.push({id, type: forceType || (series ? 'series' : 'movie'), name: he || e.labels?.en?.value || e.labels?.ar?.value || id,
                poster: `https://images.metahub.space/poster/medium/${id}/img`, releaseInfo: claimYear(e) || ''});
    }
  }
  store.set('heMeta', heCache);
  return out;
}

/** Hebrew search: Wikidata full-text search, keeping films and series that have an IMDb id. */
async function hebrewSearch(q){
  const s = await getJSON(`${WDAPI}action=query&list=search&srlimit=20&srprop=&srsearch=${encodeURIComponent(q + ' haswbstatement:P345')}`);
  const qids = (s.query?.search || []).map(r => r.title).filter(t => /^Q\d+$/.test(t));
  return qids.length ? wdMetas(qids) : [];
}

  {id: 'booth.he.comedy.series', type: 'series', name: 'Israeli comedy series', filter: 'P31=Q5398426', extra: 'P136=Q170238|P136=Q859369|P136=Q7696995', lang: 'Q9288', countries: ['Q801'], sort: 'incoming_links_desc'},

async function localCatalog(id){
  const c = LOCAL_CATALOGS.find(x => x.id === id);
  if(!c) return {metas: []};
  const cached = store.get('cat:' + id, null);
  if(cached && Date.now() - cached.at < 864e5) return {metas: cached.metas};
  const query = `haswbstatement:${c.filter} ${c.extra ? `haswbstatement:${c.extra} ` : ''}haswbstatement:P364=${c.lang} haswbstatement:${c.countries.map(x => 'P495=' + x).join('|')} haswbstatement:P345`;
  const s = await getJSON(`${WDAPI}action=query&list=search&srlimit=100&srprop=&srsort=${c.sort}&srsearch=${encodeURIComponent(query)}`);
  let metas = await wdMetas((s.query?.search || []).map(r => r.title), c.type);
  if(c.sort === 'create_timestamp_desc') metas = metas.filter(m => m.releaseInfo).sort((a, b) => b.releaseInfo.localeCompare(a.releaseInfo));

const nameOf = (kind, s) => NAMES[UI]?.[kind]?.[s] ?? s;
const genreName = g => nameOf('genre', g);
const typeName = t => nameOf('type', t);
const catalogName = n => nameOf('catalog', n);
/** Where a catalogue comes from, for people: the built-in ones are Wikidata searches. */
const srcName = a => a.local ? 'Wikidata' : a.manifest.name;

/* ---------- lazy images: posters load only when they come near the screen (big win on TV boxes) ---------- */
const bgObserver = new IntersectionObserver(entries => {
  for(const en of entries) if(en.isIntersecting){
    const el = en.target;
    bgObserver.unobserve(el);
    el.style.backgroundImage = `url("${(el.dataset.bg || '').replace(/"/g, '%22')}")`;
  }
}, {rootMargin: '400px 600px'});
function lazyBg(root){
  root.querySelectorAll?.('[data-bg]:not([data-bgw])').forEach(el => { el.dataset.bgw = 1; bgObserver.observe(el); });
}
new MutationObserver(muts => {
  for(const m of muts) for(const n of m.addedNodes) if(n.nodeType === 1) lazyBg(n.matches('[data-bg]') ? n.parentNode : n);
}).observe(document.body, {childList: true, subtree: true});
/* Remote-driven mode. The app says whether this is a television; every layout must navigate
   with the D-pad there - the TV *layout* is only the ten-foot skin. (In a desktop browser,
   choosing the TV layout still turns this on, which is how it is tested.) */
const IS_TV_DEVICE = (() => { try{ return !!window.BoothAndroid?.isTv?.(); }catch(e){ return false; } })();
const isTvLayout = () => IS_TV_DEVICE || (typeof settings !== 'undefined' && settings.layout === 'tv');
const rowMax = () => isTvLayout() ? 24 : 40;

/* ---------- which streaming service a title is on (from the Streaming Catalogs add-on) ---------- */
const SERVICES = {nfx: 'Netflix', atp: 'Apple TV+', dnp: 'Disney+', amp: 'Prime Video', hbm: 'HBO Max', pmp: 'Paramount+', cts: 'Curiosity Stream', mgl: 'MagellanTV'};
let svcMap = (() => { const c = store.get('svcMap', null); return c && Date.now() - c.at < 864e5 ? c.map : {}; })();
const svcOf = id => svcMap[id] || [];
function noteServices(id, name){
  const list = svcMap[id] ||= [];
  if(!list.includes(name)) list.push(name);
}
// Initials in the service's own colour: a logo would be its trademark, and a name is too long to sit
// beside a title. The mark carries the full name as its tooltip.
const SVC_MARK = {'Netflix': ['N', '#e50914'], 'Apple TV+': ['TV', '#4f5157'], 'Disney+': ['D+', '#1f4bd8'],
  'Prime Video': ['PV', '#0b8fd0'], 'HBO Max': ['HBO', '#7b2ff2'], 'Paramount+': ['P+', '#1266ff'],
  'Curiosity Stream': ['CS', '#0f9bb8'], 'MagellanTV': ['MG', '#b5842a']};
const svcMark = name => {
  const [txt, bg] = SVC_MARK[name] || [name.slice(0, 2).toUpperCase(), '#5a6072'];
  return `<span class="svcm" style="background:${bg}" title="${esc(name)}">${esc(txt)}</span>`;
};
/** Up to two marks, and how many more there are. */
const svcMarks = id => {
  const l = svcOf(id);
  if(!l.length) return '';
  return `<span class="svcs" title="${esc(l.join(' · '))}">${l.slice(0, 2).map(svcMark).join('')}${
    l.length > 2 ? `<span class="svcm" style="background:#5a6072">+${l.length - 2}</span>` : ''}</span>`;
};
const svcFacts = id => svcOf(id).map(n => `<span class="svcf">${esc(n)}</span>`).join('');
/** The catalogues answer after the cards are drawn, so the marks are added to what is already on screen. */
function applyBadges(){
  document.querySelectorAll('a.poster[data-id]').forEach(a => {
    const name = a.querySelector('.t [data-heid]');
    if(!name || a.querySelector('.svcs')) return;
    const marks = svcMarks(a.dataset.id);
    if(marks) name.insertAdjacentHTML('afterend', marks);
  });
}
/** Once a day: collect every streaming service's catalogue into id -> services. */
async function loadServices(){
  const cached = store.get('svcMap', null);
  if(cached && Date.now() - cached.at < 864e5) return;
  const sc = addons.find(a => a.manifest.id === SC_ID);
  if(!sc) return;
  const map = {};
  await pool((sc.manifest.catalogs || []).filter(c => SERVICES[c.id]), 3, async c => {
    try{
      for(const m of (await catalogFetch(sc, c.type, c.id)).metas || []) (map[m.id] ||= []).includes(SERVICES[c.id]) || map[m.id].push(SERVICES[c.id]);
    }catch(e){}
  });
  svcMap = map;
  store.set('svcMap', {at: Date.now(), map});
  applyBadges();
}

/* ---------- sorting and filtering ----------
   Real IMDb ratings and years come with the catalogue itself, so a category can be re-ordered
   without asking anything else: one tap per choice, and the rows become one ranked grid. */
const GENRES = ['Comedy', 'Action', 'Drama', 'Thriller', 'Horror', 'Sci-Fi', 'Romance', 'Animation', 'Family', 'Crime', 'Adventure',
  'Fantasy', 'Documentary', 'Mystery', 'History', 'War', 'Music', 'Sport', 'Western'];
const SORT_GROUPS = [
  {key: 'genre', label: 'sort.genre', opts: [['', 'sort.genre.all'], ...GENRES.map(g => [g, ''])]},
  {key: 'svc', label: 'sort.svc', opts: [['', 'sort.svc.all'], ...Object.keys(SERVICES).map(k => [k, ''])]},
  {key: 'year', label: 'sort.year', opts: [['', 'sort.year.all'], ['2020', 'sort.year.2020'], ['2010', 'sort.year.2010'], ['2000', 'sort.year.2000'], ['old', 'sort.year.old']]},
  {key: 'rate', label: 'sort.rate', opts: [['', 'sort.rate.all'], ['7', 'sort.rate.7'], ['8', 'sort.rate.8']]},
  {key: 'by', label: 'sort.by', opts: [['pop', 'sort.by.pop'], ['rating', 'sort.by.rating'], ['year', 'sort.by.year'], ['az', 'sort.by.az']]},
];
/** The words of one choice: genres come from the names table, everything else from the strings. */
const optLabel = (g, [v, n]) => g.key === 'genre' && v ? genreName(v) : g.key === 'svc' && v ? SERVICES[v] : tr(n);
let sortState = Object.assign({genre: '', svc: '', by: 'pop', year: '', rate: ''}, store.get('sort', {}));
const sortActive = () => sortState.by !== 'pop' || !!sortState.year || !!sortState.rate || !!sortState.genre || !!sortState.svc;
const yearOfMeta = m => +String(m.year || m.releaseInfo || '').slice(0, 4) || 0;
const rateOf = m => parseFloat(m.imdbRating) || 0;

/** One pill per subject, each showing what is chosen; the first option of a subject is its "off" state. */
function sortBar(){
  const pills = SORT_GROUPS.map(g => {
    const cur = g.opts.find(([v]) => v === sortState[g.key]) || g.opts[0];
    return `<button class="sortpill${sortState[g.key] !== g.opts[0][0] ? ' on' : ''}" data-sk="${g.key}" aria-haspopup="dialog"><span>${tr(g.label)}</span><b>${esc(optLabel(g, cur))}</b></button>`;
  }).join('');
  return `<div class="sortbar" role="group" aria-label="${esc(tr('sort.aria'))}">${pills}${sortActive() ? `<button class="sortpill clear" data-sclear>${tr('sort.clear')}</button>` : ''}</div>`;
}
/** [redraw] is called after every change. */
function wireSortBar(redraw){
  document.querySelectorAll('.sortpill[data-sk]').forEach(b => b.onclick = () => openSortSheet(b.dataset.sk, redraw));
  const clear = document.querySelector('[data-sclear]');
  if(clear) clear.onclick = () => { sortState = {genre: '', svc: '', by: 'pop', year: '', rate: ''}; store.set('sort', sortState); redraw(); };
}
/** The choices of one subject, in a sheet the remote stays inside (Back closes it). */
function openSortSheet(key, redraw){
  const g = SORT_GROUPS.find(x => x.key === key);
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = `<div role="dialog" aria-label="${esc(tr(g.label))}"><header><b>${tr(g.label)}</b><button aria-label="${esc(tr('common.close'))}">✕</button></header>
    <div class="body sortopts">${g.opts.map(([v, n]) => `<button class="sopt${sortState[key] === v ? ' on' : ''}" data-v="${v}">${esc(optLabel(g, [v, n]))}</button>`).join('')}</div></div>`;
  document.body.appendChild(sheet);
  sheet.onclick = e => { if(e.target === sheet) sheet.remove(); };
  sheet.querySelector('header button').onclick = () => sheet.remove();
  sheet.querySelectorAll('.sopt').forEach(b => b.onclick = () => {
    sortState[key] = b.dataset.v; store.set('sort', sortState);
    sheet.remove(); redraw();
    document.querySelector(`.sortpill[data-sk="${key}"]`)?.focus();
  });
  (sheet.querySelector('.sopt.on') || sheet.querySelector('.sopt')).focus();
}
/** Apply the current choice to a list of titles. */
function applySort(list){
  const {by, year, rate, genre, svc} = sortState;
  let out = list.filter(m => {
    const y = yearOfMeta(m);
    if(genre && !(m.genres || m.genre || []).includes(genre)) return false;
    if(svc && !svcOf(m.id).includes(SERVICES[svc])) return false;
    if(year === '2020' && y < 2020) return false;
    if(year === '2010' && (y < 2010 || y > 2019)) return false;
    if(year === '2000' && (y < 2000 || y > 2009)) return false;
    if(year === 'old' && (!y || y >= 2000)) return false;
    if(rate && rateOf(m) < +rate) return false;
    return true;
  });
  if(by === 'rating') out = out.sort((a, b) => rateOf(b) - rateOf(a));
  if(by === 'year') out = out.sort((a, b) => yearOfMeta(b) - yearOfMeta(a));
  if(by === 'az') out = out.sort((a, b) => heTitle(a.id, a.name).localeCompare(heTitle(b.id, b.name), UI));
  return out;
}

/** Everything a set of rows holds, as one ranked grid: used whenever a filter or a sort is on. A genre widens
    the set with that genre's popular and top-rated titles, so it works from any page. [redraw] shows the page again. */
async function gridFrom(rows, heading, redraw){
  const app = $('#app');
  const all = withServiceRows(withGenreRows(rows));
  app.innerHTML = `<div class="page"><h1>${esc(heading)}</h1>${sortBar()}<p class="sortnote" id="gnote"></p><div class="grid" id="grid">${skeletons(18)}</div></div>`;
  wireSortBar(redraw);
  const lists = await Promise.all(all.filter(x => x.a && x.c).map(x =>
    catalogFetch(x.a, x.c.type, x.c.id, x.extra).then(d => {
      const metas = d.metas || [];
      if(SERVICES[x.c.id]) metas.forEach(m => noteServices(m.id, SERVICES[x.c.id]));   // a service's own catalogue says so
      return metas;
    }).catch(() => [])));
  const seen = new Set(), metas = [];
  for(const l of lists) for(const m of l) if(!seen.has(m.id)){ seen.add(m.id); metas.push(m); }
  const grid = $('#grid');
  if(!grid) return;
  const out = applySort(metas);
  grid.innerHTML = out.length ? out.slice(0, 200).map(card).join('') : `<p class="note">${tr('sort.none')}</p>`;
  const by = SORT_GROUPS.find(g => g.key === 'by');
  $('#gnote').textContent = tr('sort.summary', {n: Math.min(out.length, 200), by: optLabel(by, by.opts.find(([v]) => v === sortState.by)),
    from: [...new Set(all.filter(x => x.a).map(x => srcName(x.a)))].join(', ')});
  lazyBg(grid);
}
/** A chosen service adds that service's own catalogue, so the filter has something to show everywhere. */
function withServiceRows(rows){
  const sc = sortState.svc && addons.find(a => a.manifest.id === SC_ID);
  if(!sc) return rows;
  return [...rows, ...(sc.manifest.catalogs || []).filter(c => c.id === sortState.svc).map(c => ({a: sc, c}))];
}
/** A chosen genre adds Cinemeta's popular and top-rated titles of that genre to whatever the page holds. */
function withGenreRows(rows){
  const cm = sortState.genre && addons.find(a => a.manifest.id === CINEMETA_ID);
  if(!cm) return rows;
  const extra = [];
  for(const id of ['top', 'imdbRating']) for(const c of cm.manifest.catalogs || [])
    if(c.id === id) extra.push({a: cm, c, extra: `genre=${encodeURIComponent(sortState.genre)}`});
  return [...rows, ...extra];
}

/* ---------- cards ---------- */
let progressIdx = new Map();
/** A title shows the newest thing watched under it (a series: its last episode). */
function indexProgress(){
  progressIdx = new Map();
  for(const x of Object.values(progress).sort((a, b) => (a.at || 0) - (b.at || 0))) progressIdx.set(x.metaId, x);
}
/** The watch history is kept for the marks on posters, so it needs a limit: the newest 400 videos. */
function pruneProgress(){
  const ids = Object.keys(progress);
  if(ids.length <= 400) return;
  for(const id of ids.sort((a, b) => (progress[b].at || 0) - (progress[a].at || 0)).slice(400)) delete progress[id];
}
indexProgress();
function card(m){
  const p = progressIdx.get(m.id);
  // A film that was watched to the end carries a tick; one left in the middle carries how far it got.
  // A series' entry is whichever episode was last played, so it never means the whole series is watched.
  const done = !!p?.done && p.type !== 'series';
  const pct = p && p.d && !p.done ? Math.min(100, p.t / p.d * 100) : 0;
  const marks = (done ? `<span class="seen" title="${esc(tr('card.watched'))}">✓</span>` : '')
    + (pct ? `<span class="track" title="${esc(tr('card.left', {n: Math.max(1, Math.round((p.d - p.t) / 60))}))}"><i style="width:${pct.toFixed(0)}%"></i></span>` : '');
  const art = m.poster
    ? `<div class="art" data-bg="${esc(m.poster)}">${marks}</div>`
    : `<div class="art noart">${esc(m.name)}${marks}</div>`;
  const name = heTitle(m.id, m.name);
  const key = /^tt\d+$/.test(m.id) && (m.type === 'movie' || m.type === 'series') ? `${m.type}:${m.id}` : '';
  const none = key && typeof avail !== 'undefined' && isNoSrc(avail[key]);
  const rating = m.imdbRating ? `<small class="rate" title="IMDb">★ ${esc(m.imdbRating)}</small>` : '';
  return `<a class="poster${none ? ' nosrc' : ''}${done ? ' watched' : ''}" data-id="${esc(m.id)}" ${key ? `data-avail="${key}"` : ''} href="#/detail/${esc(m.type)}/${encodeURIComponent(m.id)}">${art}<div class="t"><span data-heid="${esc(m.id)}" dir="${hasHebrew(name) ? 'rtl' : 'auto'}">${esc(name)}</span>${svcMarks(m.id)}${rating}</div><div class="y">${esc(yearOf(m))}</div></a>`;
}
const skeletons = n => Array.from({length:n}, () => `<div class="poster"><div class="art skel"></div></div>`).join('');

/* ---------- categories ---------- */
const SC_ID = 'pw.ers.netflix-catalog', BOOTH_ID = 'org.booth.catalogs', CINEMETA_ID = 'com.linvo.cinemeta';
// rows: [add-on id, catalog id (or pattern), extra args, title (a strings key)]. These are collections of
// their own; a genre is not one - it is a filter (the Genre pill), and works inside every collection.
// [prefix]: the collection's name is put before its rows' titles on the home page.
const CATEGORIES = [
  {id: 'israeli', rows: [[BOOTH_ID, 'booth.he.movies'], [BOOTH_ID, 'booth.he.series'], [BOOTH_ID, 'booth.he.comedy'],
    [BOOTH_ID, 'booth.he.comedy.series'], [BOOTH_ID, 'booth.he.movies.new']]},
  {id: 'kids', prefix: true, rows: [[CINEMETA_ID, 'top', 'genre=Animation', 'cat.row.animation'], [CINEMETA_ID, 'top', 'genre=Family', 'cat.row.family']]},
  {id: 'docs', rows: [[SC_ID, 'cts', undefined, 'cat.row.docs'], [CINEMETA_ID, 'top', 'genre=Documentary', 'cat.row.docsPop'], [SC_ID, 'mgl', undefined, 'cat.row.docsMore']]},
];
const catName = c => tr('cat.' + c.id);
// "New on the streaming services": every service's catalogue merged into one row per type (services show as badges).
const STREAMING = ['nfx', 'atp', 'dnp', 'amp', 'hbm', 'pmp'];
const mergedRow = (type, title) => ({merge: STREAMING, type, title});
/** Categories in the user's order, without the hidden ones (Settings → מסך הבית). */
function userCategories(){
  const order = settings.cats || CATEGORIES.map(c => c.id);
  const hidden = new Set(settings.hiddenCats || []);
  const known = [...order, ...CATEGORIES.map(c => c.id).filter(id => !order.includes(id))];
  return known.map(id => CATEGORIES.find(c => c.id === id)).filter(c => c && !hidden.has(c.id));
}

/* ---------- Reshet 13 VOD & live (13tv.co.il) — the site's own Kaltura OTT API, as a guest ---------- */
const R13 = {api: 'https://5031.frp1.ott.kaltura.com/api_v3/service/', ks: '', exp: 0};
const R13_SERIES = '1259', R13_EPISODE = '1268', R13_CHANNEL = '1265';
async function r13(svc, body){
  const r = await fetch(`${R13.api}${svc}?format=1`, {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({apiVersion: '5.4.0', clientTag: 'ReshetWeb', ...body})});
  const d = await r.json();
  if(d.result?.error) throw new Error(d.result.error.message);
  return d.result;
}
async function r13ks(){
  if(R13.ks && Date.now() < R13.exp) return R13.ks;
  let udid = store.get('r13udid', '');
  if(!udid){ udid = 'booth-' + Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('r13udid', udid); }
  R13.ks = (await r13('ottuser/action/anonymousLogin', {partnerId: 5031, udid})).ks;
  R13.exp = Date.now() + 6 * 3600e3;
  return R13.ks;
}
async function r13list(kSql, orderBy = 'CREATE_DATE_DESC', size = 100){
  const r = await r13('asset/action/list', {ks: await r13ks(), filter: {objectType: 'KalturaSearchAssetFilter', kSql, orderBy},
    pager: {objectType: 'KalturaFilterPager', pageSize: size, pageIndex: 1}});
  return r.objects || [];
}
const r13img = (o, ratio, w, h) => { const u = (o.images || []).find(i => i.ratio === ratio)?.url; return u ? `${u}/width/${w}/height/${h}` : ''; };
const r13meta = (o, k) => o.metas?.[k]?.value;
/** Playable source: DASH + Widevine licence for VOD, plain HLS for the live channels. */
async function r13source(assetId, live){
  const r = await r13('asset/action/getPlaybackContext', {ks: await r13ks(), assetId: String(assetId), assetType: 'media',
    contextDataParams: {objectType: 'KalturaPlaybackContextOptions', context: 'PLAYBACK', streamerType: live ? 'applehttp' : 'mpegdash', urlType: 'DIRECT', mediaProtocol: 'https'}});
  const bad = (r.messages || []).find(m => m.code && m.code !== 'OK');
  if(bad) throw new Error(bad.message);
  const srcs = r.sources || [];
  if(live){ const h = srcs.find(x => !(x.drm || []).length) || srcs[0]; if(!h) throw new Error('אין שידור'); return {url: h.url}; }
  const d = srcs.find(x => (x.drm || []).some(k => k.scheme === 'WIDEVINE_CENC')) || srcs[0];
  if(!d) throw new Error('אין מקור לפרק');
  return {url: d.url, drm: (d.drm || []).find(k => k.scheme === 'WIDEVINE_CENC')?.licenseURL || ''};
}
async function r13playEpisode(id, title){
  try{
    const src = await r13source(id, false);
    if(window.BoothAndroid && BoothAndroid.playDrm) BoothAndroid.playDrm(src.url, src.drm, title);
    else alert('פרקי רשת 13 מתנגנים באפליקציית VEO לאנדרואיד.');
  }catch(e){ alert(`לא ניתן לנגן את הפרק (${e.message}).`); }
}
function r13card(o){
  if(o.type == R13_SERIES) return `<a class="poster" href="#/r13/${encodeURIComponent(r13meta(o, 'SeriesID'))}/${encodeURIComponent(o.name)}">
      <div class="art" data-bg="${esc(r13img(o, '2x3', 300, 450))}"></div><div class="t" dir="auto">${esc(o.name)}</div></a>`;
  return `<button class="poster wide" data-r13="${o.id}" data-title="${esc(o.name)}"><div class="art" data-bg="${esc(r13img(o, '16x9', 480, 270))}"></div>
      <div class="t" dir="auto">${esc(o.name)}</div></button>`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-r13]'); if(b){ e.preventDefault(); r13playEpisode(b.dataset.r13, b.dataset.title); } });
async function r13row(kind){
  if(kind === 'series') return r13list(`(and asset_type='${R13_SERIES}')`, 'VIEWS_DESC', 100);
  return r13list(`(and asset_type='${R13_EPISODE}')`, 'CREATE_DATE_DESC', 30);
}
/** Reshet 13 live channels (main channel, comedy, reality, holiday) with playable HLS URLs. */
let r13chanCache = null;
async function r13channels(){
  if(r13chanCache && Date.now() - r13chanCache.at < 3e5) return r13chanCache.list;
  const chans = (await r13list(`(and asset_type='${R13_CHANNEL}')`, 'NAME_ASC', 20)).filter(o => !/test|בדיקה|kaltura|cnn/i.test(o.name));
  const out = await Promise.all(chans.map(async o => {

/* ---------- Kan BOX (kan.org.il) — the public website's pages; episodes are plain HLS ---------- */
const KAN = 'https://www.kan.org.il';
let kanBoxCache = null;
const kanClean = t => (t || '').replace(/(small\s*)?poster( image)?( small)?\s*\d+\s*x\s*\d+/gi, '').replace(/\s*-\s*כאן 11$/, '').replace(/\s*לוגו$/, '').trim();
const kanAbs = u => !u ? '' : u.startsWith('http') ? u : KAN + (u.startsWith('/') ? '' : '/') + u;
const kanDoc = async url => new DOMParser().parseFromString(await fetchText(url), 'text/html');

/** Kan BOX sections (דרמה, קומדיה וסאטירה, דוקו, סרטים, ילדים…) -> programmes with posters. */
async function kanBox(){
  if(kanBoxCache) return kanBoxCache;
  const doc = await kanDoc(`${KAN}/lobby/kan-box/`);
  const sections = [];
  for(const h2 of doc.querySelectorAll('h2')){
    const title = h2.textContent.trim();
    if(!title || title.length > 40 || /אולי יעניין/.test(title)) continue;
    let box = h2.parentElement;
    for(let i = 0; i < 6 && box && !box.querySelector('a[href*="/p-"] img'); i++) box = box.parentElement;
    if(!box) continue;
    const progs = new Map();
    for(const a of box.querySelectorAll('a[href]')){
      const m = a.getAttribute('href').match(/\/content\/kan\/[\w-]+\/p-(\d+)\/?$/);
      const img = a.querySelector('img');
      if(!m || !img || progs.has(m[1])) continue;
      const name = kanClean(img.getAttribute('alt') || a.getAttribute('aria-label'));
      if(name) progs.set(m[1], {id: m[1], url: kanAbs(a.getAttribute('href')), name, img: kanAbs(img.getAttribute('data-src') || img.getAttribute('src'))});
    }
    if(progs.size) sections.push({title, items: [...progs.values()]});
  }
  if(!sections.length) throw new Error('לא נמצאו תוכניות');
  return kanBoxCache = sections;
}
function kanCard(x){
  return `<a class="poster" href="#/kan/${encodeURIComponent(x.url.replace(KAN, ''))}/${encodeURIComponent(x.name)}">
    <div class="art" data-bg="${esc(x.img)}"></div><div class="t" dir="auto">${esc(x.name)}</div></a>`;
}

/** Episodes listed on a programme/season page. */
function kanEpisodes(doc, progPath){
  const eps = new Map();
  for(const a of doc.querySelectorAll('a[href]')){
    const href = kanAbs(a.getAttribute('href'));
    if(!href.startsWith(KAN + progPath) || !/\/\d+\/?$/.test(href.slice((KAN + progPath).length))) continue;
    if(eps.has(href)) continue;
    const title = a.querySelector('.card-title')?.textContent.trim() || a.getAttribute('aria-label') || a.textContent.trim().split('\n')[0];
    if(!title || /^לצפייה ב/.test(title.trim())) continue;     // skip "watch the first episode" promo links
    eps.set(href, {url: href, name: title.trim(), text: a.querySelector('.card-text')?.textContent.trim() || '',
                   img: kanAbs(a.querySelector('img')?.getAttribute('src'))});
  }
  return [...eps.values()];
}

async function viewKanProgram(path, title){
  renderCats(null);
  $('#app').innerHTML = `<div class="page"><div class="showhead"><div><h1 dir="auto">${esc(title || '')}</h1><p id="kdesc"></p></div></div>
    <div class="seasons" id="seasons"></div><div class="eplist" id="eps"><p class="note">טוען פרקים…</p></div></div>`;

/* ---------- Israeli Film Archive · Jerusalem Cinematheque (jfc.org.il) ----------
   130 years of films made here: features, documentaries, newsreels and home movies, with a Hebrew
   synopsis for every one. The archive plays its films on its own site, behind a free account (and a
   payment for some of the newer features), so the catalogue is read here and the film itself opens
   in the in-app window, signed in with the viewer's own account. */
const JFC = 'https://jfc.org.il';
const JFC_LOBBIES = [
  ['/lobby/israeli-cinema/', 'סרטי קולנוע'],
  ['/lobby/archive-materials/', 'חומרי ארכיון'],
  ['/lobby/a-selection-of-israel-film-service-films/', 'שירות הסרטים הישראלי'],
  ['/collection/', 'אוספים'],
];
const jfcCache = {};

/** One lobby page of the archive, as rows of films (the page is served ready-made). */
async function jfcLobby(path){
  if(jfcCache[path]) return jfcCache[path];
  const html = await fetchText(JFC + path);
  const rows = [];
  // a page is a series of "stripes", each with a heading and a row of items
  const parts = html.split(/<div class="stripe-row/).slice(1);
  for(const part of parts){
    const title = (part.match(/<h2 class="stripe-title[^"]*"[^>]*>([\s\S]*?)<\/h2>/) || [])[1];
    if(!title) continue;
    const items = jfcItems(part);
    if(items.length) rows.push({title: jfcText(title), items});
  }
  if(!rows.length){                                          // a plain grid page (collections)
    const items = jfcItems(html);
    if(items.length) rows.push({title: 'הכל', items});
  }
  jfcCache[path] = rows;
  return rows;
}

const jfcText = t => t.replace(/<[^>]+>/g, '').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/&#0?39;|&apos;/g, "'").replace(/&quot;/g, '"').trim();

/** Every film link on a page, with its poster, kind, year and whether it costs money. */
function jfcItems(html){
  const out = [], seen = new Set();
  // films, newsreel moments, home movies, collections - every kind the archive lists
  for(const m of html.matchAll(/<a href='(https:\/\/jfc\.org\.il\/(?:movie|news_journal|general_film|collection|compilation|interviews-with-creators)\/[^']+)'([\s\S]*?)<\/a>/g)){
    const [, url, body] = m;
    if(seen.has(url) || !/class='item/.test(body)) continue;
    const title = jfcText((body.match(/<h3 class='item_title'>([\s\S]*?)<\/h3>/) || [])[1] || '');
    if(!title) continue;
    seen.add(url);
    out.push({
      url, title,
      poster: (body.match(/(?:background-image: url\(|data-bg=')([^')]+)/) || [])[1] || '',
      kind: jfcText((body.match(/item_type_with_icon[^>]*>[\s\S]*?<span>([\s\S]*?)<\/span>/) || [])[1] || ''),
      by: jfcText((body.match(/extra-by-post-container[^>]*>([\s\S]*?)<\/div>/) || [])[1] || ''),
      len: jfcText((body.match(/<p class='item-length'>([\s\S]*?)<\/p>/) || [])[1] || ''),
      paid: /item_tag kind[^>]*>\s*בתשלום/.test(body),
    });
  }
  return out;
}

function jfcCard(x){
  const art = x.poster ? `<div class="art" data-bg="${esc(x.poster)}">${x.paid ? '<span class="svc">בתשלום</span>' : ''}</div>`
