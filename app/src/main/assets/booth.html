<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=Rubik:wght@500;700;800&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<script>
// Apply saved skin/layout/language before first paint (Settings page). TV devices default to the TV layout.
const RTL_LANGS = ['he', 'ar', 'fa', 'ur'];
const dirOf = l => RTL_LANGS.includes(l) ? 'rtl' : 'ltr';
try{
  const s = JSON.parse(localStorage.getItem('booth:settings') || '{}'), r = document.documentElement;
  r.lang = s.uiLang || 'he'; r.dir = dirOf(r.lang);
  const tv = !!(window.BoothAndroid && BoothAndroid.isTv && BoothAndroid.isTv());
  r.dataset.skin = s.skin || 'veo'; r.dataset.layout = s.layout || (tv ? 'tv' : 'cinema'); r.dataset.poster = s.poster || 'm'; r.dataset.nosrc = s.nosrc || 'grey';
}catch(e){}
</script>

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/chrome.css">
<link rel="stylesheet" href="css/content.css">
<link rel="stylesheet" href="css/title.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/live.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/player.css">
<link rel="stylesheet" href="css/layouts.css">
<link rel="stylesheet" href="css/focus.css">
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/responsive.css">
</head>

<body>
<!-- The whole of the app's chrome is one menu down the side the writing starts from. On a phone it
     waits off-screen and the button below opens it. -->
<button class="railbtn" id="railbtn" aria-expanded="false" aria-controls="rail" data-i18n-aria="nav.menuAria">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
</button>
<div class="scrim" id="scrim" hidden></div>

<aside class="rail" id="rail" data-i18n-aria="nav.aria">
  <div class="logo" role="img" data-i18n-aria="nav.homeAria"><img src="veo-mark.png" width="26" height="26" alt="" aria-hidden="true"><span class="lbl">VEO</span></div>

  <form class="search" id="sf">
    <button class="ic" type="submit" data-i18n-aria="search.aria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button>
    <input id="q" data-i18n-ph="search.placeholder" data-i18n-aria="search.aria">
  </form>

  <nav class="nav">
    <a href="#/cat/movies" data-r="movies"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="M2.5 9.5h19M7 4.5v5M12 4.5v5M17 4.5v5"/></svg></span><span class="lbl" data-i18n="nav.movies"></span></a>
    <a href="#/cat/series" data-r="series"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="19" height="13" rx="2"/><path d="M8 3l4 4 4-4"/></svg></span><span class="lbl" data-i18n="nav.series"></span></a>
    <a href="#/live" data-r="live"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2.2"/><path d="M8.3 8.3a5.3 5.3 0 0 0 0 7.4M15.7 15.7a5.3 5.3 0 0 0 0-7.4M5.4 5.4a9.3 9.3 0 0 0 0 13.2M18.6 18.6a9.3 9.3 0 0 0 0-13.2"/></svg></span><span class="lbl" data-i18n="nav.live"></span></a>
    <a href="#/library" data-r="library"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.3s-7.2-4.4-7.2-9.4a3.9 3.9 0 0 1 7.2-2.1 3.9 3.9 0 0 1 7.2 2.1c0 5-7.2 9.4-7.2 9.4z"/></svg></span><span class="lbl" data-i18n="nav.library"></span></a>
    <a href="#/settings" data-r="settings"><span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h8M17.5 7H20M4 12h2.5M12 12h8M4 17h6.5M15.5 17H20"/><circle cx="14.5" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="13" cy="17" r="2"/></svg></span><span class="lbl" data-i18n="nav.settings"></span></a>
  </nav>
</aside>

<main id="app"></main>

<div class="player" id="player">
  <header><button class="btn ghost" id="close" data-i18n="common.close"></button><b id="ptitle"></b></header>
  <div id="pbody" style="flex:1;display:flex;min-height:0"></div>
</div>


<div id="tstatus" role="status" aria-live="polite" class="tstat">
  <span id="tstatusMsg"></span>
  <span class="tbar" id="tbar" hidden><i id="tbarFill"></i></span>
  <button id="tstatusBtn"></button>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
