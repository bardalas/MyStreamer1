<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<style>
  body{margin:0!important;padding:0!important;width:100%!important;background:#050a16;-webkit-text-size-adjust:100%}
  @media (max-width:480px){
    .wrap{padding:16px 10px!important}
    .card{border-radius:18px!important}
    .pad{padding-left:20px!important;padding-right:20px!important}
    .title{font-size:22px!important;line-height:30px!important}
    .code{font-size:32px!important;letter-spacing:6px!important;padding:14px 18px!important}
  }
</style>
</head>
<body style="margin:0;padding:0;background:#050a16;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;color:#050a16;font-size:1px;line-height:1px;">קוד הכניסה שלכם ל-VEO: {{ .Token }}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" dir="rtl" style="background:#050a16;">
<tr><td align="center" class="wrap" style="padding:32px 16px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" dir="rtl" class="card" style="width:100%;max-width:480px;background:#0d1526;border:1px solid #25304d;border-radius:24px;">
    <tr><td align="center" class="pad" style="padding:36px 32px 8px;">
      <img src="https://raw.githubusercontent.com/bardalas/VEO/main/app/src/main/assets/veo-mark.png" width="72" height="72" alt="VEO" style="display:block;border:0;outline:none;width:72px;height:72px;">
    </td></tr>
    <tr><td align="center" class="pad title" style="padding:10px 32px 0;font-family:Arial,Helvetica,sans-serif;color:#e9f0ff;font-size:26px;line-height:34px;font-weight:bold;">
      ברוכים הבאים ל-VEO
    </td></tr>
    <tr><td align="center" class="pad" style="padding:10px 32px 24px;font-family:Arial,Helvetica,sans-serif;color:#a9b4d0;font-size:16px;line-height:26px;">
      הנה קוד הכניסה שלכם.<br>הקלידו אותו בדף שבו התחלתם להתחבר.
    </td></tr>
    <tr><td align="center" class="pad" style="padding:0 32px 22px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" dir="ltr" style="margin:0 auto;">
        <tr><td align="center" class="code" style="background:#080f1d;border:2px solid #3d8bff;border-radius:16px;padding:18px 30px;font-family:'Courier New',Courier,monospace;color:#ffffff;font-size:38px;line-height:44px;font-weight:bold;letter-spacing:10px;">{{ .Token }}</td></tr>
      </table>
    </td></tr>
    <tr><td align="center" class="pad" style="padding:0 32px 6px;font-family:Arial,Helvetica,sans-serif;color:#8e98b4;font-size:14px;line-height:22px;">
      הקוד תקף למספר דקות בלבד.
    </td></tr>
    <tr><td align="center" class="pad" style="padding:0 32px 32px;font-family:Arial,Helvetica,sans-serif;color:#7683a3;font-size:13px;line-height:20px;">
      לא ביקשתם קוד? אפשר להתעלם מהמייל הזה.
    </td></tr>
  </table>
  <div style="padding-top:16px;font-family:Arial,Helvetica,sans-serif;color:#7683a3;font-size:12px;line-height:18px;">VEO · הטלוויזיה שלכם, בכל מקום</div>
</td></tr>
</table>
</body>
</html>
