name: Refresh Booth catalogs

# Rebuilds the Hebrew/Arabic catalogs (addon/) from Wikidata every week.
# The app reads them from raw.githubusercontent.com, so no app release is needed.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build catalogs
        run: python tools/build_catalogs.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Refresh Booth catalogs"
          git push
