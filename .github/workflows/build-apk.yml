name: Build MyStreamer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Extract MyStreamer
        run: |
          rm -rf source
          mkdir source
          unzip MyStreamer-Android-v0.4.0-alpha-GitHub.zip -d source
          ls -la source

      - name: Build APK
        working-directory: source
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyStreamer-v0.4.0-alpha-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
